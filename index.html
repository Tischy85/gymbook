// ── 2. AUTO-SELECT INPUT FIELDS ──────────────────────────────
document.addEventListener('focusin', e => {
  if (e.target.classList.contains('set-input') || e.target.tagName === 'INPUT') {
    setTimeout(() => e.target.select(), 0);
  }
});

// ── 3. UNSAVED WARNING ────────────────────────────────────────
window.addEventListener('beforeunload', e => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ── 4. DEFAULT PAUSE TIME PER EXERCISE ───────────────────────
function getEffectivePause(ex) {
  const displayName = swappedExercises[Object.keys(swappedExercises).find(k => DAYS[currentDay].exercises[k]?.name === ex.name)] || ex.name;
  return defaultPauseOverrides[displayName] || defaultPauseOverrides[ex.name] || parsePause(ex.pause);
}

// Save custom pause when user adjusts timer
function adjustTimer(delta) {
  if (timerPaused) {
    timerPausedAt = Math.max(0, timerPausedAt + delta);
    timerTotal = Math.max(timerTotal, timerPausedAt);
  } else {
    timerStartTime -= delta * 1000;
    const remaining = getRemainingSeconds();
    timerTotal = Math.max(timerTotal, remaining);
    clearTimeout(notificationTimeout);
    scheduleNotification(remaining, timerExerciseName);
  }
  // Save as default for this exercise
  if (timerExerciseName) {
    defaultPauseOverrides[timerExerciseName] = Math.round(getRemainingSeconds()) || timerTotal;
    savePauseSettings();
  }
  updateTimerDisplay();
}

// ── 5. PROGRESS OVERVIEW ─────────────────────────────────────
function showProgress() {
  const allKeys = storageGetAllKeys().filter(k => {
    const parts = k.split(':');
    return parts.length === 3 && !['customplan','customcatalog','pausesettings'].includes(parts[1]);
  });
  const sessionsByDay = {};
  DAYS.forEach(d => { sessionsByDay[d.id] = 0; });
  allKeys.forEach(k => {
    const parts = k.split(':');
    if (sessionsByDay[parts[1]] !== undefined) sessionsByDay[parts[1]]++;
  });
  const totalSessions = allKeys.length;

  const weightHistory = {};
  const volumeHistory = {}; // date -> total volume
  allKeys.sort().forEach(k => {
    const raw = storageGet(k);
    if (!raw) return;
    const sets = raw.sets || raw;
    const swapped = raw.swapped || {};
    const dayId = k.split(':')[1];
    const date = k.split(':')[2];
    const day = DAYS.find(d => d.id === dayId);
    if (!day) return;
    let dayVolume = 0;
    day.exercises.forEach((ex, ei) => {
      const name = swapped[ei] || ex.name;
      const exSets = sets[ei]?.sets || [];
      const maxW = Math.max(...exSets.map(s => parseFloat(s.weight) || 0));
      if (maxW > 0) {
        if (!weightHistory[name]) weightHistory[name] = [];
        weightHistory[name].push({ weight: maxW });
      }
      // Volume = sets × reps × weight
      exSets.forEach(s => {
        const w = parseFloat(s.weight) || 0;
        const r = parseInt(s.reps) || 0;
        if (w > 0 && r > 0) dayVolume += w * r;
      });
    });
    if (dayVolume > 0) volumeHistory[date] = (volumeHistory[date] || 0) + dayVolume;
  });

  const bestLifts = {};
  Object.entries(weightHistory).forEach(([name, entries]) => {
    bestLifts[name] = Math.max(...entries.map(e => e.weight));
  });

  const sessionDates = [...new Set(allKeys.map(k => k.split(':')[2]))].sort().reverse();
  let streak = 0;
  let checkDate = new Date(); checkDate.setHours(0,0,0,0);
  for (const date of sessionDates) {
    const d = new Date(date);
    const diff = Math.round((checkDate - d) / 86400000);
    if (diff <= 7) { streak++; checkDate = d; } else break;
  }

  const progressExercises = Object.entries(weightHistory)
    .filter(([, e]) => e.length >= 2)
    .map(([name, entries]) => {
      const first = entries[0].weight;
      const last = entries[entries.length-1].weight;
      return { name, diff: last - first, last6: entries.slice(-6), first, last };
    })
    .sort((a,b) => b.diff - a.diff).slice(0, 5);

  // Missed session detection
  const expectedDays = { upper: 1, push: 3, pull: 5 }; // Mon=1, Wed=3, Fri=5
  const today = new Date();
  const missedWarnings = [];
  Object.entries(expectedDays).forEach(([dayId, weekday]) => {
    const lastMonday = new Date(today);
    lastMonday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
    const expectedDate = new Date(lastMonday);
    expectedDate.setDate(lastMonday.getDate() + weekday - 1);
    if (expectedDate < today) {
      const key = getKey(dayId, expectedDate.toISOString().slice(0,10));
      if (!storageGet(key)) {
        const day = DAYS.find(d => d.id === dayId);
        const weekdays = ['So','Mo','Di','Mi','Do','Fr','Sa'];
        missedWarnings.push(`${weekdays[expectedDate.getDay()]} ${formatDate(expectedDate.toISOString().slice(0,10))}: ${day?.type}`);
      }
    }
  });

  // Volume last 8 sessions
  const volumeEntries = Object.entries(volumeHistory).sort().slice(-8);
  const maxVolume = Math.max(...volumeEntries.map(([,v]) => v), 1);

  let html = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Fortschritt</h2>
    ${missedWarnings.length > 0 ? `
    <div style="background:rgba(232,96,96,0.08);border:0.5px solid rgba(232,96,96,0.3);border-radius:8px;padding:10px 14px;margin-bottom:14px">
      <div style="font-family:var(--mono);font-size:10px;color:var(--red);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em">⚠ Ausgelassene Einheiten</div>
      ${missedWarnings.map(w => `<div style="font-family:var(--mono);font-size:11px;color:var(--muted)">${w}</div>`).join('')}
    </div>` : ''}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 16px">
      <div style="background:var(--bg3);border-radius:8px;padding:12px;text-align:center">
        <div style="font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent)">${totalSessions}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.06em">Einheiten</div>
      </div>
      <div style="background:var(--bg3);border-radius:8px;padding:12px;text-align:center">
        <div style="font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent)">${streak}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.06em">Streak</div>
      </div>
      <div style="background:var(--bg3);border-radius:8px;padding:12px;text-align:center">
        <div style="font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent)">${Object.keys(bestLifts).length}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.06em">Übungen</div>
      </div>
    </div>
    ${volumeEntries.length >= 2 ? `
    <div style="margin-bottom:16px;background:var(--bg3);border-radius:8px;padding:12px">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Trainingsvolumen (letzte ${volumeEntries.length} Einheiten)</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:40px">
        ${volumeEntries.map(([date, vol], i) => {
          const pct = Math.round((vol / maxVolume) * 100);
          const isLast = i === volumeEntries.length - 1;
          return `<div style="flex:1;background:${isLast ? 'var(--accent)' : 'var(--bg4)'};border-radius:2px 2px 0 0;height:${pct}%;min-height:4px" title="${Math.round(vol).toLocaleString()} kg Gesamtvolumen"></div>`;
        }).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px">
        <span style="font-family:var(--mono);font-size:9px;color:var(--muted2)">${formatDate(volumeEntries[0][0])}</span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--accent)">${Math.round(volumeEntries[volumeEntries.length-1][1]).toLocaleString()} kg</span>
      </div>
    </div>` : ''}
    <div style="margin-bottom:16px">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Einheiten pro Tag</div>
      ${DAYS.map(d => `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span style="font-family:var(--mono);font-size:10px;color:var(--muted);width:80px;flex-shrink:0">${d.type}</span>
          <div style="flex:1;background:var(--bg3);border-radius:4px;height:5px;overflow:hidden">
            <div style="height:100%;background:var(--accent);border-radius:4px;width:${totalSessions > 0 ? Math.round((sessionsByDay[d.id] / Math.max(...Object.values(sessionsByDay), 1)) * 100) : 0}%"></div>
          </div>
          <span style="font-family:var(--mono);font-size:11px;color:var(--text);width:16px;text-align:right">${sessionsByDay[d.id]}</span>
        </div>
      `).join('')}
    </div>
    ${progressExercises.length > 0 ? `
    <div style="margin-bottom:16px">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Gewichtsentwicklung</div>
      ${progressExercises.map(ex => `
        <div style="margin-bottom:10px;background:var(--bg3);border-radius:8px;padding:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:12px;font-weight:500;color:var(--text)">${ex.name}</span>
            <span style="font-family:var(--mono);font-size:11px;color:${ex.diff > 0 ? 'var(--accent)' : 'var(--muted)'}">${ex.diff > 0 ? '+' : ''}${ex.diff} kg</span>
          </div>
          <div style="display:flex;align-items:flex-end;gap:3px;height:28px">
            ${ex.last6.map((e, i) => {
              const maxW = Math.max(...ex.last6.map(x => x.weight));
              const pct = maxW > 0 ? Math.round((e.weight / maxW) * 100) : 0;
              const isLast = i === ex.last6.length - 1;
              return `<div style="flex:1;background:${isLast ? 'var(--accent)' : 'var(--bg4)'};border-radius:2px 2px 0 0;height:${pct}%;min-height:4px"></div>`;
            }).join('')}
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:4px">
            <span style="font-family:var(--mono);font-size:9px;color:var(--muted2)">${ex.first} kg</span>
            <span style="font-family:var(--mono);font-size:9px;color:var(--accent)">${ex.last} kg</span>
          </div>
        </div>
      `).join('')}
    </div>` : ''}
    ${Object.keys(bestLifts).length > 0 ? `
    <div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Bestleistungen</div>
      ${Object.entries(bestLifts).sort((a,b) => b[1]-a[1]).slice(0,10).map(([name, weight]) => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)">
          <span style="font-size:12px;color:var(--text)">${name}</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500">${weight} kg</span>
        </div>
      `).join('')}
    </div>` : '<div style="font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:20px 0">Noch keine Gewichte eingetragen</div>'}
  `;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}

// ── OFFLINE / SERVICE WORKER ──────────────────────────────────
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'gymbook-v1';
    const ASSETS = [location.href];
    self.addEventListener('install', e => e.waitUntil(
      caches.open(CACHE).then(c => c.addAll(ASSETS))
    ));
    self.addEventListener('fetch', e => {
      if (e.request.url.includes('jsonbin.io')) return;
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
          return res;
        }))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
// ─────────────────────────────────────────────────────────────

// Init
renderNav();
renderDay();
// Cloud lädt im Hintergrund – UI ist sofort sichtbar
cloudInit();
</script>
