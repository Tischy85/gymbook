// Beim Abhaken leere Felder mit dem angezeigten Vorschlag (Platzhalter)
// füllen. Vorher wurde ein Satz ohne Eintippen als "erledigt" ohne Werte
// gespeichert und fehlte danach in Verlauf, Rekorden und Vorschlägen.
function fillFromPlaceholder(inputId, set, field) {
  const el = document.getElementById(inputId);
  if (!el || el.value || !/^\d+(\.\d+)?$/.test(el.placeholder)) return;
  el.value = el.placeholder;
  set[field] = el.placeholder;
}

function toggleDone(ei, s) {
  collectInputValues();
  if (!sessionData[ei]) sessionData[ei] = { sets: [] };
  if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
  if (!sessionData[ei].sets[s].done) {
    fillFromPlaceholder(`w-${ei}-${s}`, sessionData[ei].sets[s], 'weight');
    fillFromPlaceholder(`r-${ei}-${s}`, sessionData[ei].sets[s], 'reps');
  }
  sessionData[ei].sets[s].done = !sessionData[ei].sets[s].done;
  const btn = document.getElementById(`chk-${ei}-${s}`);
  const w = document.getElementById(`w-${ei}-${s}`);
  const r = document.getElementById(`r-${ei}-${s}`);
  const done = sessionData[ei].sets[s].done;
  btn.classList.toggle('checked', done);
  if(w) w.classList.toggle('done', done);
  if(r) r.classList.toggle('done', done);

  // Haptic feedback
  if (navigator.vibrate) navigator.vibrate(done ? [30] : [10]);

  // Fortschrittsbalken der Karte sofort nachziehen. Ohne das aktualisiert
  // sich die Anzeige erst beim nächsten vollen Neuaufbau – also erst, wenn
  // alle Sätze erledigt sind. Genau das wirkte vorher wie "die Punkte
  // stimmen nicht".
  updateProgressBars(ei);

  if (done) {
    // Gewicht in den nächsten Satz übernehmen, falls dort leer. Die
    // Wiederholungen bewusst NICHT – dort steht das eigene Satzziel als
    // Vorschlag (setTargets), das sonst überschrieben würde.
    const nextS = s + 1;
    const activeSets = sessionData[ei]?.activeSets ?? DAYS[currentDay].exercises[ei].sets;
    if (nextS < activeSets) {
      if (!sessionData[ei].sets[nextS]) sessionData[ei].sets[nextS] = { weight: '', reps: '', done: false };
      if (!sessionData[ei].sets[nextS].weight && sessionData[ei].sets[s].weight) {
        sessionData[ei].sets[nextS].weight = sessionData[ei].sets[s].weight;
        const nextW = document.getElementById(`w-${ei}-${nextS}`);
        if (nextW) nextW.value = sessionData[ei].sets[s].weight;
      }
    }

    // PR check
    const weight = parseFloat(sessionData[ei].sets[s].weight);
    if (!isNaN(weight) && weight > 0) {
      const ex = DAYS[currentDay].exercises[ei];
      const displayName = swappedExercises[ei] || ex.name;
      const displayId = swappedExerciseIds[ei] || ex.id || slugify(ex.name);
      // Bisheriger Rekord OHNE die laufende Einheit …
      const pr = getPersonalRecordById(displayId, displayName, getKey(DAYS[currentDay].id, activeDateStr()));
      // … plus die schon abgehakten anderen Sätze dieser Übung heute, damit
      // die Meldung nicht bei jedem weiteren Satz mit gleichem Gewicht kommt.
      const todayBest = Math.max(0, ...sessionData[ei].sets
        .filter((st, i) => i !== s && st.done)
        .map(st => parseFloat(st.weight) || 0));
      // pr > 0: beim allerersten Training einer Übung gibt es keinen Rekord zu brechen
      if (pr > 0 && weight > pr && weight > todayBest) {
        showPRCelebration(`🏆 Neuer Rekord! ${weight} kg`);
      } else {
        // Kein Gewichtsrekord, aber vielleicht mehr Wiederholungen als je
        // zuvor auf diesem Niveau – gemessen am geschätzten 1RM.
        const cur = sessionData[ei].sets[s];
        const est = e1rm(cur.weight, cur.reps);
        const prevBest = Math.max(
          getBestE1rmById(displayId, displayName, getKey(DAYS[currentDay].id, activeDateStr())),
          bestE1rm(sessionData[ei].sets.filter((st, i) => i !== s && st.done)));
        if (prevBest > 0 && est > prevBest) showPRCelebration(`🏆 Bestleistung! ${cur.weight} kg × ${cur.reps} (≈ ${est} kg 1RM)`);
      }
    }

    // Check if all sets done → auto-collapse
    const ex = DAYS[currentDay].exercises[ei];
    const activeSetsCount = sessionData[ei]?.activeSets ?? ex.sets;
    const allDone = sessionData[ei].sets.slice(0, activeSetsCount).every(st => st.done);
    if (allDone) {
      setTimeout(() => {
        const body = document.getElementById(`exbody-${ei}`);
        const chev = document.getElementById(`chev-${ei}`);
        if (body) body.classList.remove('open');
        if (chev) chev.classList.remove('open');
        renderDay(); // re-render to update dots reliably
      }, 600);
    }
  }

  autoSave();
  updateTrainingEnd();

  if (done && timerEnabled) {
    const day = DAYS[currentDay];
    const ex = day.exercises[ei];
    const displayName = swappedExercises[ei] || ex.name;
    const pauseOf = i => defaultPauseOverrides[swappedExercises[i] || day.exercises[i].name] || parsePause(day.exercises[i].pause);
    const nxt = nextSetAfter(ei, s);
    const ss = supersetInfo(day, ei);
    unlockAudio();
    if (nxt?.superset === 'switch') {
      // Supersatz A → B: nur kurzer Wechsel, kein iPhone-Timer
      startTimer(SUPERSET_SWITCH_SEC, displayName, ei, s, `WECHSEL → ${(swappedExercises[nxt.ei] || day.exercises[nxt.ei].name).toUpperCase()}`);
    } else {
      // Nach einer Supersatz-Runde gilt die längere der beiden Pausen
      const seconds = ss ? Math.max(pauseOf(ei), pauseOf(ss.partner)) : pauseOf(ei);
      startTimer(seconds, displayName, ei, s);
      runTimerShortcut(seconds);
    }
  } else if (!done) {
    closeTimer();
  }
}

function exportSummary() {
  const day = DAYS[currentDay];
  const date = activeDateStr();
  const noteKey = `gymbook:note:${day.id}:${date}`;
  const note = storageGet(noteKey) || '';

  let text = `🏋️ GYMBOOK – ${day.type}\n`;
  text += `📅 ${formatDate(date)}\n`;
  text += `─────────────────────\n`;

  day.exercises.forEach((ex, ei) => {
    const displayName = swappedExercises[ei] || ex.name;
    const sd = sessionData[ei] || { sets: [] };
    const skipped = sd.skipped;

    if (skipped) {
      text += `✕ ${displayName} (${skipped.reason})\n`;
      return;
    }

    const filledSets = loggedSets(sd.sets);
    if (filledSets.length) {
      text += `${displayName}\n`;
      filledSets.forEach((s, i) => {
        text += `  Satz ${i+1}: ${formatSet(s, {long:true})}${s.done ? ' ✓' : ''}\n`;
      });
    } else {
      text += `○ ${displayName} (kein Eintrag)\n`;
    }
  });

  if (note) {
    text += `─────────────────────\n`;
    text += `📝 ${note}\n`;
  }

  text += `─────────────────────\n`;
  text += `Erstellt mit GymBook`;

  // Share or copy
  if (navigator.share) {
    navigator.share({ title: `GymBook ${formatDate(date)}`, text });
  } else {
    navigator.clipboard.writeText(text).then(() => {
      setStatus('📋 Zusammenfassung kopiert!', true);
      setTimeout(() => setStatus('☁ Synchronisiert', true), 2500);
    });
  }
}

function exportData() {
  const allData = {};
  storageGetAllKeys().forEach(k => {
    allData[k] = storageGet(k);
  });
  if (!Object.keys(allData).length) {
    alert('Noch keine Daten zum Exportieren vorhanden.');
    return;
  }
  const json = JSON.stringify({ version: 1, exported: todayStr(), data: allData }, null, 2);
  const filename = `gymbook-backup-${todayStr()}.json`;

  const done = () => {
    try { localStorage.setItem('gymbook_lastBackup', String(Date.now())); } catch (e) {}
    setStatus(`Export gespeichert — ${formatDate(todayStr())}`, true);
    if (currentTab === 'home') renderHome();     // Backup-Erinnerung ausblenden
  };

  // Am iPhone (vor allem als Homescreen-App) landet ein Download-Link oft im
  // Nichts. Dort stattdessen das Teilen-Menü öffnen – "In Dateien sichern",
  // AirDrop, Mail … Am Rechner bleibt es beim normalen Download.
  const file = new File([json], filename, { type: 'application/json' });
  const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (isTouch && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'GymBook-Backup' })
      .then(done)
      .catch(err => {
        // Abbrechen im Teilen-Menü ist kein Fehler – nur nicht als Backup zählen
        if (err && err.name !== 'AbortError') setStatus('⚠ Export fehlgeschlagen', false);
      });
    return;
  }

  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Erst später freigeben: Sofortiges Freigeben brach den Download in
  // manchen Browsern (u. a. Safari) ab, bevor er überhaupt begonnen hatte.
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  done();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      const incoming = parsed.data || parsed; // support both formats
      const keys = Object.keys(incoming).filter(k => k.startsWith('gymbook:'));
      if (!keys.length) { alert('Keine gültigen GymBook-Daten in der Datei gefunden.'); return; }

      const existingKeys = storageGetAllKeys();
      let skipped = 0;
      let imported = 0;

      keys.forEach(k => {
        if (existingKeys.includes(k)) {
          skipped++;
        } else {
          storageSet(k, incoming[k]);
          imported++;
        }
      });

      const msg = skipped > 0
        ? `${imported} Einträge importiert, ${skipped} bereits vorhanden (nicht überschrieben).`
        : `${imported} Einträge erfolgreich importiert.`;

      // Show result in modal
      document.getElementById('modal-content').innerHTML = `
        <button class="modal-close" onclick="closeModal()">×</button>
        <h2>Import abgeschlossen</h2>
        <div style="margin-top:16px;font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.8">${msg}</div>
        ${skipped > 0 ? `<div style="margin-top:12px;font-family:var(--mono);font-size:13px;color:var(--muted2)">Vorhandene Einträge werden nie überschrieben, um Datenverlust zu vermeiden.</div>` : ''}
        <button class="btn btn-accent" style="margin-top:20px;width:100%" onclick="closeModal();renderDay()">OK</button>
      `;
      document.getElementById('modal').style.display = 'flex';
      event.target.value = '';
    } catch(err) {
      alert('Fehler beim Lesen der Datei. Bitte eine gültige GymBook JSON-Datei auswählen.');
    }
  };
  reader.readAsText(file);
}

// ── DRAG TO REORDER (Touch-basiert für Mobile) ────────────────
let dragSrcEi = null;
let dragTouchY = 0;
let dragEl = null;

function onDragHandleTouch(ei, e) {
  e.preventDefault();
  dragSrcEi = ei;
  dragTouchY = e.touches[0].clientY;
  dragEl = e.currentTarget.closest('.edit-card');
  if (dragEl) dragEl.style.opacity = '0.5';

  document.addEventListener('touchmove', onDragTouchMove, { passive: false });
  document.addEventListener('touchend', onDragTouchEnd);
}

function onDragTouchMove(e) {
  e.preventDefault();
  const y = e.touches[0].clientY;
  const cards = document.querySelectorAll('.edit-card');
  let targetEi = null;
  cards.forEach((card, i) => {
    const rect = card.getBoundingClientRect();
    if (y >= rect.top && y <= rect.bottom) targetEi = i;
  });
  if (targetEi !== null && targetEi !== dragSrcEi) {
    const di = currentDay;
    const ex = DAYS[di].exercises.splice(dragSrcEi, 1)[0];
    DAYS[di].exercises.splice(targetEi, 0, ex);
    if (editDraft) {
      const exD = editDraft[di].exercises.splice(dragSrcEi, 1)[0];
      editDraft[di].exercises.splice(targetEi, 0, exD);
    }
    dragSrcEi = targetEi;
    renderDay();
    // Re-attach listeners after re-render
    document.addEventListener('touchmove', onDragTouchMove, { passive: false });
    document.addEventListener('touchend', onDragTouchEnd);
  }
}

function onDragTouchEnd() {
  if (dragEl) dragEl.style.opacity = '';
  dragEl = null;
  dragSrcEi = null;
  document.removeEventListener('touchmove', onDragTouchMove);
  document.removeEventListener('touchend', onDragTouchEnd);
}

// Desktop drag support
function onDragStart(ei) { dragSrcEi = ei; }
function onDragOver(ei, e) {
  e.preventDefault();
  if (dragSrcEi === null || dragSrcEi === ei) return;
  const di = currentDay;
  const moved = DAYS[di].exercises.splice(dragSrcEi, 1)[0];
  DAYS[di].exercises.splice(ei, 0, moved);
  if (editDraft) {
    const movedD = editDraft[di].exercises.splice(dragSrcEi, 1)[0];
    editDraft[di].exercises.splice(ei, 0, movedD);
  }
  dragSrcEi = ei;
  renderDay();
}
function onDragEnd() { dragSrcEi = null; }

// Für jede Übungs-ID: in welchen Tagen (über alle Pläne) kommt sie aktuell vor
function getDaysContainingExercise(exerciseId) {
  const matches = [];
  Object.values(PLAN_DEFS).forEach(plan => {
    plan.days.forEach(day => {
      if (day.exercises.some(ex => ex.id === exerciseId)) {
        matches.push({ planName: plan.shortName, dayType: day.type });
      }
    });
  });
  return matches;
}

function renderExercisesInner() {
  const term = (document.getElementById('exercises-search')?.value || '').toLowerCase().trim();
  const totalCount = Object.values(CATALOG).reduce((sum, cat) => sum + cat.exercises.length, 0);

  // Übungsliste: nach gewähltem Bereich, zusätzlich nach Suchbegriff gefiltert
  let exercisesToShow = [];
  if (exercisesActiveMuscle === 'all') {
    Object.values(CATALOG).forEach(cat => exercisesToShow.push(...cat.exercises.filter(Boolean)));
  } else {
    exercisesToShow = CATALOG[exercisesActiveMuscle].exercises.filter(Boolean);
  }
  if (term) {
    exercisesToShow = exercisesToShow.filter(ex => ex?.name?.toLowerCase().includes(term));
  }

  // Zähler oben aktualisieren
  const countEl = document.getElementById('exercises-count');
  if (countEl) countEl.textContent = `${exercisesToShow.length} / ${totalCount} Übungen`;

  const html = exercisesToShow.map(ex => {
    const best = getPersonalRecordById(ex.id, ex.name);
    const lastSets = getLastEntryById(ex.id, ex.name);
    // Fällt auf beste Wiederholungszahl zurück, wenn die Übung ohne Gewicht läuft
    const bestDisplay = best > 0 ? { value: best, unit: 'kg' } : bestSetValue(lastSets);
    const inDays = getDaysContainingExercise(ex.id);

    return `
      <div class="ex-list-row" onclick="showExerciseDetail(${jsArg(ex.id)}, ${jsArg(ex.name)})">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;color:var(--text)">${esc(ex.name)}</div>
          <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);margin-top:3px">

// Verlaufsliste der Statistik-Seite. Eigene Funktion, damit die Suche nur
// diese Liste neu aufbaut (updateStatsHistory) statt der ganzen Seite – sonst
// wurde das Suchfeld bei jedem Buchstaben ersetzt und die iPhone-Tastatur
// ging zu.
// Wichtig: Die angezeigten Übungsnamen kommen aus der GESPEICHERTEN Session
// (meta), nicht aus dem aktuell aktiven Plan. Sonst würden nach einer
// Plananpassung die Namen der heutigen Übungen auf alte Einträge gelegt.
function buildStatsHistoryHtml(completedKeys) {
  const term = statsSearchTerm.toLowerCase().trim();
  let historyHtml = '';
  const allDaysAcrossPlans = Object.values(PLAN_DEFS).flatMap(p => p.days);

  // Zeilen einer Session auflösen – bevorzugt über meta, sonst über den Plan
  const resolveSessionRows = (raw, dayId) => {
    const sets = raw?.sets || raw || {};
    if (raw?.meta) {
      return Object.entries(raw.meta).map(([ei, m]) => ({ name: m.name, slot: sets[ei] }));
    }
    const day = allDaysAcrossPlans.find(d => d.id === dayId);
    if (!day) return [];
    const swapped = raw?.swapped || {};
    return day.exercises.map((ex, ei) => ({ name: swapped[ei] || ex.name, slot: sets[ei] }));
  };

  // Über alle Tage aller Pläne, damit auch Einheiten aus inaktiven Plänen auftauchen
  const dayIdsWithSessions = [...new Set(completedKeys.map(k => k.split(':')[1]))];
  dayIdsWithSessions.forEach(dayId => {
    const dayDef = allDaysAcrossPlans.find(d => d.id === dayId);
    const dayKeys = sortByDate(completedKeys.filter(k => k.split(':')[1] === dayId), true).slice(0,10);
    if (!dayKeys.length) return;

    const filtered = dayKeys.filter(k => {
      if (!term) return true;
      return resolveSessionRows(storageGet(k), dayId).some(r => r.name.toLowerCase().includes(term));
    });
    if (!filtered.length) return;

    historyHtml += `<div style="margin-bottom:14px"><div style="font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">${esc(dayDef ? dayDef.type : dayId.toUpperCase())}</div>`;
    filtered.forEach(k => {
      const date = k.split(':')[2];
      const raw = storageGet(k);
      const note = storageGet(`gymbook:note:${dayId}:${date}`) || '';
      historyHtml += `<div class="history-full-entry"><div class="history-full-date">${formatDate(date)}</div><div class="history-full-sets">`;
      resolveSessionRows(raw, dayId).forEach(({ name, slot }) => {
        if (term && !name.toLowerCase().includes(term)) return;
        if (slot?.skipped) { historyHtml += `<span style="color:var(--red)">✕ ${esc(name)}</span>: ${esc(slot.skipped.reason)}<br>`; return; }
        const filled = loggedSets(slot?.sets);
        if (filled.length) historyHtml += `<span style="color:var(--text)">${esc(name)}</span>: ${filled.map(s=>esc(formatSet(s))).join(', ')}<br>`;
      });
      if (note) historyHtml += `<div style="margin-top:6px;padding:6px 8px;background:var(--bg3);border-radius:4px;border-left:2px solid var(--accent);font-size:12px;color:var(--muted);font-style:italic">${esc(note)}</div>`;
      historyHtml += `</div></div>`;
    });
    historyHtml += `</div>`;
  });
  return historyHtml || STATS_HISTORY_EMPTY;
}

const STATS_HISTORY_EMPTY = '<div style="font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center;padding:20px 0">Noch keine abgeschlossenen Einheiten</div>';

// ── SÄTZE PRO MUSKELGRUPPE ────────────────────────────────────
// Erledigte Arbeitssätze (ohne Aufwärmsätze) je Muskelgruppe in einer
// Kalenderwoche (Mo–So). weeksAgo: 0 = laufende Woche, 1 = Vorwoche.
const MUSCLE_ORDER = ['brust', 'ruecken', 'schulter', 'bizeps', 'trizeps', 'beine', 'bauch'];

function muscleSetsForWeek(weeksAgo) {
  const start = new Date();
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7) - 7 * weeksAgo);
  const end = new Date(start);
  end.setDate(start.getDate() + 7);
  const from = localDateStr(start), to = localDateStr(end);

  // Muskelfeld aus den Plänen (für Übungen, die nicht im Katalog stehen)
  const allDays = Object.values(PLAN_DEFS).flatMap(p => p.days);
  const planMuscle = {};
  allDays.forEach(d => d.exercises.forEach(ex => { if (ex.id && !planMuscle[ex.id]) planMuscle[ex.id] = ex.muscle; }));

  const counts = {};
  getSessionKeys().forEach(k => {
    const date = k.split(':')[2];
    if (date < from || date >= to) return;
    const raw = storageGet(k);
    if (!raw) return;
    const sets = raw.sets || raw;
    let rows;
    if (raw.meta) {
      rows = Object.entries(raw.meta).map(([ei, m]) => ({ id: m.id, name: m.name, muscle: planMuscle[m.id], slot: sets[ei] }));
    } else {
      const day = allDays.find(d => d.id === k.split(':')[1]);
      if (!day) return;
      rows = day.exercises.map((ex, ei) => ({ id: raw.swappedIds?.[ei] || ex.id, name: raw.swapped?.[ei] || ex.name, muscle: ex.muscle, slot: sets[ei] }));
    }
    rows.forEach(r => {
      if (!r.slot || r.slot.skipped) return;
      const n = (r.slot.sets || []).filter(x => x && x.done).length;
      if (!n) return;
      const cat = muscleCategory(r.id, r.name, r.muscle) || 'sonstige';
      counts[cat] = (counts[cat] || 0) + n;
    });
  });
  return counts;
}

function muscleSetsCardHtml() {
  const now = muscleSetsForWeek(0), prev = muscleSetsForWeek(1);
  const cats = MUSCLE_ORDER.concat(now.sonstige || prev.sonstige ? ['sonstige'] : []);
  if (!cats.some(c => now[c] || prev[c])) return '';
  const max = Math.max(1, ...cats.map(c => Math.max(now[c] || 0, prev[c] || 0)));
  const label = c => c === 'sonstige' ? 'Sonstige' : CATALOG[c].label;
  return `<div style="background:var(--bg2);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:var(--card-shadow)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <div style="font-size:13px;font-weight:600;color:var(--muted2)">Sätze pro Muskelgruppe · diese Woche</div>
      <div style="font-size:12px;color:var(--muted2)">Vorwoche</div>
    </div>
    ${cats.map(c => `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:13px;width:72px;flex-shrink:0">${label(c)}</span>
        <div style="flex:1;background:var(--bg3);border-radius:4px;height:8px;overflow:hidden">
          <div style="height:100%;width:${Math.round(((now[c] || 0) / max) * 100)}%;background:${MUSCLE_COLORS[c] || 'var(--muted2)'};border-radius:4px"></div>
        </div>
        <span style="font-size:14px;font-weight:600;width:22px;text-align:right">${now[c] || 0}</span>

}

// Übungen des aktiven Plans, die seit 3 Einheiten nicht vorankommen
function stagnatingExercises() {
  const seen = new Set(), out = [];
  DAYS.forEach(day => day.exercises.forEach(ex => {
    const id = ex.id || slugify(ex.name);
    if (seen.has(id)) return;
    seen.add(id);
    if (getStagnation(id, ex.name)) out.push(ex.name);
  }));
  return out;
}

// Verlaufslinie fürs Körpergewicht – gemeinsam für Start- und Statistikseite.
// Ein einzelner Messpunkt wird mittig gezeichnet.
function bwSparkline(history, w, h) {
  const weights = history.map(e => e.weight);
  const minW = Math.min(...weights) - 0.5;
  const range = (Math.max(...weights) + 0.5 - minW) || 1;
  const coords = history.map((e, i) => [
    history.length > 1 ? (i / (history.length - 1)) * w : w / 2,
    h - ((e.weight - minW) / range) * h
  ]);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible">
    <polyline points="${coords.map(c => c.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${coords.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`).join('')}
  </svg>`;
}

function renderStatsInner() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const dayNames = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const dayColors = DAY_COLOR_MAP;

  // All completed keys for stats
  const allKeys = getSessionKeys();
  const completedKeys = getSessionKeys(true);

  // Kalender unterscheidet jetzt: voller Punkt = abgeschlossen, hohler Punkt
  // = angefangen. Vorher zählte beides gleich, was dem Zähler "X Einheiten
  // gesamt" darüber widersprach (der nur abgeschlossene zählt).
  const sessionDates = {};
  allKeys.forEach(k => {
    const parts = k.split(':');
    const date = parts[2]; const dayId = parts[1];
    if (!sessionDates[date]) sessionDates[date] = [];
    sessionDates[date].push({ dayId, done: storageGet(k)?.completed === true });
  });

  // Calendar
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr();
    const sessions = sessionDates[dateStr] || [];
    const isPast = new Date(dateStr) < new Date(todayStr());
    const dots = sessions.map(s => {
      const col = dayColors[s.dayId] || 'var(--accent)';
      return s.done
        ? `<div style="width:5px;height:5px;border-radius:50%;background:${col}"></div>`
        : `<div style="width:5px;height:5px;border-radius:50%;border:1px solid ${col};box-sizing:border-box" title="angefangen"></div>`;
    }).join('');
    const anyDone = sessions.some(s => s.done);
    cells += `<div class="cal-cell ${isToday?'today':''} ${anyDone?'has-session':''} ${isPast&&!sessions.length?'past-empty':''}" onclick="showDayDetail('${dateStr}')">
      <span class="cal-day">${d}</span>
      ${dots ? `<div style="display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:2px">${dots}</div>` : ''}
    </div>`;
  }

  // Progress stats – gruppiert nach Übungs-ID (plan-übergreifend), Anzeige über Namen
  const weightHistory = {}; // id -> { name, entries: [{weight}] }
  const volumeHistory = {};
  sortByDate(completedKeys).forEach(k => {
    const raw = storageGet(k);
    if (!raw) return;
    const sets = raw.sets || raw;
    const metaMap = raw.meta || null;
    const date = k.split(':')[2];
    let dayVolume = 0;

    if (metaMap) {
      // Neue Struktur: id+name direkt aus der Session, keine DAYS-Abhängigkeit
      Object.entries(metaMap).forEach(([ei, m]) => {
        const exSets = sets[ei]?.sets || [];
        const maxW = Math.max(...exSets.map(s => parseFloat(s.weight) || 0), 0);
        if (maxW > 0) {
          if (!weightHistory[m.id]) weightHistory[m.id] = { name: m.name, entries: [] };
          weightHistory[m.id].entries.push({ weight: maxW });
        }
        exSets.forEach(s => { const w = parseFloat(s.weight)||0; const r = parseInt(s.reps)||0; if(w>0&&r>0) dayVolume+=w*r; });
      });
    } else {
      // Legacy: kein meta-Feld – über aktuellen DAYS-Stand auflösen
      const dayId = k.split(':')[1];
      const day = DAYS.find(d => d.id === dayId);
      if (!day) return;
      const swapped = raw.swapped || {};
      day.exercises.forEach((ex, ei) => {
        const name = swapped[ei] || ex.name;
        const id = ex.id || slugify(name);
        const exSets = sets[ei]?.sets || [];
        const maxW = Math.max(...exSets.map(s => parseFloat(s.weight) || 0), 0);
        if (maxW > 0) {
          if (!weightHistory[id]) weightHistory[id] = { name, entries: [] };
          weightHistory[id].entries.push({ weight: maxW });
        }
        exSets.forEach(s => { const w = parseFloat(s.weight)||0; const r = parseInt(s.reps)||0; if(w>0&&r>0) dayVolume+=w*r; });
      });
    }
    if (dayVolume > 0) volumeHistory[date] = (volumeHistory[date]||0) + dayVolume;
  });

  const bestLifts = {}; // name -> weight (für Anzeige)
  Object.values(weightHistory).forEach(({ name, entries }) => {
    bestLifts[name] = Math.max(...entries.map(e => e.weight));
  });

  const progressExercises = Object.values(weightHistory)
    .filter(({entries}) => entries.length >= 2)
    .map(({name, entries}) => ({ name, diff: entries[entries.length-1].weight - entries[0].weight, last6: entries.slice(-6), first: entries[0].weight, last: entries[entries.length-1].weight }))
    .sort((a,b) => b.diff - a.diff).slice(0,5);

  const volumeEntries = Object.entries(volumeHistory).sort().slice(-8);
  const maxVolume = Math.max(...volumeEntries.map(([,v]) => v), 1);

  const streak = getWeekStreak();

  const historyHtml = buildStatsHistoryHtml(completedKeys);

  // Body weight for stats
  const bwKeys = storageGetAllKeys().filter(k => k.startsWith('gymbook:bodyweight:')).sort();
  const bwHistory = bwKeys.slice(-12).map(k => ({
    date: k.split(':')[2],
    weight: parseFloat(storageGet(k))
  })).filter(e => !isNaN(e.weight));

  document.getElementById('stats-content').innerHTML = `
    <!-- KÖRPERGEWICHT -->
    ${bwHistory.length > 0 ? (() => {
      const weights = bwHistory.map(e => e.weight);
      const trend = weights.length > 1 ? weights[weights.length-1] - weights[0] : 0;
      const trendColor = trend < 0 ? 'var(--green)' : trend > 0 ? '#e87f7f' : 'var(--muted)';
      return `<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em">Körpergewicht</div>
          <button onclick="showBWInput()" style="background:var(--bg3);border:0.5px solid var(--border2);color:var(--accent);font-family:var(--mono);font-size:12px;padding:4px 12px;border-radius:6px;cursor:pointer">+ Eintrag</button>
        </div>

        <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.06em">Wochen-Streak</div>

          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <span style="font-family:var(--mono);font-size:12px;color:var(--muted);width:80px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(def ? def.type : id.toUpperCase())}</span>

    <!-- VOLUMEN -->

    <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px">
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Trainingsvolumen</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:48px">
        ${volumeEntries.map(([date,vol],i) => { const pct=Math.round((vol/maxVolume)*100); const isLast=i===volumeEntries.length-1; return `<div style="flex:1;background:${isLast?'var(--accent)':'var(--bg4)'};border-radius:2px 2px 0 0;height:${pct}%;min-height:4px" title="${Math.round(vol).toLocaleString()} kg"></div>`; }).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px">
        <span style="font-family:var(--mono);font-size:12px;color:var(--muted2)">${formatDate(volumeEntries[0][0])}</span>
        <span style="font-family:var(--mono);font-size:12px;color:var(--accent)">${Math.round(volumeEntries[volumeEntries.length-1][1]).toLocaleString()} kg</span>
      </div>
    </div>` : ''}

    <!-- GEWICHTSENTWICKLUNG -->
    ${progressExercises.length > 0 ? `
    <div style="margin-bottom:12px">
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Gewichtsentwicklung</div>
      ${progressExercises.map(ex => `
        <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:12px;font-weight:500;color:var(--text)">${esc(ex.name)}</span>
            <span style="font-family:var(--mono);font-size:13px;color:${ex.diff>0?'var(--accent)':'var(--muted)'}">${ex.diff>0?'+':''}${ex.diff} kg</span>
          </div>
          <div style="display:flex;align-items:flex-end;gap:3px;height:28px">
            ${ex.last6.map((e,i)=>{ const maxW=Math.max(...ex.last6.map(x=>x.weight)); const pct=maxW>0?Math.round((e.weight/maxW)*100):0; const isLast=i===ex.last6.length-1; return `<div style="flex:1;background:${isLast?'var(--accent)':'var(--bg4)'};border-radius:2px 2px 0 0;height:${pct}%;min-height:4px"></div>`; }).join('')}
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:4px">
            <span style="font-family:var(--mono);font-size:12px;color:var(--muted2)">${ex.first} kg</span>
            <span style="font-family:var(--mono);font-size:12px;color:var(--accent)">${ex.last} kg</span>
          </div>
        </div>
      `).join('')}
    </div>` : ''}

    <!-- BESTLEISTUNGEN -->
    ${Object.keys(bestLifts).length > 0 ? `
    <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px">
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">🏆 Bestleistungen</div>
      ${Object.entries(bestLifts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([name,weight])=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)">
          <span style="font-size:12px;color:var(--text)">${esc(name)}</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500">${weight} kg</span>
        </div>
      `).join('')}
    </div>` : ''}

    <!-- VERLAUF mit Suche -->
    <div>
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Verlauf</div>
      <input type="text" placeholder="Übung suchen…" value="${esc(statsSearchTerm)}"
        oninput="statsSearchTerm=this.value;updateStatsHistory()"
        style="background:var(--field);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:16px;padding:10px 12px;border-radius:6px;width:100%;outline:none;box-sizing:border-box;margin-bottom:12px">
      <div id="stats-history">${historyHtml}</div>
    </div>
  `;
}

function showDayDetail(dateStr) {
  const allDayKeys = getSessionKeys().filter(k => k.endsWith(`:${dateStr}`));
  if (!allDayKeys.length) return;
  const k = allDayKeys[0];
  const dayId = k.split(':')[1];
  const day = DAYS.find(d => d.id === dayId);
  const raw = storageGet(k);
  const sets = raw?.sets || raw || {};
  const swapped = raw?.swapped || {};
  const metaMap = raw?.meta || null;
  const noteKey = `gymbook:note:${dayId}:${dateStr}`;
  const note = storageGet(noteKey) || '';
  const title = day ? day.type : (Object.values(PLAN_DEFS).flatMap(p => p.days).find(x => x.id === dayId)?.type || dayId.toUpperCase());
  let html = `<button class="modal-close" onclick="closeModal()">×</button><h2>${esc(title)} · ${formatDate(dateStr)}</h2><div style="margin-top:14px">`;

  if (metaMap) {
    // Neue Struktur: unabhängig von der aktuellen DAYS-Struktur
    Object.entries(metaMap).forEach(([ei, m]) => {
      const skip = sets[ei]?.skipped;
      if (skip) { html += `<div style="padding:8px 0;border-bottom:0.5px solid var(--border);font-family:var(--mono);font-size:13px;color:var(--red)">✕ ${esc(m.name)}: ${esc(skip.reason)}</div>`; return; }
      const filled = loggedSets(sets[ei]?.sets);
      if (!filled.length) return;
      html += `<div style="padding:8px 0;border-bottom:0.5px solid var(--border)"><div style="font-size:12px;font-weight:500;color:var(--text);margin-bottom:3px">${esc(m.name)}</div><div style="font-family:var(--mono);font-size:13px;color:var(--muted)">${filled.map(s=>esc(formatSet(s))).join(' · ')}</div></div>`;
    });
  } else if (day) {
    // Legacy: kein meta-Feld – über aktuellen DAYS-Stand auflösen
    day.exercises.forEach((ex, ei) => {
      const name = swapped[ei] || ex.name;
      const skip = sets[ei]?.skipped;
      if (skip) { html += `<div style="padding:8px 0;border-bottom:0.5px solid var(--border);font-family:var(--mono);font-size:13px;color:var(--red)">✕ ${esc(name)}: ${esc(skip.reason)}</div>`; return; }
      const filled = loggedSets(sets[ei]?.sets);
      if (!filled.length) return;
      html += `<div style="padding:8px 0;border-bottom:0.5px solid var(--border)"><div style="font-size:12px;font-weight:500;color:var(--text);margin-bottom:3px">${esc(name)}</div><div style="font-family:var(--mono);font-size:13px;color:var(--muted)">${filled.map(s=>esc(formatSet(s))).join(' · ')}</div></div>`;
    });
  }
  if (note) html += `<div style="margin-top:10px;padding:8px 10px;background:var(--bg3);border-radius:6px;border-left:2px solid var(--accent);font-size:13px;color:var(--muted);font-style:italic">${esc(note)}</div>`;
  html += '</div>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}

function renderHome() {
  renderSafely('renderHome', renderHomeInner, 'home-content');
}

function renderHomeInner() {
  const now = new Date();
  const weekdays = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const greeting = now.getHours() < 12 ? 'Guten Morgen' : now.getHours() < 18 ? 'Guten Tag' : 'Guten Abend';

  document.getElementById('home-date').textContent = `${weekdays[now.getDay()]}, ${formatDate(todayStr())}`;

  // Nächste Einheit aus dem Zyklus, nicht aus dem Wochentag
  const rotation = getNextPlannedDay();
  const nextDay = rotation ? rotation.day : null;
  // Heute schon trainiert? (unabhängig davon, welcher Wochentag ist)
  const todayDone = getSessionKeys(true).find(k => k.endsWith(`:${todayStr()}`));
  const todayCompleted = !!todayDone;
  const todayDayId = todayDone ? todayDone.split(':')[1] : null;
  const todaySession = todayDayId
    ? Object.values(PLAN_DEFS).flatMap(p => p.days).find(d => d.id === todayDayId)
    : null;

  // Week stats – only completed sessions
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const weekStartStr = localDateStr(weekStart);
  const weekKeys = getSessionKeys(true).filter(k => k.split(':')[2] >= weekStartStr);
  const weekDone = weekKeys.length;

  // Total sessions – only completed
  const allKeys = getSessionKeys(true);

  const streak = getWeekStreak();

  // Last session
  const lastKey = sortByDate(allKeys, true)[0];
  let lastSessionHtml = '';
  if (lastKey) {
    const lastDayId = lastKey.split(':')[1];
    const lastDate = lastKey.split(':')[2];
    const lastDay = DAYS.find(d => d.id === lastDayId);
    const raw = storageGet(lastKey);
    if (raw) {
      const sets = raw.sets || raw;
      const metaMap = raw.meta || null;
      let entries = [];

      if (metaMap) {
        entries = Object.entries(metaMap).slice(0, 4).map(([ei, m]) => {
          const v = bestSetValue(sets[ei]?.sets);
          return v ? { name: m.name, weight: v.value, unit: v.unit } : null;
        }).filter(Boolean).slice(0, 3);
      } else if (lastDay) {
        const swapped = raw.swapped || {};
        entries = lastDay.exercises.slice(0, 4).map((ex, ei) => {
          const name = swapped[ei] || ex.name;
          const v = bestSetValue(sets[ei]?.sets);
          return v ? { name, weight: v.value, unit: v.unit } : null;
        }).filter(Boolean).slice(0, 3);
      }

      const titleType = lastDay ? lastDay.type : (Object.values(PLAN_DEFS).flatMap(p => p.days).find(x => x.id === lastDayId)?.type || lastDayId.toUpperCase());
      lastSessionHtml = `
        <div class="home-card">
          <div class="home-card-title">Letztes Training · ${esc(titleType)} · ${formatDate(lastDate)}</div>
          ${entries.map(e => `
            <div class="home-last-ex">
              <span class="home-last-ex-name">${esc(e.name)}</span>
              <span class="home-last-ex-val">${e.weight} ${e.unit || 'kg'}</span>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  // Top PRs
  const bestLifts = {};
  allKeys.forEach(k => {
    const raw = storageGet(k);
    if (!raw) return;
    const sets = raw.sets || raw;
    const metaMap = raw.meta || null;

    if (metaMap) {
      Object.entries(metaMap).forEach(([ei, m]) => {
        const exSets = sets[ei]?.sets || [];
        exSets.forEach(s => {
          const w = parseFloat(s.weight);
          if (!isNaN(w) && w > 0 && (!bestLifts[m.name] || w > bestLifts[m.name])) bestLifts[m.name] = w;
        });
      });
    } else {
      // Legacy: nur den zum Key passenden Tag durchsuchen (nicht alle DAYS!)
      const dayId = k.split(':')[1];
      const day = DAYS.find(d => d.id === dayId);
      if (!day) return;
      const swapped = raw.swapped || {};
      day.exercises.forEach((ex, ei) => {
        const name = swapped[ei] || ex.name;
        const exSets = sets[ei]?.sets || [];
        exSets.forEach(s => {
          const w = parseFloat(s.weight);
          if (!isNaN(w) && w > 0 && (!bestLifts[name] || w > bestLifts[name])) bestLifts[name] = w;
        });
      });
    }
  });
  const topPRs = Object.entries(bestLifts).sort((a,b) => b[1]-a[1]).slice(0, 3);

  // Wochenfortschritt zählt nur noch Einheiten, keine bestimmten Wochentage
  const weeklyTarget = getWeeklyTarget();
  const weekdayShortNames = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const weekDoneDays = weekKeys.map(k => weekdayShortNames[parseLocalDate(k.split(':')[2]).getDay()]);
  const weekPills = Array.from({length: Math.max(weeklyTarget, weekDone)}, (_, i) => {
    const done = i < weekDone;
    return `<div class="home-week-pill ${done ? 'done' : 'pending'}">
      <div style="font-size:15px">${done ? '✓' : '○'}</div>
      <div class="home-week-pill-label" style="margin-top:3px">${done ? (weekDoneDays[i] || '') : '—'}</div>
    </div>`;
  }).join('');

  // Body weight history
  const bwKeys = storageGetAllKeys().filter(k => k.startsWith('gymbook:bodyweight:')).sort().reverse();
  const latestBW = bwKeys.length ? storageGet(bwKeys[0]) : null;
  const bwHistory = bwKeys.slice(0, 12).map(k => ({
    date: k.split(':')[2],
    weight: parseFloat(storageGet(k))
  })).reverse().filter(e => !isNaN(e.weight));

  const storageKB = getCloudSizeKB();
  const storageWarn = storageKB >= CLOUD_LIMIT_KB * 0.75 ? `
    <div class="home-card" style="border-color:color-mix(in srgb, var(--red) 35%, transparent);background:color-mix(in srgb, var(--red) 5%, transparent)">
      <div class="home-card-title" style="color:var(--red)">⚠ Cloud-Speicher fast voll</div>
      <div style="font-size:13px;color:var(--text);line-height:1.5">${storageKB.toFixed(0)} von ${CLOUD_LIMIT_KB} KB belegt. Ist das Limit erreicht, landen neue Einheiten nur noch lokal auf diesem Gerät.</div>
    </div>` : '';

  // Backup-Erinnerung: alle 14 Tage, sobald es Einheiten gibt
  const backupCard = (() => {
    if (!allKeys.length) return '';
    let last = 0;
    try { last = parseInt(localStorage.getItem('gymbook_lastBackup') || '0', 10) || 0; } catch (e) {}
    const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
    if (days !== null && days < 14) return '';
    const txt = days === null ? 'Noch kein Backup erstellt' : `Letztes Backup vor ${days} Tagen`;
    return `<div class="home-card backup-card"><div class="bk-text">${txt}<small>Sichert alle Einheiten als Datei.</small></div><button onclick="exportData();renderHome()">Jetzt sichern</button></div>`;
  })();

  document.getElementById('home-content').innerHTML = `
    ${storageWarn}
    ${backupCard}
    <div class="home-greeting">
      <div class="home-greeting-title">${greeting}, Marco 👋</div>
      <div class="home-greeting-sub">${todayCompleted ? 'Starkes Training heute! 💪' : 'Bereit fürs Training?'}</div>
    </div>

    ${todayCompleted ? `
    <div class="home-card" style="border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.04)">
      <div class="home-card-title">✓ Heute abgeschlossen</div>
      <div class="home-next-type">${todaySession ? esc(todaySession.type) : 'Training'}</div>
      <div class="home-next-day" style="margin-top:4px">${nextDay ? `Als Nächstes: ${esc(nextDay.type)}` : 'Genieß die Erholung!'}</div>
    </div>
    ` : nextDay ? `
    <div class="home-card" style="border-color:color-mix(in srgb, var(--accent) 30%, transparent);background:color-mix(in srgb, var(--accent) 5%, transparent)">
      <div class="home-card-title">Als Nächstes dran</div>
      <div class="home-next-type">${esc(nextDay.type)}</div>
      <div class="home-next-day">${esc(nextDay.duration)}${rotation && rotation.lastDayType ? ` · zuletzt ${esc(rotation.lastDayType)} am ${formatDate(rotation.lastDate)}` : ''}</div>
      <button class="home-start-btn" onclick="startTrainingFromHome(${DAYS.indexOf(nextDay)})">Training starten →</button>
    </div>
    ` : ''}

    <!-- KÖRPERGEWICHT -->
    <div class="home-card">
      <div class="home-card-title">Körpergewicht</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:${bwHistory.length > 1 ? '12px' : '0'}">
        <div style="flex:1">
          <div style="font-family:var(--sans);font-size:28px;font-weight:700;color:var(--accent)">${latestBW ? parseFloat(latestBW).toFixed(1) + ' kg' : '—'}</div>
          ${latestBW ? `<div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px">${formatDate(bwKeys[0].split(':')[2])}</div>` : '<div style="font-family:var(--mono);font-size:12px;color:var(--muted)">Noch kein Eintrag</div>'}
        </div>
        <button onclick="showBWInput()" style="background:var(--bg3);border:0.5px solid var(--border2);color:var(--accent);font-family:var(--mono);font-size:18px;font-weight:600;width:40px;height:40px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button>
      </div>
      ${bwHistory.length > 1 ? (() => {
        const weights = bwHistory.map(e => e.weight);
        const trend = weights[weights.length-1] - weights[0];
        const trendColor = trend < 0 ? 'var(--green)' : trend > 0 ? '#e87f7f' : 'var(--muted)';
        const trendStr = (trend > 0 ? '+' : '') + trend.toFixed(1) + ' kg';
        return `<div style="position:relative">
          ${bwSparkline(bwHistory, 260, 48)}
          <div style="display:flex;justify-content:space-between;margin-top:4px">
            <span style="font-family:var(--mono);font-size:12px;color:var(--muted2)">${formatDate(bwHistory[0].date)}</span>
            <span style="font-family:var(--mono);font-size:12px;color:${trendColor}">${trendStr}</span>
          </div>
        </div>`;
      })() : ''}
    </div>

    <div class="home-card">
      <div class="home-card-title">Diese Woche · ${weekDone} von ${weeklyTarget}</div>
      <div class="home-week-pills">${weekPills}</div>
    </div>

    <div class="home-stats-grid" style="margin-bottom:12px">
      <div class="home-stat">
        <div class="home-stat-val">${allKeys.length}</div>
        <div class="home-stat-label">Einheiten</div>
      </div>
      <div class="home-stat">
        <div class="home-stat-val">${streak}</div>
        <div class="home-stat-label">Wochen-Streak</div>
      </div>
      <div class="home-stat">
        <div class="home-stat-val">${weekDone}</div>
        <div class="home-stat-label">Diese Woche</div>
      </div>
    </div>

    ${lastSessionHtml}

    ${(() => {
      const stuck = stagnatingExercises();
      if (!stuck.length) return '';
      return `<div class="home-card" style="background:color-mix(in srgb, var(--legs) 10%, var(--bg2))">
        <div class="home-card-title" style="color:var(--legs)">⚠ Kein Fortschritt seit 3 Einheiten</div>
        ${stuck.slice(0, 5).map(n => `<div style="font-size:14px;padding:3px 0">${esc(n)}</div>`).join('')}
        <div style="font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5">${stuck.length >= 3
          ? 'Mehrere Übungen stagnieren gleichzeitig – oft ein Zeichen für Ermüdung. Eine leichtere Woche (weniger Sätze, etwas weniger Gewicht) kann helfen.'
          : 'Ideen: Wiederholungsbereich wechseln oder die Übung für ein paar Wochen tauschen.'}</div>
      </div>`;
    })()}

    ${topPRs.length ? `
    <div class="home-card">
      <div class="home-card-title">🏆 Bestleistungen</div>
      ${topPRs.map(([name, w]) => `
        <div class="home-pr-row">
          <span style="font-size:12px;color:var(--text)">${esc(name)}</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500">${w} kg</span>
        </div>
      `).join('')}
    </div>
    ` : ''}
  `;
}
// ─────────────────────────────────────────────────────────────

// ── TRAINING ABSCHLIESSEN ─────────────────────────────────────
let sessionStartTime = null;

function showFinishModal() {
  const day = DAYS[currentDay];
  const date = activeDateStr();

  // Calculate stats
  // Gespeicherten Startzeitpunkt bevorzugen – sessionStartTime lebt nur im
  // Arbeitsspeicher und beginnt nach einem Neustart der App von vorn.
  // Dieselbe Quelle wie completeSession, damit Anzeige und Speicherung passen.
  const startedAt = storageGet(getKey(day.id, date))?.startedAt || sessionStartTime;
  const duration = startedAt ? Math.round((Date.now() - startedAt) / 60000) : null;
  let totalSetsCompleted = 0;

  day.exercises.forEach((ex, ei) => {
    const sd = sessionData[ei] || { sets: [] };
    if (sd.skipped) return;
    const doneSets = (sd.sets || []).filter(s => s.done);
    totalSetsCompleted += doneSets.length;
  });

  const html = `
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:40px;margin-bottom:8px">🏆</div>
      <div style="font-size:20px;font-weight:700;letter-spacing:-0.3px">Training abgeschlossen!</div>
      <div style="font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px">${esc(day.type)} · ${formatDate(date)}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
      ${duration ? `
      <div style="background:var(--bg3);border-radius:8px;padding:12px;text-align:center">
        <div style="font-family:var(--sans);font-size:24px;font-weight:700;color:var(--accent)">${duration}</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.06em">Minuten</div>
      </div>` : ''}
      <div style="background:var(--bg3);border-radius:8px;padding:12px;text-align:center">
        <div style="font-family:var(--sans);font-size:24px;font-weight:700;color:var(--accent)">${totalSetsCompleted}</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.06em">Sätze</div>
      </div>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Notiz zum Training</div>
      <textarea id="finish-note" placeholder="Wie war das Training heute? (optional)"
        style="width:100%;background:var(--field);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:16px;padding:12px;border-radius:8px;outline:none;resize:none;height:80px;box-sizing:border-box;line-height:1.5"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border2)'">${esc(storageGet(`gymbook:note:${day.id}:${date}`) || '')}</textarea>
    </div>
    <button onclick="completeSession()" style="width:100%;background:var(--accent);color:var(--on-accent);border:none;font-family:var(--mono);font-size:13px;font-weight:600;padding:15px;border-radius:10px;cursor:pointer;margin-bottom:8px">✓ Training abschließen</button>
    <button onclick="closeFinishModal()" style="width:100%;background:none;border:0.5px solid var(--border2);color:var(--muted);font-family:var(--mono);font-size:12px;padding:13px;border-radius:10px;cursor:pointer">Weiter trainieren</button>
  `;

  document.getElementById('finish-modal-content').innerHTML = html;
  document.getElementById('finish-modal').style.display = 'flex';
}

function closeFinishModal() {
  document.getElementById('finish-modal').style.display = 'none';
}

function completeSession() {
  const day = DAYS[currentDay];
  const date = activeDateStr();

  // Save note from modal if filled in
  const noteEl = document.getElementById('finish-note');
  if (noteEl && noteEl.value.trim()) {
    const noteKey = `gymbook:note:${day.id}:${date}`;
    storageSet(noteKey, noteEl.value.trim());
  }

  // Abschließen: echte Dauer und Anzahl Sätze festhalten – daraus lernt die
  // Fertig-Zeit-Schätzung für die nächsten Einheiten.
  const key = getKey(day.id, date);
  const existing = storageGet(key) || {};
  existing.completed = true;

  const startedAt = existing.startedAt || sessionStartTime;
  const setsDone = Object.values(sessionData)
    .reduce((sum, s) => sum + ((s.sets || []).filter(x => x.done).length), 0);
  if (startedAt && setsDone > 0) {
    const mins = Math.round((Date.now() - startedAt) / 60000);
    // Unplausible Werte verwerfen (App lief im Hintergrund, Nachtrag o. ä.)
    if (mins >= 5 && mins <= 240) { existing.durationMin = mins; existing.setsDone = setsDone; }
  }
  storageSet(key, existing);
  syncNow();   // jetzt in die Cloud – das ist der eine gewollte Sync pro Training
  closeFinishModal();
  setStatus('✓ Training abgeschlossen!', true);
  setTimeout(() => switchTab('home'), 800);
}

// ─────────────────────────────────────────────────────────────

// ── KÖRPERGEWICHT ─────────────────────────────────────────────
function showBWInput() {
  const today = todayStr();
  const existing = storageGet(`gymbook:bodyweight:${today}`) || '';
  const html = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Körpergewicht</h2>
    <div style="margin:16px 0">
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Heutiges Gewicht (kg)</div>
      <input type="number" id="bw-input" step="0.1" min="30" max="300" value="${existing}" placeholder="z.B. 79.5"
        style="width:100%;background:var(--field);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:24px;padding:14px;border-radius:8px;outline:none;text-align:center;box-sizing:border-box"
        onfocus="this.select()">
    </div>
    <button onclick="saveBW()" style="width:100%;background:var(--accent);color:var(--on-accent);border:none;font-family:var(--mono);font-size:13px;font-weight:600;padding:14px;border-radius:10px;cursor:pointer">Speichern</button>
  `;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('bw-input')?.focus(), 100);
}

function saveBW() {
  const val = parseFloat(document.getElementById('bw-input')?.value);
  if (isNaN(val) || val <= 0) return;
  const today = todayStr();
  storageSet(`gymbook:bodyweight:${today}`, String(val));
  closeModal();
  renderHome();
}
// ─────────────────────────────────────────────────────────────

// ── PAUSENTIMER-EINSTELLUNGEN ─────────────────────────────────
// Eine Web-App kann am iPhone weder im Hintergrund klingeln noch in der
// Dynamic Island erscheinen. Der Umweg: Nach dem Abhaken startet die App
// einen Kurzbefehl, der einen echten iPhone-Timer (Uhr-App) stellt – der
// läuft sichtbar oben weiter, auch in TikTok oder Musik, und klingelt.
// Einstellungen nur lokal ("gymbook_" → kein Export, kein Upload).
const TIMER_SHORTCUT_STORE = 'gymbook_timerShortcut';   // Name des Kurzbefehls, '' = aus
const TIMER_SOUND_STORE = 'gymbook_timerSound';         // 'off' = kein Ton
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

function getTimerShortcut() { return lsGet(TIMER_SHORTCUT_STORE, ''); }
function timerSoundOn() { return lsGet(TIMER_SOUND_STORE, 'on') !== 'off'; }

function updateTimerLabel() {
  const el = document.getElementById('timer-toggle-label');
  if (!el) return;
  el.textContent = !timerEnabled ? 'Pausentimer: Aus'
    : getTimerShortcut() ? 'Pausentimer: App + iPhone-Timer' : 'Pausentimer: In der App';
}

function openTimerSettings() {
  const mode = !timerEnabled ? 'off' : getTimerShortcut() ? 'shortcut' : 'app';
  const opt = (val, title, sub) => `
    <label style="display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--bg3);border-radius:10px;margin-bottom:8px;cursor:pointer">
      <input type="radio" name="timer-mode" value="${val}" ${mode === val ? 'checked' : ''} style="margin-top:3px">
      <span><span style="font-weight:600">${title}</span><br><span style="font-size:13px;color:var(--muted)">${sub}</span></span>
    </label>`;
  document.getElementById('modal-content').innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Pausentimer</h2>
    ${opt('off', 'Aus', 'Kein Timer nach dem Abhaken.')}
    ${opt('app', 'In der App', 'Timer läuft in GymBook. Nur sichtbar, solange die App offen ist.')}
    ${opt('shortcut', 'App + iPhone-Timer', 'Startet zusätzlich über einen Kurzbefehl einen Timer der Uhr-App – sichtbar oben in der Dynamic Island, auch in anderen Apps, und er klingelt.')}
    <div style="font-size:13px;color:var(--muted);margin:12px 0 6px">Name des Kurzbefehls</div>
    <input type="text" id="timer-shortcut-name" value="${esc(getTimerShortcut() || 'GymBook Pause')}"
      style="width:100%;background:var(--field);border:none;color:var(--text);font-size:16px;padding:11px 12px;border-radius:10px;box-sizing:border-box">
    <label style="display:flex;gap:10px;align-items:center;margin:14px 0 18px;cursor:pointer">
      <input type="checkbox" id="timer-sound" ${timerSoundOn() ? 'checked' : ''}>
      <span>Ton am Pausenende <span style="font-size:13px;color:var(--muted)">(nur bei offener App, nicht im Lautlos-Modus)</span></span>
    </label>
    <button onclick="saveTimerSettings()" style="width:100%;background:var(--accent);color:var(--on-accent);border:none;font-size:15px;font-weight:600;padding:14px;border-radius:12px;cursor:pointer">Speichern</button>
    <button onclick="testTimerShortcut()" style="width:100%;background:var(--bg3);color:var(--text);border:none;font-size:14px;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;margin-top:8px">Kurzbefehl testen (60 s)</button>
    <div style="font-size:12px;color:var(--muted2);margin-top:6px;line-height:1.5">Startet den Kurzbefehl mit dem eingetragenen Namen und 60 Sekunden – der iPhone-Timer sollte sofort mit 1:00 loslaufen.</div>
  `;
  document.getElementById('modal').style.display = 'flex';
}

function saveTimerSettings() {
  const mode = document.querySelector('input[name="timer-mode"]:checked')?.value || 'app';
  const name = (document.getElementById('timer-shortcut-name')?.value || '').trim() || 'GymBook Pause';
  timerEnabled = mode !== 'off';
  lsSet('gymbook:timerEnabled', String(timerEnabled));
  lsSet(TIMER_SHORTCUT_STORE, mode === 'shortcut' ? name : '');
  lsSet(TIMER_SOUND_STORE, document.getElementById('timer-sound')?.checked ? 'on' : 'off');
  updateTimerLabel();
  closeModal();
}

// Testknopf in den Einstellungen: nutzt den gerade eingetragenen Namen,
// auch wenn noch nicht gespeichert wurde
function testTimerShortcut() {
  const name = (document.getElementById('timer-shortcut-name')?.value || '').trim() || 'GymBook Pause';
  location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=text&text=60`;
}

// Startet den Kurzbefehl mit der Pausenlänge in Sekunden als Eingabe.
// Muss direkt im Tipp-Ereignis passieren, sonst blockiert iOS den Wechsel.
function runTimerShortcut(seconds) {
  const name = getTimerShortcut();
  if (!name) return;
  location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=text&text=${Math.round(seconds)}`;
}

// Kurzer Signalton über Web Audio – navigator.vibrate gibt es am iPhone nicht.
// Der AudioContext muss einmal durch eine Berührung freigeschaltet werden.
let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e) {}
}
function playTimerBeep() {
  if (!audioCtx || !timerSoundOn()) return;
  const t = audioCtx.currentTime;
  [0, 0.25, 0.5].forEach(d => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(0.4, t + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.18);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + d); o.stop(t + d + 0.2);
  });
}

function toggleMenu() {
  const menu = document.getElementById('menu-dropdown');
  const opening = menu.style.display === 'none';
  if (opening) { updateMenuDeleteEntry(); updateMenuSyncInfo(); }
  menu.style.display = opening ? 'block' : 'none';
}

// Größe, die beim Hochladen tatsächlich übertragen würde (kompaktiert)
const CLOUD_LIMIT_KB = 100;
function getCloudSizeKB() {
  return JSON.stringify({ gymbook: compactForCloud(cloudData) }).length / 1024;
}

function updateMenuSyncInfo() {
  const label = document.getElementById('menu-sync-label');
  const box = document.getElementById('menu-storage');
  const pending = getPendingCount();
  if (label) label.textContent = pending ? `Jetzt synchronisieren (${pending} ausstehend)` : 'Jetzt synchronisieren';
  if (!box) return;
  const kb = getCloudSizeKB();
  const pct = Math.min(100, Math.round(kb / CLOUD_LIMIT_KB * 100));
  const col = pct >= 90 ? 'var(--red)' : pct >= 75 ? 'var(--legs)' : 'var(--accent)';
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted2);margin-bottom:5px">
      <span>Cloud-Speicher</span><span style="color:${col}">${kb.toFixed(1)} / ${CLOUD_LIMIT_KB} KB</span>
    </div>
    <div style="height:4px;background:var(--bg4);border-radius:2px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${col}"></div>
    </div>`;
}

// "Einheit löschen" nur anbieten, wenn im Training gerade eine Einheit mit
// Daten offen ist – und dann mit Tag und Datum im Text, damit im Menü klar
// ist, was genau gelöscht würde.
function updateMenuDeleteEntry() {
  const entry = document.getElementById('menu-delete-session');
  const divider = document.getElementById('menu-delete-divider');
  const label = document.getElementById('menu-delete-label');
  if (!entry) return;
  const hasData = currentTab === 'training' && !editMode &&
    Object.values(sessionData).some(s => s.sets?.some(x => x.weight || x.reps || x.done));
  entry.style.display = hasData ? 'flex' : 'none';
  if (divider) divider.style.display = hasData ? 'block' : 'none';
  if (hasData && label) {
    const day = DAYS[currentDay];
    label.textContent = `Einheit löschen (${day.type}, ${formatDate(activeDateStr())})`;
  }
}
document.addEventListener('click', e => {
  const menu = document.getElementById('menu-dropdown');
  if (menu && !menu.contains(e.target) && !e.target.closest('.menu-btn')) {
    menu.style.display = 'none';
  }
});

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

// ── 2. AUTO-SELECT INPUT FIELDS ──────────────────────────────
document.addEventListener('focusin', e => {
  if (e.target.classList.contains('set-input') || e.target.tagName === 'INPUT') {
    setTimeout(() => e.target.select(), 0);
  }
});

// ── 3. UNSAVED WARNING ────────────────────────────────────────
window.addEventListener('beforeunload', e => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// Save custom pause when user adjusts timer
function adjustTimer(delta) {
  if (timerPaused) {
    timerPausedAt = Math.max(0, timerPausedAt + delta);
    timerTotal = Math.max(timerTotal, timerPausedAt);
  } else {
    // +delta means more time: move startTime earlier so elapsed is less
    timerStartTime += delta * 1000;
    // Don't let startTime be in the future
    if (timerStartTime > Date.now()) timerStartTime = Date.now();
    const remaining = getRemainingSeconds();
    if (remaining > timerTotal) timerTotal = remaining;
  }
  updateTimerDisplay();
}

// ── OFFLINE-START ──────────────────────────────────────────────
// sw.js (eigene Datei neben dieser Seite) hält eine Kopie der App vor, damit
// sie auch ohne Netz startet. "Netz zuerst" – Updates sind sofort aktiv.
// Der frühere Service Worker lief über eine Blob-URL und konnte die App nach
// Updates blockieren; die neue Registrierung ersetzt ihn automatisch, und
// sw.js räumt dessen alte Caches beim Aktivieren weg.
// Fehlt sw.js auf dem Server, passiert einfach nichts.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service Worker nicht registriert:', e));
}
// ─────────────────────────────────────────────────────────────

// Init
updateTimerLabel();
renderNav();
switchTab('home');
cloudInit();
</script>
