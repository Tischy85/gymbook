<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymBook">
<title>GymBook</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:    #1a1a1c;
    --bg2:   #222226;
    --bg3:   #2a2a2f;
    --bg4:   #323238;
    --border:  rgba(255,255,255,0.15);
    --border2: rgba(255,255,255,0.28);
    --text:  #f5f2eb;
    --muted: #a09b94;
    --muted2:#6b6560;
    --accent:  #c9a84c;
    --accent2: #a8863a;
    --accent3: #e8c97a;
    --accent-dim:  rgba(201,168,76,0.09);
    --accent-dim2: rgba(201,168,76,0.16);
    --upper: #9b7fe8;
    --push:  #e87f7f;
    --pull:  #7fb8e8;
    --legs:  #e8a87f;
    --red:   #e86060;
    --mono:  'JetBrains Mono', monospace;
    --sans:  'Inter', sans-serif;
    --display: 'Playfair Display', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
  .btn { background: none; border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 7px 13px; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot-upper { background: var(--upper); }
  .dot-legs  { background: var(--legs); }
  .dot-push  { background: var(--push); }
  .dot-pull  { background: var(--pull); }

  /* SESSION META – label only */
  .label-upper { color: var(--upper); }
  .label-legs  { color: var(--legs); }
  .label-push  { color: var(--push); }
  .label-pull  { color: var(--pull); }

  /* DATE PICKER */
  .date-picker-wrap { display: flex; align-items: center; gap: 8px; }
  .date-picker { background: transparent; border: none; border-bottom: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 11px; padding: 4px 2px; outline: none; cursor: pointer; transition: border-color 0.15s; color-scheme: dark; }
  .date-picker:hover, .date-picker:focus { border-bottom-color: var(--accent); color: var(--text); }
  .back-entry-badge { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 3px; background: rgba(201,168,76,0.1); color: var(--accent); border: 0.5px solid rgba(201,168,76,0.25); }

  /* EXERCISE CARDS */
  .exercise-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s; }
  .exercise-card:hover { border-color: var(--border2); }
  .exercise-header { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; }
  .ex-num { font-family: var(--mono); font-size: 10px; color: var(--muted2); width: 18px; flex-shrink: 0; }
  .ex-name { font-size: 13px; font-weight: 600; flex: 1; letter-spacing: -0.2px; }
  .ex-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }
  .ex-chevron { font-size: 9px; color: var(--muted2); transition: transform 0.2s; }
  .ex-chevron.open { transform: rotate(90deg); }
  .exercise-body { display: none; padding: 0 18px 16px; border-top: 0.5px solid var(--border); }
  .exercise-body.open { display: block; }

  /* SET ROWS */
  .sets-header { display: grid; grid-template-columns: 24px 1fr 1fr 1fr 28px; gap: 8px; padding: 12px 0 6px; }
  .sets-header span { font-family: var(--mono); font-size: 9px; color: var(--muted2); text-align: center; letter-spacing: 0.06em; text-transform: uppercase; }
  .sets-header span:nth-child(2) { text-align: left; }
  .set-row { display: grid; grid-template-columns: 24px 1fr 1fr 1fr 28px; gap: 8px; align-items: center; margin-bottom: 6px; }
  .set-num { font-family: var(--mono); font-size: 10px; color: var(--muted2); text-align: center; }
  .set-input { background: #111114; border: 1px solid rgba(255,255,255,0.22); color: #f5f2eb; font-family: var(--mono); font-size: 14px; font-weight: 500; padding: 10px 8px; border-radius: 6px; width: 100%; outline: none; transition: border-color 0.15s, box-shadow 0.15s; text-align: center; }
  .set-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(201,168,76,0.2); }
  .set-input::placeholder { color: #6b6560; font-weight: 400; }
  .set-input.done { border-color: var(--accent); color: var(--accent); background: var(--accent-dim2); font-weight: 600; }
  .check-btn { width: 28px; height: 36px; background: none; border: 0.5px solid var(--border); border-radius: 4px; cursor: pointer; color: var(--muted2); font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .check-btn:hover { border-color: var(--accent); color: var(--accent); }
  .check-btn.checked { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .ex-note { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 10px; padding: 8px 10px; background: var(--bg3); border-radius: 4px; border-left: 2px solid var(--border2); line-height: 1.6; }
  .ex-note.warning { border-left-color: var(--legs); color: #b8845a; }

  /* HISTORY */
  .history-section { margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border); }
  .history-title { font-family: var(--mono); font-size: 9px; color: var(--muted2); margin-bottom: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
  .history-entry { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .history-date { font-family: var(--mono); font-size: 10px; color: var(--muted2); width: 60px; flex-shrink: 0; }
  .history-sets { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: 1; }
  .no-history { font-family: var(--mono); font-size: 10px; color: var(--muted2); }

  /* SUGGESTION BADGES */
  .sugg-badge { font-family: var(--mono); font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
  .sugg-up   { background: var(--accent-dim2); color: var(--accent3); border: 0.5px solid rgba(201,168,76,0.3); }
  .sugg-half { background: rgba(201,168,76,0.07); color: var(--accent); border: 0.5px solid rgba(201,168,76,0.2); }
  .sugg-same { background: rgba(255,255,255,0.03); color: var(--muted); border: 0.5px solid var(--border); }
  .history-exceeded { color: var(--accent) !important; }
  .sugg-detail { font-family: var(--mono); font-size: 10px; color: var(--muted2); margin-top: 6px; font-style: italic; }

  /* SWAP */
  .swap-btn { background: var(--bg4); border: 0.5px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 10px; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .swap-btn:hover { border-color: var(--accent); color: var(--accent); }
  .swap-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .swap-panel { display: none; margin-top: 10px; background: var(--bg3); border-radius: 6px; padding: 10px 12px; border: 0.5px solid var(--border2); }
  .swap-panel.open { display: block; }
  .swap-panel-title { font-family: var(--mono); font-size: 9px; color: var(--muted2); margin-bottom: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
  .swap-option { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 0.5px solid var(--border); }
  .swap-option:last-child { border-bottom: none; }
  .swap-option-name { font-size: 12px; color: var(--text); }
  .swap-option-btn { background: none; border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 3px 10px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .swap-option-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .swap-active-badge { font-family: var(--mono); font-size: 10px; color: var(--accent); background: var(--accent-dim); border: 0.5px solid rgba(201,168,76,0.25); padding: 2px 8px; border-radius: 3px; margin-left: 6px; }
  .swap-reset-btn { margin-top: 8px; width: 100%; background: none; border: 0.5px solid var(--border); color: var(--muted2); font-family: var(--mono); font-size: 10px; padding: 5px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .swap-reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* SET ADJUST */
  .set-adjust-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .set-adj-btn { background: var(--bg4); border: 0.5px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 10px; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .set-adj-plus  { border-color: rgba(201,168,76,0.3); color: var(--accent); background: var(--accent-dim); }
  .set-adj-plus:hover  { border-color: var(--accent); background: var(--accent-dim2); }
  .set-adj-minus { border-color: rgba(232,96,96,0.3); color: var(--red); background: rgba(232,96,96,0.06); }
  .set-adj-minus:hover { border-color: var(--red); background: rgba(232,96,96,0.12); }
  .set-adj-reset { border-color: var(--border2); color: var(--muted); }
  .set-adj-reset:hover { border-color: var(--muted); color: var(--text); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  .modal { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 10px; padding: 24px; width: 100%; max-width: 460px; max-height: 80vh; overflow-y: auto; }
  .modal h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; letter-spacing: -0.2px; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .history-full-entry { padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .history-full-entry:last-child { border-bottom: none; }
  .history-full-date { font-family: var(--mono); font-size: 10px; color: var(--accent); margin-bottom: 6px; letter-spacing: 0.04em; }
  .history-full-sets { font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.8; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-family: var(--mono); font-size: 11px; }

  /* MOBILE */
  @media (max-width: 480px) {
    body { -webkit-tap-highlight-color: transparent; }
    .sets-header { grid-template-columns: 22px 1fr 1fr 1fr 38px; gap: 6px; }
    .set-row     { grid-template-columns: 22px 1fr 1fr 1fr 38px; gap: 6px; margin-bottom: 8px; }
    .set-input { font-size: 15px; padding: 11px 8px; border-radius: 6px; }
    .check-btn { width: 38px; height: 44px; border-radius: 6px; font-size: 15px; }
    .sugg-badge { font-size: 9px; padding: 2px 7px; }
    .swap-btn { padding: 5px 10px; font-size: 10px; min-height: 32px; }
    .set-adj-btn { padding: 8px 14px; min-height: 36px; font-size: 10px; }
    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal { border-bottom-left-radius: 0; border-bottom-right-radius: 0; max-height: 88vh; }
    .date-picker { font-size: 12px; padding: 6px 4px; }
  }

  /* TIMER */
  #timer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300; display: flex; align-items: flex-end; justify-content: center; padding: 0; backdrop-filter: blur(6px); }
  #timer-box { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 20px 20px 0 0; padding: 24px 24px calc(24px + env(safe-area-inset-bottom)); width: 100%; max-width: 420px; }
  #timer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  #timer-label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  #timer-header button { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 0; }
  #timer-ring-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 20px; }
  #timer-svg { width: 140px; height: 140px; transform: rotate(-90deg); }
  #timer-track { fill: none; stroke: var(--bg4); stroke-width: 6; }
  #timer-progress { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
  #timer-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 42px; font-weight: 700; color: var(--text); letter-spacing: -2px; }
  #timer-adjust { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  #timer-adjust button { background: var(--bg3); border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 11px; padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
  #timer-adjust button:hover { border-color: var(--accent); color: var(--accent); }
  #timer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #timer-pause-btn { background: var(--accent); color: #090909; border: none; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 13px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
  #timer-pause-btn:hover { background: var(--accent3); }
  #timer-skip-btn { background: var(--bg3); border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 12px; padding: 13px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
  #timer-skip-btn:hover { border-color: var(--muted); color: var(--text); }

  .training-end { font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: 0.03em; margin-left: auto; white-space: nowrap; }
  @keyframes prPop { 0%{opacity:0;transform:translateX(-50%) scale(0.8)} 100%{opacity:1;transform:translateX(-50%) scale(1)} }
  .delete-session-btn { background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px; opacity: 0.4; transition: opacity 0.15s; }
  .delete-session-btn:hover { opacity: 1; }
  .progress-dots { display: flex; gap: 3px; margin-top: 4px; }
  .progress-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bg4); transition: background 0.2s; }
  .progress-dot.done { background: var(--accent); }
  .progress-bar-wrap { height: 2px; background: var(--bg4); border-radius: 1px; margin-top: 5px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 1px; transition: width 0.3s; }
  .quick-btns { display: flex; flex-direction: column; gap: 2px; }
  .quick-btns button { background: var(--bg4); border: 0.5px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 13px; font-weight: 500; width: 28px; height: 21px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; line-height: 1; padding: 0; }
  .quick-btns button:hover { background: var(--accent); color: #090909; border-color: var(--accent); }
  .quick-btns button:active { transform: scale(0.92); }
  .edit-mode-bar { background: rgba(201,168,76,0.08); border: 0.5px solid rgba(201,168,76,0.25); border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .edit-mode-label { font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: 0.06em; }
  .edit-card { background: var(--bg2); border: 1px solid rgba(201,168,76,0.2); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .edit-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 0.5px solid var(--border); }
  .edit-ex-num { font-family: var(--mono); font-size: 10px; color: var(--muted2); width: 18px; flex-shrink: 0; }
  .edit-ex-name { font-size: 13px; font-weight: 600; color: var(--accent); flex: 1; }
  .edit-swap-btn { background: var(--bg4); border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 5px 10px; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .edit-swap-btn:hover { border-color: var(--accent); color: var(--accent); }
  .edit-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 16px; }
  .edit-field { display: flex; flex-direction: column; gap: 4px; }
  .edit-field label { font-family: var(--mono); font-size: 9px; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.06em; }
  .edit-field input { background: #111114; border: 1px solid rgba(255,255,255,0.22); color: #f5f2eb; font-family: var(--mono); font-size: 13px; padding: 8px; border-radius: 4px; outline: none; text-align: center; width: 100%; transition: border-color 0.15s; }
  .edit-field input:focus { border-color: var(--accent); }
  .edit-save-btn { background: var(--accent); color: #090909; border: none; font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 8px 16px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .edit-save-btn:hover { background: var(--accent3); }
  .edit-discard-btn { background: none; border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 11px; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  .edit-discard-btn:hover { border-color: var(--red); color: var(--red); }
  #edit-plan-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .edit-new-ex { background: var(--bg2); border: 1px dashed rgba(201,168,76,0.25); border-radius: 8px; padding: 16px; margin-top: 8px; }
  .edit-new-ex-title { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 12px; }
  .edit-new-ex-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 4px; }

  /* DAY PICKER PANEL */
  .day-picker-panel { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 8px; }
  .day-pick-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; border: none; background: none; cursor: pointer; transition: background 0.15s; width: 100%; text-align: left; }
  .day-pick-btn:hover { background: var(--bg3); }
  .day-pick-btn.active { background: var(--bg3); }
  .day-pick-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .day-pick-label { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--text); flex: 1; }
  .day-pick-type { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .day-pick-upper.active .day-pick-label { color: var(--upper); }
  .day-pick-push.active   .day-pick-label { color: var(--push); }
  .day-pick-pull.active   .day-pick-label { color: var(--pull); }
  .day-pick-legs.active   .day-pick-label { color: var(--legs); }
  .session-label { transition: opacity 0.15s; }
  .session-label:hover { opacity: 0.75; }

  /* CATALOG MODAL */
  .catalog-modal-inner { padding: 0; overflow: hidden; display: flex; flex-direction: column; max-height: 88vh; }
  .cat-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 20px 12px; border-bottom: 0.5px solid var(--border); }
  .cat-title { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; }
  .cat-subtitle { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 3px; }
  .cat-reset-btn { margin: 10px 20px 0; background: none; border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 8px 14px; border-radius: 4px; cursor: pointer; transition: all 0.15s; width: calc(100% - 40px); text-align: left; }
  .cat-reset-btn:hover { border-color: var(--red); color: var(--red); }
  .cat-tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 12px 16px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 8px; transition: background 0.15s; min-width: 56px; }
  .cat-tab.active { background: var(--accent-dim); }
  .cat-tab:hover { background: var(--bg4); }
  .cat-svg { width: 36px; height: 36px; display: block; }
  .cat-svg svg { width: 100%; height: 100%; }
  .cat-label { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .cat-tab.active .cat-label { color: var(--accent); }
  .cat-ex-list { overflow-y: auto; flex: 1; padding: 8px 0; }
  .cat-ex-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.1s; }

  /* Dropdown menu */
  .menu-dropdown { position: absolute; top: 60px; right: 20px; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 12px; padding: 6px; z-index: 150; min-width: 180px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }

<script>
const DAYS = [
  {

      { name: 'Überkopf-Trizeps am Kabel', muscle: 'Trizeps (langer Kopf)', sets: 2, reps: '8–12', pause: '75–90 Sek', alternatives: ['Trizepsdrücken Kabel (Seil)', 'Trizeps Dips Maschine'] },
    ]
  },

    exercises: [
      { name: 'Brustpresse Maschine (anderer Winkel als Mo)', muscle: 'Brust', sets: 3, reps: '6–8', pause: '2:30', alternatives: ['Chest Fly Maschine', 'Kabel-Flyes mittig'] },
      { name: 'Chest Fly Maschine / Kabel', muscle: 'Brust (Isolation)', sets: 2, reps: '8–12', pause: '75–90 Sek', alternatives: ['Kabel-Flyes hoch nach unten', 'Kabel-Flyes mittig'] },
      { name: 'Kabel-Flyes tief nach oben', muscle: 'Brust (unten)', sets: 2, reps: '10–12', pause: '75 Sek', alternatives: ['Kabel-Flyes mittig', 'Chest Fly Maschine'] },
      { name: 'Kabel-Seitheben einarmig', muscle: 'Schulter seitlich', sets: 3, reps: '12–15', pause: '60–75 Sek', alternatives: ['Seitheben Maschine', 'Kabel-Seitheben beidarmig'] },
      { name: 'Trizepsdrücken am Kabel schwer', muscle: 'Trizeps', sets: 3, reps: '6–10', pause: '75–90 Sek', alternatives: ['Trizeps Maschine', 'Trizeps Dips Maschine'] },
      { name: 'Überkopf-Trizeps am Kabel', muscle: 'Trizeps langer Kopf', sets: 2, reps: '8–12', pause: '75–90 Sek', alternatives: ['Trizepsdrücken Kabel (Seil)', 'Trizeps Maschine'] },
    ]
  },
  {
    id: 'pull', label: 'Freitag', type: 'PULL',
    color: 'pull', duration: '65–75 Min',
    exercises: [
      { name: 'Kabelrudern eng / mittig', muscle: 'Mittelrücken', sets: 3, reps: '6–8', pause: '2:30', alternatives: ['Kabelrudern weit', 'Rudermaschine brustgestützt'] },
      { name: 'Latzug (anderer Griff als Mo)', muscle: 'Latissimus', sets: 3, reps: '6–8', pause: '2:00', alternatives: ['Latzug neutral', 'Kabelrudern eng überkopf'] },
      { name: 'Rückenstrecker Maschine', muscle: 'Unterer Rücken', sets: 2, reps: '8–12', pause: '90 Sek', alternatives: ['Hyperextension Maschine', 'Kabel-Pull-Through'] },
      { name: 'Reverse Fly Maschine / Kabel', muscle: 'Schulter hinten', sets: 3, reps: '12–15', pause: '60–75 Sek', alternatives: ['Reverse Fly Kabel', 'Facepull Kabel'] },
      { name: 'Bizepscurl Maschine / Kabel', muscle: 'Bizeps', sets: 3, reps: '6–10', pause: '75–90 Sek', alternatives: ['Kabelcurl', 'Hammer Curl Kabel'] },
      { name: 'Hammer Curl / Reverse Curl Kabel', muscle: 'Brachialis · Unterarm', sets: 2, reps: '8–12', pause: '75–90 Sek', alternatives: ['Reverse Curl Kabel', 'Bizepscurl Maschine'] },
    ]
  },
  {
    id: 'legs', label: 'Samstag', type: 'BEINE + CORE',
    color: 'legs', duration: '65–70 Min · optional',
    exercises: [
      { name: 'Beinbeuger liegend', muscle: 'Hamstrings', sets: 3, reps: '6–8', pause: '3:00', alternatives: ['Beinbeuger sitzend', 'Kabel-Kickback'] },
      { name: 'Beinpresse', muscle: 'Quadrizeps / Gluteus', sets: 3, reps: '5–7', pause: '3:00', alternatives: ['Hackenschmidt Maschine', 'Beinstrecker + Beinbeuger Supersatz'] },
      { name: 'Beinstrecker', muscle: 'Quadrizeps (Isolation)', sets: 2, reps: '8–10', pause: '90 Sek', alternatives: ['Beinpresse einbeinig', 'Ausfallschritte Maschine'] },
      { name: 'Abduktoren-Maschine', muscle: 'Gluteus medius · Hüfte', sets: 2, reps: '12–15', pause: '90 Sek', alternatives: ['Kabel Hip Abduction', 'Adduktoren-Maschine als Gegenpol'] },
      { name: 'Wadenheben Maschine', muscle: 'Waden', sets: 2, reps: '8–12', pause: '90 Sek', alternatives: ['Wadenheben Beinpresse', 'Stehend Wadenheben Maschine'] },
      { name: 'Cable Crunches', muscle: 'Bauch', sets: 3, reps: '10–15', pause: '60 Sek', alternatives: ['Crunch Maschine', 'Bauchpresse Maschine'] },
    ]
  }
];

let currentDay = 0;
let sessionData = {};
let swappedExercises = {};
let activeDate = null; // null = heute
let dirty = false;

function getKey(dayId, date) { return `gymbook:${dayId}:${date}`; }
function todayStr() { return new Date().toISOString().slice(0,10); }
function activeDateStr() { return activeDate || todayStr(); }

function formatDate(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function setActiveDate(val) {
  activeDate = val || null;
  loadSessionData();
  renderDay();
}

function weekdayFromDate(iso) {
  const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const [y,m,d] = iso.split('-').map(Number);
  return days[new Date(y, m-1, d).getDay()];
}

// ── JSONBin Storage ──────────────────────────────────────────
const JSONBIN_KEY = '$2a$10$VCqYDBoWnSoJIPwURownZ.CIQBrg2EjsTlU0D9HCpRcV1ww22TT/a';
const JSONBIN_API = 'https://api.jsonbin.io/v3/b';
const FIXED_BIN_ID = '6a1d9bd121f9ee59d2a5bc77';
let binId = FIXED_BIN_ID;
let cloudData = {};
let cloudLoaded = false;

async function cloudInit() {
  setStatus('☁ Verbinde…', false);
  await cloudPull();
}

async function cloudCreate() {
  try {
    const res = await fetch(JSONBIN_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY, 'X-Bin-Name': 'gymbook', 'X-Bin-Private': 'true' },
      body: JSON.stringify({ gymbook: {} })
    });
    if (!res.ok) { setStatus(`⚠ Cloud-Fehler (${res.status})`, false); return; }
    const data = await res.json();
    binId = data.metadata?.id;
    if (binId) {
      localStorage.setItem('gymbook:binId', binId);
      cloudData = {};
      cloudLoaded = true;
      setStatus('☁ Bereit', true);
    } else {
      setStatus('⚠ Cloud-Fehler (kein Bin)', false);
    }
  } catch(e) {
    setStatus(`⚠ Offline (${e.message})`, false);
  }
}

async function cloudPull() {
  try {
    const res = await fetch(`${JSONBIN_API}/${binId}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (!res.ok) { setStatus(`⚠ Cloud-Fehler (${res.status})`, false); return; }
    const data = await res.json();
    cloudData = data.record?.gymbook || {};
    cloudLoaded = true;
    loadCustomPlan();
    loadCustomCatalog();
    loadPauseSettings();
    setStatus('☁ Synchronisiert', true);
    renderNav();
    renderDay();  } catch(e) {
    cloudLoaded = false;
    setStatus(`⚠ Offline (${e.message})`, false);
  }
}

let offlineQueue = [];

async function cloudPush() {
  if (!binId) return;
  try {
    await fetch(`${JSONBIN_API}/${binId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify({ gymbook: cloudData })
    });
    // Flush offline queue if any
    if (offlineQueue.length > 0) {
      offlineQueue = [];
      localStorage.removeItem('gymbook:offlinequeue');
    }
  } catch(e) {
    // Save to offline queue
    offlineQueue.push(Date.now());
    localStorage.setItem('gymbook:offlinequeue', JSON.stringify(offlineQueue));
    setStatus('⚠ Offline – wird später synchronisiert', false);
    console.warn('Cloud push failed, queued for retry');
  }
}

// Retry queue when connection returns
window.addEventListener('online', async () => {
  const saved = localStorage.getItem('gymbook:offlinequeue');
  if (saved) {
    setStatus('☁ Synchronisiere…', false);
    await cloudPush();
    setStatus('☁ Synchronisiert', true);
  }
});

function storageSet(key, val) {
  cloudData[key] = val;
  localStorage.setItem(key, JSON.stringify(val)); // local mirror
  cloudPush();
}

function storageGet(key) {
  if (cloudLoaded && cloudData[key] !== undefined) return cloudData[key];
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}

function storageGetAllKeys() {
  if (cloudLoaded) return Object.keys(cloudData).filter(k => k.startsWith('gymbook:') && k !== 'gymbook:binId');
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('gymbook:') && k !== 'gymbook:binId') keys.push(k);
  }
  return keys;
}

function setStatus(msg, ok) {
  const trySet = () => {
    const el = document.getElementById('save-status');
    if (el) {
      el.textContent = msg;
      el.className = ok ? 'save-status saved' : 'save-status';
    } else {
      setTimeout(trySet, 100);
    }
  };
  trySet();
}
// ─────────────────────────────────────────────────────────────

function loadSessionData() {
  const day = DAYS[currentDay];
  const date = activeDateStr();
  const existing = storageGet(getKey(day.id, date));
  sessionData = {};
  swappedExercises = {};
  if (existing) {
    if (existing.sets) {
      sessionData = existing.sets;
      swappedExercises = existing.swapped || {};
    } else {
      sessionData = existing;
    }
  } else {
    day.exercises.forEach((ex, ei) => {
      sessionData[ei] = { sets: [] };
      for (let s = 0; s < ex.sets; s++) {
        sessionData[ei].sets.push({ weight: '', reps: '', done: false });
      }
    });
  }
}

function saveSession() {
  const day = DAYS[currentDay];
  const date = activeDateStr();
  collectInputValues();
  storageSet(getKey(day.id, date), { sets: sessionData, swapped: swappedExercises });
  dirty = false;
  const el = document.getElementById('save-status');
  const isBack = date !== todayStr();
  el.textContent = `Gespeichert — ${formatDate(date)}${isBack ? ' (nachgetragen)' : ''}`;
  el.className = 'save-status saved';
  setTimeout(() => { el.textContent = 'Alle Änderungen gespeichert'; }, 2500);
}

function collectInputValues() {
  const day = DAYS[currentDay];
  day.exercises.forEach((ex, ei) => {
    const activeSets = (sessionData[ei] && sessionData[ei].activeSets != null)
      ? sessionData[ei].activeSets : ex.sets;
    for (let s = 0; s < activeSets; s++) {
      const wEl = document.getElementById(`w-${ei}-${s}`);
      const rEl = document.getElementById(`r-${ei}-${s}`);
      if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
      if (wEl) sessionData[ei].sets[s].weight = wEl.value;
      if (rEl) sessionData[ei].sets[s].reps = rEl.value;
    }
  });
}

function getHistory(dayId) {
  const keys = storageGetAllKeys().filter(k => k.startsWith(`gymbook:${dayId}:`));
  return keys.map(k => {
    const date = k.split(':')[2];
    const raw = storageGet(k);
    const data = raw?.sets || raw;
    return { date, data };
  }).sort((a,b) => b.date.localeCompare(a.date));
}

function getLastEntryByName(dayId, exerciseName) {
  const date = activeDateStr();
  const keys = storageGetAllKeys()
    .filter(k => k.startsWith(`gymbook:${dayId}:`) && !k.endsWith(date))
    .sort().reverse();

  for (const k of keys) {
    const raw = storageGet(k);
    if (!raw) continue;
    const sets = raw.sets || raw;
    const swapped = raw.swapped || {};
    const day = DAYS.find(d => d.id === dayId);
    if (!day) continue;

    // Find which slot had this exercise name (original or swapped)
    for (let ei = 0; ei < day.exercises.length; ei++) {
      const slotName = swapped[ei] || day.exercises[ei].name;
      if (slotName === exerciseName && sets[ei]?.sets?.length) {
        return sets[ei].sets;
      }
    }
  }
  return null;
}

function getLastEntry(dayId, exIndex) {
  // Legacy fallback by index
  const date = activeDateStr();
  const keys = storageGetAllKeys()
    .filter(k => k.startsWith(`gymbook:${dayId}:`) && !k.endsWith(date))
    .sort().reverse();
  if (!keys.length) return null;
  const raw = storageGet(keys[0]);
  if (!raw) return null;
  const sets = raw.sets || raw;
  if (!sets[exIndex]) return null;
  return sets[exIndex].sets;
}

function adjustReps(ei, s, delta) {
  const input = document.getElementById(`r-${ei}-${s}`);
  if (!input) return;
  const current = parseInt(input.value) || parseInt(input.placeholder) || 0;
  const newVal = Math.max(0, current + delta);
  input.value = newVal;
  if (!sessionData[ei]) sessionData[ei] = { sets: [] };
  if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
  sessionData[ei].sets[s].reps = String(newVal);
  autoSave();
}

function adjustWeight(ei, s, delta) {
  const input = document.getElementById(`w-${ei}-${s}`);
  if (!input) return;
  const current = parseFloat(input.value) || parseFloat(input.placeholder) || 0;
  const newVal = Math.max(0, Math.round((current + delta) * 100) / 100);
  input.value = newVal;
  if (!sessionData[ei]) sessionData[ei] = { sets: [] };
  if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
  sessionData[ei].sets[s].weight = String(newVal);
  autoSave();
}

function adjustSets(ei, delta) {
  const ex = DAYS[currentDay].exercises[ei];
  if (!sessionData[ei]) sessionData[ei] = { sets: [], activeSets: ex.sets };
  const current = sessionData[ei].activeSets != null ? sessionData[ei].activeSets : ex.sets;
  let next;
  if (delta === 0) {
    next = ex.sets; // reset to plan
  } else {
    next = Math.max(1, Math.min(current + delta, 8));
  }
  sessionData[ei].activeSets = next;
  // Pad sets array if needed
  while (sessionData[ei].sets.length < next) {
    sessionData[ei].sets.push({ weight: '', reps: '', done: false });
  }
  autoSave();
  renderDay();
  // Re-open the exercise card
  setTimeout(() => {
    const body = document.getElementById(`exbody-${ei}`);
    const chev = document.getElementById(`chev-${ei}`);
    if (body) { body.classList.add('open'); }
    if (chev) { chev.classList.add('open'); }
  }, 10);
}

let catalogTargetEi = null;
let catalogActiveMuscle = 'brust';

function getMuscleCategoryForExercise(exerciseName) {
  for (const [key, cat] of Object.entries(CATALOG)) {
    if (cat.exercises.includes(exerciseName)) return key;
  }
  return 'brust';
}

function openCatalog(ei) {
  catalogTargetEi = ei;
  catalogTargetDi = currentDay;
  catalogEditMode = false;
  const swappedName = swappedExercises[ei] || DAYS[currentDay].exercises[ei].name;
  catalogActiveMuscle = getMuscleCategoryForExercise(swappedName);
  renderCatalog();
  document.getElementById('catalog-modal').style.display = 'flex';
}

function closeCatalog() {
  document.getElementById('catalog-modal').style.display = 'none';
}

function renderCatalog() {
  const ei = catalogTargetEi;
  const di = catalogEditMode ? catalogTargetDi : currentDay;
  const ex = DAYS[di].exercises[ei];
  const swappedName = catalogEditMode ? null : (swappedExercises[ei] || null);

  const tabs = Object.entries(CATALOG).map(([key, cat]) => `
    <button class="cat-tab ${catalogActiveMuscle === key ? 'active' : ''}" onclick="setCatalogMuscle('${key}')">
      <span class="cat-svg" style="color:${catalogActiveMuscle === key ? 'var(--accent)' : 'var(--muted2)'}">${cat.svg}</span>
      <span class="cat-label">${cat.label}</span>
    </button>
  `).join('');

  const exercises = CATALOG[catalogActiveMuscle].exercises.map(name => {
    const isActive = swappedName === name;
    const isOriginal = ex.name === name;
    const safeName = name.replace(/'/g, "\\'");
    if (catalogEditMode) {
      return `
        <div class="cat-ex-row ${isOriginal ? 'cat-ex-active' : ''}">
          <span class="cat-ex-name" onclick="applySwap(${ei}, '${safeName}')" style="flex:1;cursor:pointer">${name}${isOriginal ? ' <span class="cat-active-badge">Aktuell</span>' : ''}</span>
          <span class="cat-ex-arrow" onclick="applySwap(${ei}, '${safeName}')" style="cursor:pointer;margin-right:10px">${isOriginal ? '✓' : '→'}</span>
          <button onclick="deleteFromCatalog('${safeName}', event)" style="background:none;border:none;color:var(--muted2);font-size:14px;cursor:pointer;padding:4px 6px;border-radius:4px;transition:color 0.15s" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--muted2)'">✕</button>
        </div>
      `;
    }
    return `
      <div class="cat-ex-row ${isActive ? 'cat-ex-active' : ''}" onclick="applySwap(${ei}, '${safeName}')">
        <span class="cat-ex-name">${name}${isOriginal ? ' <span class="cat-original-badge">Original</span>' : ''}${isActive ? ' <span class="cat-active-badge">Aktiv</span>' : ''}</span>
        <span class="cat-ex-arrow">${isActive ? '✓' : '→'}</span>
      </div>
    `;
  }).join('');

  document.getElementById('catalog-inner').innerHTML = `
    <div class="cat-header">
      <div>
        <div class="cat-title">${catalogEditMode ? '✏ Katalog bearbeiten' : 'Übung tauschen'}</div>
        <div class="cat-subtitle">${ex.name}</div>
      </div>
      <button class="modal-close" onclick="closeCatalog()">×</button>
    </div>
    ${!catalogEditMode && swappedName ? `<button class="cat-reset-btn" onclick="resetSwap(${ei});closeCatalog()">↺ Zurück zu: ${ex.name}</button>` : ''}
    ${catalogEditMode ? '<div style="font-family:var(--mono);font-size:10px;color:var(--muted);padding:8px 20px 0">Tippe → zum Auswählen, ✕ zum Entfernen aus dem Katalog</div>' : ''}
    <div class="cat-tabs">${tabs}</div>
    <div class="cat-ex-list">${exercises}</div>
  `;
}

function deleteFromCatalog(name, event) {
  event.stopPropagation();
  if (!confirm(`"${name}" aus dem Katalog entfernen?`)) return;
  const key = catalogActiveMuscle;
  const idx = CATALOG[key].exercises.indexOf(name);
  if (idx > -1) {
    CATALOG[key].exercises.splice(idx, 1);
    saveCustomCatalog();
    renderCatalog();
  }
}

function setCatalogMuscle(key) {
  catalogActiveMuscle = key;
  renderCatalog();
}

function applySwap(ei, altName) {
  if (catalogEditMode) {
    const di = catalogTargetDi;
    let muscle = DAYS[di].exercises[ei].muscle;
    for (const [key, cat] of Object.entries(CATALOG)) {
      if (cat.exercises.includes(altName)) { muscle = cat.label; break; }
    }
    if (editDraft) {
      editDraft[di].exercises[ei].name = altName;
      editDraft[di].exercises[ei].muscle = muscle;
    }
    DAYS[di].exercises[ei].name = altName;
    DAYS[di].exercises[ei].muscle = muscle;
    catalogEditMode = false;
    closeCatalog();
    renderDay();
    return;
  }
  swappedExercises[ei] = altName;
  autoSave();
  closeCatalog();
  renderDay();
  setTimeout(() => {
    const body = document.getElementById(`exbody-${ei}`);
    const chev = document.getElementById(`chev-${ei}`);
    if (body) body.classList.add('open');
    if (chev) chev.classList.add('open');
  }, 10);
}

function resetSwap(ei) {
  delete swappedExercises[ei];
  autoSave();
  renderDay();
  setTimeout(() => {
    const body = document.getElementById(`exbody-${ei}`);
    const chev = document.getElementById(`chev-${ei}`);
    if (body) body.classList.add('open');
    if (chev) chev.classList.add('open');
  }, 10);
}

async function saveCustomPlan() {
  if (!editDraft) return;
  // Collect field values from DOM
  DAYS.forEach((day, di) => {
    day.exercises.forEach((ex, ei) => {
      const setsEl = document.getElementById(`edit-sets-${di}-${ei}`);
      const repsEl = document.getElementById(`edit-reps-${di}-${ei}`);
      const pauseEl = document.getElementById(`edit-pause-${di}-${ei}`);
      const stepEl = document.getElementById(`edit-step-${di}-${ei}`);
      if (setsEl) editDraft[di].exercises[ei].sets = parseInt(setsEl.value) || ex.sets;
      if (repsEl) editDraft[di].exercises[ei].reps = repsEl.value || ex.reps;
      if (pauseEl) editDraft[di].exercises[ei].pause = pauseEl.value || ex.pause;
      if (stepEl) editDraft[di].exercises[ei].step = parseFloat(stepEl.value) || 2.5;
    });
  });
  // Apply to DAYS
  editDraft.forEach((day, di) => {
    day.exercises.forEach((ex, ei) => {
      DAYS[di].exercises[ei].name  = ex.name;
      DAYS[di].exercises[ei].muscle = ex.muscle;
      DAYS[di].exercises[ei].sets  = ex.sets;
      DAYS[di].exercises[ei].reps  = ex.reps;
      DAYS[di].exercises[ei].pause = ex.pause;
    });
  });
  storageSet('gymbook:customplan', JSON.stringify(DAYS));
  saveCustomCatalog();
  setStatus('Plan gespeichert ✓', true);
  editMode = false;
  editDraft = null;
  const btn = document.getElementById('edit-plan-btn');
  btn.classList.remove('active');
  btn.textContent = '✏ Plan';
  const saveBar = document.getElementById('save-bar-btn');
  saveBar.textContent = 'Einheit speichern';
  saveBar.onclick = saveSession;
  renderNav();
  renderDay();
}

function loadCustomPlan() {
  const saved = storageGet('gymbook:customplan');
  if (!saved) return;
  try {
    const custom = JSON.parse(typeof saved === 'string' ? saved : JSON.stringify(saved));
    // Restore plan – support added exercises
    custom.forEach((day, di) => {
      if (!DAYS[di]) return;
      DAYS[di].exercises = day.exercises.map(ex => ({
        ...ex,
        alternatives: ex.alternatives || []
      }));
    });
  } catch(e) {}
}

function loadCustomCatalog() {
  const saved = storageGet('gymbook:customcatalog');
  if (!saved) return;
  try {
    const custom = typeof saved === 'string' ? JSON.parse(saved) : saved;
    Object.entries(custom).forEach(([key, exercises]) => {
      if (CATALOG[key]) CATALOG[key].exercises = exercises;
    });
  } catch(e) {}
}

function saveCustomCatalog() {
  const catalogData = {};
  Object.entries(CATALOG).forEach(([key, cat]) => {
    catalogData[key] = cat.exercises;
  });
  storageSet('gymbook:customcatalog', catalogData);
}

function addExercise(di) {
  const name = document.getElementById('new-ex-name').value.trim();
  const muscle = document.getElementById('new-ex-muscle').value.trim();
  const sets = parseInt(document.getElementById('new-ex-sets').value) || 3;
  const reps = document.getElementById('new-ex-reps').value.trim() || '8–12';
  const pause = document.getElementById('new-ex-pause').value.trim() || '90 Sek';
  if (!name) return;

  const newEx = { name, muscle, sets, reps, pause, alternatives: [] };
  DAYS[di].exercises.push(newEx);
  if (editDraft) editDraft[di].exercises.push({ ...newEx });

  // Also add to catalog if not already there
  addToCatalog(name, muscle);

  renderDay();
}

function addToCatalog(name, muscle) {
  // Find best matching catalog key by muscle label
  const key = Object.entries(CATALOG).find(([k, cat]) =>
    cat.label.toLowerCase() === muscle.toLowerCase() ||
    muscle.toLowerCase().includes(cat.label.toLowerCase())
  )?.[0];

  if (key && !CATALOG[key].exercises.includes(name)) {
    CATALOG[key].exercises.push(name);
  } else if (!key) {
    // Add to a custom category or the closest match – default to brust
    const fallback = Object.keys(CATALOG)[0];
    if (!CATALOG[fallback].exercises.includes(name)) {
      CATALOG[fallback].exercises.push(name);
    }
  }
}

function renderNav() {

  nav.innerHTML = DAYS.map((d,i) => `

      <span class="dot dot-${d.color}"></span>${d.type}
    </button>
  `).join('');

function renderDay() {
  if (editMode) { renderEditDay(); return; }
  const day = DAYS[currentDay];
  loadSessionData();
  const date = activeDateStr();
  const isBackEntry = date !== todayStr();
  document.getElementById('today-date').textContent = `${day.label} · ${formatDate(date)}`;
  const nextEl = document.getElementById('next-training');
  if (nextEl) nextEl.textContent = getNextTrainingDay() || '';

  let html = `
    <div class="session-meta">
      <span class="session-label">${weekdayFromDate(date)}</span>
      <div class="session-date-wrap">
        <input type="date" id="session-date-picker" class="date-picker" value="${date}" max="${todayStr()}" onchange="setActiveDate(this.value)">
        ${isBackEntry ? '<span class="back-entry-badge">Nachtrag</span>' : ''}
      </div>
      <span class="session-note">${day.duration}</span>
    </div>
  `;

  day.exercises.forEach((ex, ei) => {
    const sd = sessionData[ei] || { sets: [] };
    const anyDone = sd.sets.some(s => s.done);
    const swappedName = swappedExercises[ei] || null;
    const displayName = swappedName || ex.name;
    const lastEntry = getLastEntryByName(day.id, displayName) || getLastEntry(day.id, ei);
    const suggestion = calcWeightSuggestion(lastEntry, ex.reps, ex.step || 2.5, day.id, displayName);

    // Suggestion label
    let suggLabel = '';
    if (suggestion) {
      if (suggestion.reason === 'all') {
        suggLabel = `<span class="sugg-badge sugg-up">↑ +2,5 kg → ${suggestion.weight} kg</span>`;
      } else if (suggestion.reason === 'some') {
        suggLabel = `<span class="sugg-badge sugg-half">↑ +1,25 kg → ${suggestion.weight} kg</span>`;
      } else {
        suggLabel = `<span class="sugg-badge sugg-same">= ${suggestion.weight} kg halten</span>`;
      }
    }

    // Swap button only
    let swapPanelHtml = `
      <div class="swap-panel" id="swap-panel-${ei}" style="display:none"></div>
    `;

    // Muscle color accent based on catalog category – partial match
    const muscleColor = (() => {
      const nameLower = displayName.toLowerCase();
      const muscleLower = ex.muscle.toLowerCase();

      // Check catalog first with partial match
      for (const [key, cat] of Object.entries(CATALOG)) {
        if (cat.exercises.some(e => nameLower.includes(e.toLowerCase()) || e.toLowerCase().includes(nameLower))) {
          const colors = {
            brust:   '#e87f7f',  // Rot
            trizeps: '#e8a060',  // Orange/Koralle
            ruecken: '#7fb8e8',  // Blau
            bizeps:  '#5dcaa5',  // Türkis
            schulter:'#9b7fe8',  // Lila
            beine:   '#e8b87f',  // Orange warm
            bauch:   '#c9a84c'   // Gold
          };
          return colors[key] || 'var(--muted2)';
        }
      }
      // Fallback via muscle field
      if (muscleLower.includes('trizeps')) return '#e8a060';
      if (muscleLower.includes('bizeps') || muscleLower.includes('brachialis')) return '#5dcaa5';
      if (muscleLower.includes('brust')) return '#e87f7f';
      if (muscleLower.includes('rücken') || muscleLower.includes('lat') || muscleLower.includes('mittelrücken')) return '#7fb8e8';
      if (muscleLower.includes('schulter')) return '#9b7fe8';
      if (muscleLower.includes('bein') || muscleLower.includes('waden') || muscleLower.includes('gluteus') || muscleLower.includes('hamstring')) return '#e8b87f';
      if (muscleLower.includes('bauch')) return '#c9a84c';
      return 'var(--muted2)';
    })();

    // Determine active set count (plan default or user-adjusted)
    const activeSets = (sessionData[ei] && sessionData[ei].activeSets != null)
      ? sessionData[ei].activeSets
      : ex.sets;

    // Progress dots
    const totalSets = activeSets;
    const doneSets = (sessionData[ei]?.sets || []).filter(s => s.done).length;
    const progressDots = Array.from({length: totalSets}, (_, i) =>
      `<div class="progress-dot ${i < doneSets ? 'done' : ''}"></div>`
    ).join('');

    html += `
      <div class="exercise-card" style="border-left:3px solid ${muscleColor};border-radius:0 8px 8px 0">
        <div class="exercise-header" onclick="toggleEx(${ei}, this)">
          <span class="ex-num">${String(ei+1).padStart(2,'0')}</span>
          <div style="flex:1">
            <div class="ex-name">${displayName}${swappedName ? ' <span style="font-size:10px;color:var(--legs);font-family:var(--mono);font-weight:400">(ersetzt)</span>' : ''}</div>
            <div class="ex-meta">${ex.muscle} · ${ex.sets}×${ex.reps} · Pause ${ex.pause}</div>
            <div class="progress-dots">${progressDots}</div>
          </div>
          ${suggLabel}
          ${timerExerciseName === displayName && document.getElementById('timer-overlay')?.style.display !== 'none' ? '<span style="font-family:var(--mono);font-size:10px;color:var(--accent);margin-left:4px">⏱</span>' : ''}
          <span class="ex-chevron" id="chev-${ei}">▶</span>
        </div>
        <div class="exercise-body" id="exbody-${ei}">
          <div style="display:flex;justify-content:flex-end;margin-bottom:8px;gap:6px">
            <button class="swap-btn ${swappedName ? 'active' : ''}" onclick="event.stopPropagation();openCatalog(${ei})">⇄ Übung tauschen</button>
            ${swappedName ? `<button class="swap-btn" style="color:var(--red);border-color:var(--red)" onclick="event.stopPropagation();resetSwap(${ei})">↺ Zurücksetzen</button>` : ''}
          </div>
          ${swapPanelHtml}
          <div class="sets-header">
            <span>Satz</span><span>Gewicht</span><span></span><span>Wdh.</span><span></span><span></span>
          </div>
    `;

    // Ensure sessionData has enough set slots
    if (!sessionData[ei]) sessionData[ei] = { sets: [], activeSets: ex.sets };
    while (sessionData[ei].sets.length < activeSets) {
      sessionData[ei].sets.push({ weight: '', reps: '', done: false });
    }

    const step = ex.step || 2.5;

    for (let s = 0; s < activeSets; s++) {
      const setData = sessionData[ei].sets[s] || { weight: '', reps: '', done: false };
      const suggWeight = suggestion ? suggestion.weight : '';
      const placeholder = setData.weight ? '' : (suggWeight ? `${suggWeight}` : (lastEntry ? lastEntry[s]?.weight || '—' : '—'));
      html += `
        <div class="set-row" id="set-row-${ei}-${s}" style="grid-template-columns:22px 1fr auto 1fr auto 34px">
          <span class="set-num">${s+1}</span>
          <input class="set-input ${setData.done?'done':''}" id="w-${ei}-${s}" type="number" step="${step}" min="0" placeholder="${placeholder}" value="${setData.weight}" oninput="markDirty()" onchange="autoSave()">
          <div class="quick-btns">
            <button onclick="adjustWeight(${ei},${s},${step})">+</button>
            <button onclick="adjustWeight(${ei},${s},-${step})">−</button>
          </div>
          <input class="set-input ${setData.done?'done':''}" id="r-${ei}-${s}" type="number" min="0" placeholder="${ex.reps.split(/[–\-]/)[0]}" value="${setData.reps}" oninput="markDirty()" onchange="autoSave()">
          <div class="quick-btns">
            <button onclick="adjustReps(${ei},${s},1)">+</button>
            <button onclick="adjustReps(${ei},${s},-1)">−</button>
          </div>
          <button class="check-btn ${setData.done?'checked':''}" id="chk-${ei}-${s}" onclick="toggleDone(${ei},${s})">✓</button>
        </div>
      `;
    }

    // + / - set buttons
    html += `
      <div class="set-adjust-row">
        ${activeSets > 1 ? `<button class="set-adj-btn set-adj-minus" onclick="adjustSets(${ei}, -1)">− Satz entfernen</button>` : ''}
        <button class="set-adj-btn set-adj-plus" onclick="adjustSets(${ei}, 1)">+ Satz hinzufügen</button>
        ${activeSets !== ex.sets ? `<button class="set-adj-btn set-adj-reset" onclick="adjustSets(${ei}, 0)">↺ ${ex.sets} Sätze (Plan)</button>` : ''}
      </div>
    `;

    if (ex.note) {
      html += `<div class="ex-note ${ex.warn?'warning':''}">${ex.note}</div>`;
    }

    // Last session + suggestion detail
    if (lastEntry) {
      const filledSets = lastEntry.filter(s => s.weight);
      if (filledSets.length) {
        html += `
          <div class="history-section">
            <div class="history-title">LETZTE EINHEIT</div>
            ${lastEntry.map((s,i) => {
              if (!s.weight) return '';
              const { high } = parseRepRange(ex.reps);
              const exceeded = s.reps && parseInt(s.reps) > high;
              return `<div class="history-entry">
                <span class="history-date">Satz ${i+1}</span>
                <span class="history-sets ${exceeded ? 'history-exceeded' : ''}">${s.weight} kg × ${s.reps || '—'} Wdh.${exceeded ? ' ↑' : ''}</span>
              </div>`;
            }).join('')}
            ${suggestion && suggestion.reason !== 'same' ? `<div class="sugg-detail">Vorschlag basiert auf übertroffenem Ziel (>${parseRepRange(ex.reps).high} Wdh.)</div>` : ''}
          </div>
        `;
      }
    }

    html += `</div></div>`;
  });

  document.getElementById('main-content').innerHTML = html;
  document.getElementById('main-content').style.paddingBottom = '80px';

  const statusEl = document.getElementById('save-status');
  if (statusEl) {
    const saved = storageGet(getKey(day.id, date));
    const currentText = statusEl.textContent;
    // Don't overwrite cloud status messages
    if (!currentText.includes('☁') && !currentText.includes('⚠')) {
      statusEl.textContent = saved ? `Gespeichert — ${formatDate(date)}` : 'Nicht gespeichert';
      statusEl.className = saved ? 'save-status saved' : 'save-status';
    }
  }
  updateTrainingEnd();
}

function parseRepRange(repsStr) {
  const parts = repsStr.split(/[–\-]/);
  if (parts.length === 2) return { low: parseInt(parts[0]), high: parseInt(parts[1]) };
  const single = parseInt(repsStr);
  return { low: single, high: single };
}

function getLastEntriesByName(dayId, exerciseName, count) {
  const date = activeDateStr();
  const keys = storageGetAllKeys()
    .filter(k => k.startsWith(`gymbook:${dayId}:`) && !k.endsWith(date))
    .sort().reverse().slice(0, count);
  return keys.map(k => {
    const raw = storageGet(k);
    if (!raw) return null;
    const sets = raw.sets || raw;
    const swapped = raw.swapped || {};
    const day = DAYS.find(d => d.id === dayId);
    if (!day) return null;
    for (let ei = 0; ei < day.exercises.length; ei++) {
      const slotName = swapped[ei] || day.exercises[ei].name;
      if (slotName === exerciseName && sets[ei]?.sets?.length) return sets[ei].sets;
    }
    return null;
  }).filter(Boolean);
}

function calcWeightSuggestion(lastSets, repsTarget, step, dayId, exerciseName) {
  if (!lastSets || !lastSets.length) return null;
  const { high } = parseRepRange(repsTarget);
  const inc = step || 2.5;

  // Get rolling average from last 3 sessions if available
  let baseWeight = 0;
  let allExceeded = false;
  let anyExceeded = false;

  if (dayId && exerciseName) {
    const recent = getLastEntriesByName(dayId, exerciseName, 3);
    if (recent.length >= 2) {
      const avgWeights = recent.map(sets => {
        const logged = sets.filter(s => s.weight);
        if (!logged.length) return 0;
        return parseFloat(logged[logged.length - 1].weight) || 0;
      }).filter(w => w > 0);
      if (avgWeights.length) {
        baseWeight = avgWeights.reduce((a, b) => a + b, 0) / avgWeights.length;
        // Round to nearest step
        baseWeight = Math.round(baseWeight / inc) * inc;
      }
      // Check if most recent session exceeded
      const latestLogged = recent[0].filter(s => s.weight && s.reps);
      allExceeded = latestLogged.length > 0 && latestLogged.every(s => parseInt(s.reps) > high);
      anyExceeded = latestLogged.some(s => parseInt(s.reps) > high);
    }
  }

  // Fallback to last session only
  if (!baseWeight) {
    const logged = lastSets.filter(s => s.weight && s.reps);
    if (!logged.length) return null;
    allExceeded = logged.every(s => parseInt(s.reps) > high);
    anyExceeded = logged.some(s => parseInt(s.reps) > high);
    baseWeight = parseFloat(logged[logged.length - 1].weight);
    if (isNaN(baseWeight) || baseWeight <= 0) return null;
  }

  if (allExceeded) return { weight: baseWeight + inc, reason: 'all', prevWeight: baseWeight };
  if (anyExceeded) return { weight: baseWeight + (inc / 2), reason: 'some', prevWeight: baseWeight };
  return { weight: baseWeight, reason: 'same', prevWeight: baseWeight };
}

function toggleEx(ei, headerEl) {

  const chev = document.getElementById(`chev-${ei}`);
  const open = body.classList.contains('open');

  chev.classList.toggle('open', !open);
  if (!open && headerEl) {

    }, 50);

}

// ── TIMER ─────────────────────────────────────────────────────
let timerInterval = null;
let timerTotal = 0;
let timerStartTime = null;   // timestamp when timer started
let timerPaused = false;
let timerPausedAt = null;    // remaining seconds when paused
let timerExerciseName = '';
let notificationTimeout = null;
const CIRCUMFERENCE = 2 * Math.PI * 52;

function parsePause(pauseStr) {
  if (!pauseStr) return 120;
  const rangeMatch = pauseStr.match(/(\d+)[–\-](\d+)/);
  if (rangeMatch) return parseInt(rangeMatch[2]);
  const colonMatch = pauseStr.match(/(\d+):(\d+)/);
  if (colonMatch) return parseInt(colonMatch[1]) * 60 + parseInt(colonMatch[2]);
  const secMatch = pauseStr.match(/(\d+)/);
  if (secMatch) return parseInt(secMatch[1]);
  return 120;
}

async function requestNotificationPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const result = await Notification.requestPermission();
  return result === 'granted';
}

function scheduleNotification(seconds, exerciseName) {
  clearTimeout(notificationTimeout);
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  notificationTimeout = setTimeout(() => {
    try {
      new Notification('GymBook – Pause vorbei! 💪', {
        body: `Nächster Satz: ${exerciseName}`,
        icon: 'https://tischy85.github.io/gymbook/icon.png',
        vibrate: [200, 100, 200]
      });
    } catch(e) {}
  }, seconds * 1000);
}

function getRemainingSeconds() {
  if (!timerStartTime) return 0;
  if (timerPaused) return timerPausedAt;
  const elapsed = (Date.now() - timerStartTime) / 1000;
  return Math.max(0, timerTotal - elapsed);
}

async function startTimer(seconds, exerciseName) {
  clearInterval(timerInterval);
  clearTimeout(notificationTimeout);
  timerTotal = seconds;
  timerStartTime = Date.now();
  timerPaused = false;
  timerPausedAt = null;
  timerExerciseName = exerciseName;

  // Request notification permission on first use
  await requestNotificationPermission();
  scheduleNotification(seconds, exerciseName);

  document.getElementById('timer-label').textContent = `Pause · ${exerciseName}`;
  document.getElementById('timer-pause-btn').textContent = 'Pause';
  document.getElementById('timer-overlay').style.display = 'flex';
  document.getElementById('timer-progress').style.stroke = 'var(--accent)';

  updateTimerDisplay();
  timerInterval = setInterval(timerTick, 250); // faster tick for smooth display
}

function timerTick() {
  if (timerPaused) return;
  const remaining = getRemainingSeconds();
  if (remaining <= 0) {
    clearInterval(timerInterval);
    timerStartTime = null;
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    document.getElementById('timer-progress').style.stroke = 'var(--pull)';
    document.getElementById('timer-pause-btn').textContent = 'Fertig';
    document.getElementById('timer-time').textContent = '0:00';
    document.getElementById('timer-progress').style.strokeDashoffset = CIRCUMFERENCE;
  } else {
    updateTimerDisplay();
  }
}

function updateTimerDisplay() {
  const remaining = getRemainingSeconds();
  const m = Math.floor(remaining / 60);
  const s = Math.floor(remaining % 60);
  document.getElementById('timer-time').textContent = `${m}:${String(s).padStart(2,'0')}`;
  const progress = timerTotal > 0 ? remaining / timerTotal : 0;
  const offset = CIRCUMFERENCE * (1 - progress);
  document.getElementById('timer-progress').style.strokeDashoffset = offset;
  document.getElementById('timer-progress').style.strokeDasharray = CIRCUMFERENCE;
  if (remaining > 0 && remaining <= 10) {
    document.getElementById('timer-progress').style.stroke = 'var(--push)';
  } else if (remaining > 0) {
    document.getElementById('timer-progress').style.stroke = 'var(--accent)';
  }
}

function toggleTimerPause() {
  const remaining = getRemainingSeconds();
  if (remaining <= 0) { closeTimer(); return; }
  timerPaused = !timerPaused;
  if (timerPaused) {
    timerPausedAt = remaining;
    clearTimeout(notificationTimeout);
    document.getElementById('timer-pause-btn').textContent = 'Weiter';
  } else {
    // Recalculate start time based on remaining
    timerStartTime = Date.now() - ((timerTotal - timerPausedAt) * 1000);
    timerPausedAt = null;
    scheduleNotification(remaining, timerExerciseName);
    document.getElementById('timer-pause-btn').textContent = 'Pause';
  }
}

function closeTimer() {
  clearInterval(timerInterval);
  clearTimeout(notificationTimeout);
  timerStartTime = null;
  timerPaused = false;
  document.getElementById('timer-overlay').style.display = 'none';
  document.getElementById('timer-progress').style.stroke = 'var(--accent)';
}

// Resume timer if app comes back from background
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && timerStartTime && !timerPaused) {
    const remaining = getRemainingSeconds();
    if (remaining <= 0) {
      timerTick(); // trigger finish
    } else {
      updateTimerDisplay();
      clearInterval(timerInterval);
      timerInterval = setInterval(timerTick, 250);
    }
  }
});
// ─────────────────────────────────────────────────────────────

function calcTrainingEnd() {
  const day = DAYS[currentDay];
  let remainingSeconds = 0;
  day.exercises.forEach((ex, ei) => {
    const sd = sessionData[ei] || { sets: [], activeSets: null };
    const numSets = sd.activeSets != null ? sd.activeSets : ex.sets;
    const doneSets = (sd.sets || []).filter(s => s.done).length;
    const remaining = Math.max(0, numSets - doneSets);
    const pauseSec = defaultPauseOverrides[ex.name] || parsePause(ex.pause);
    const setTimeSec = 45;
    remainingSeconds += remaining * (setTimeSec + pauseSec);
  });
  if (remainingSeconds <= 0) return null;
  const end = new Date(Date.now() + remainingSeconds * 1000);
  return `Fertig ~${String(end.getHours()).padStart(2,'0')}:${String(end.getMinutes()).padStart(2,'0')} Uhr`;
}

function updateTrainingEnd() {
  const el = document.getElementById('training-end');
  const delBtn = document.getElementById('delete-session-btn');
  if (!el) return;
  const result = calcTrainingEnd();
  if (result) {
    el.textContent = result;
    el.style.display = 'inline';
  } else {
    el.style.display = 'none';
  }
  // Show delete button if session has data
  const hasData = Object.values(sessionData).some(s => s.sets?.some(x => x.weight || x.done));
  if (delBtn) delBtn.style.display = hasData ? 'inline' : 'none';
}

function deleteSession() {
  const day = DAYS[currentDay];
  const date = activeDateStr();
  if (!confirm(`Einheit vom ${formatDate(date)} wirklich löschen?`)) return;
  const key = getKey(day.id, date);
  delete cloudData[key];
  localStorage.removeItem(key);
  cloudPush();
  loadSessionData();
  renderDay();
  setStatus('Einheit gelöscht', false);
}

function getPersonalRecord(exerciseName) {
  const allKeys = storageGetAllKeys().filter(k => {
    const p = k.split(':'); return p.length === 3 && !['customplan','customcatalog','pausesettings'].includes(p[1]);
  });
  let best = 0;
  allKeys.forEach(k => {
    const raw = storageGet(k);
    if (!raw) return;
    const sets = raw.sets || raw;
    const swapped = raw.swapped || {};
    DAYS.forEach((day, di) => {
      day.exercises.forEach((ex, ei) => {
        const name = swapped[ei] || ex.name;
        if (name !== exerciseName) return;
        const exSets = sets[ei]?.sets || [];
        exSets.forEach(s => {
          const w = parseFloat(s.weight);
          if (!isNaN(w) && w > best) best = w;
        });
      });
    });
  });
  return best;
}

function showPRCelebration(exerciseName, weight) {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#c9a84c;color:#090909;font-family:monospace;font-size:13px;font-weight:600;padding:10px 20px;border-radius:20px;z-index:999;white-space:nowrap;animation:prPop 0.3s ease`;
  el.textContent = `🏆 Neuer Rekord! ${weight} kg`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function getNextTrainingDay() {
  const dayOrder = { upper: 0, push: 2, pull: 4, legs: 6 }; // Mon=0, Wed=2, Fri=4, Sat=5
  const weekdayMap = { upper: 1, push: 3, pull: 5, legs: 6 }; // JS: Sun=0, Mon=1...
  const now = new Date();
  const todayWeekday = now.getDay();

  let best = null;
  let bestDiff = 8;
  DAYS.forEach(day => {
    const target = weekdayMap[day.id];
    let diff = (target - todayWeekday + 7) % 7;
    if (diff === 0) diff = 7; // not today
    if (diff < bestDiff) { bestDiff = diff; best = { day, diff }; }
  });
  if (!best) return null;
  const next = new Date(now);
  next.setDate(now.getDate() + best.diff);
  const weekdays = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  return `Nächstes Training: ${weekdays[next.getDay()]}, ${best.day.type}`;
}

function toggleDone(ei, s) {
  collectInputValues();
  if (!sessionData[ei]) sessionData[ei] = { sets: [] };
  if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
  sessionData[ei].sets[s].done = !sessionData[ei].sets[s].done;
  const btn = document.getElementById(`chk-${ei}-${s}`);
  const w = document.getElementById(`w-${ei}-${s}`);
  const r = document.getElementById(`r-${ei}-${s}`);
  const done = sessionData[ei].sets[s].done;
  btn.classList.toggle('checked', done);
  if(w) w.classList.toggle('done', done);
  if(r) r.classList.toggle('done', done);

  // PR check
  if (done) {
    const weight = parseFloat(sessionData[ei].sets[s].weight);
    if (!isNaN(weight) && weight > 0) {
      const ex = DAYS[currentDay].exercises[ei];
      const displayName = swappedExercises[ei] || ex.name;
      const pr = getPersonalRecord(displayName);
      if (weight > pr) showPRCelebration(displayName, weight);
    }
  }

  autoSave();
  updateTrainingEnd();
  if (done) {
    const ex = DAYS[currentDay].exercises[ei];
    const swappedName = swappedExercises[ei] || null;
    const displayName = swappedName || ex.name;
    const seconds = defaultPauseOverrides[displayName] || parsePause(ex.pause);
    startTimer(seconds, displayName);
  } else {
    closeTimer();
  }
}

function markDirty() {
  dirty = true;
  const el = document.getElementById('save-status');
  el.textContent = 'Ungespeicherte Änderungen';
  el.className = 'save-status';
}

function autoSave() {
  collectInputValues();
  saveSession();
}

function switchDay(i) {
  if (dirty) { collectInputValues(); saveSession(); }
  currentDay = i;
  activeDate = null;
  renderNav();
  renderDay();
}

function showHistory(searchTerm) {
  const term = (searchTerm || '').toLowerCase().trim();
  let html = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Trainingsverlauf</h2>
    <div style="margin:12px 0 16px">
      <input type="text" id="history-search" placeholder="Übung suchen…" value="${searchTerm || ''}"
        oninput="showHistory(this.value)"
        style="background:#111114;border:1px solid rgba(255,255,255,0.22);color:#f5f2eb;font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:6px;width:100%;outline:none;box-sizing:border-box">
    </div>
  `;
  let hasAny = false;

  DAYS.forEach(day => {
    const hist = getHistory(day.id);
    if (!hist.length) return;

    const filteredHist = hist.filter(entry => {
      if (!term) return true;
      return day.exercises.some((ex, ei) => {
        const name = (entry.data?.swapped?.[ei] || ex.name).toLowerCase();
        const sets = entry.data?.[ei]?.sets || (entry.data?.sets?.[ei]?.sets) || [];
        return name.includes(term) && sets.some(s => s.weight);
      });
    });

    if (!filteredHist.length) return;
    hasAny = true;
    html += `<div style="margin-top:16px"><div style="font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">${day.label} — ${day.type}</div>`;

    filteredHist.slice(0, 10).forEach(entry => {
      html += `<div class="history-full-entry"><div class="history-full-date">${formatDate(entry.date)}</div><div class="history-full-sets">`;
      day.exercises.forEach((ex, ei) => {
        const name = entry.data?.swapped?.[ei] || ex.name;
        if (term && !name.toLowerCase().includes(term)) return;
        const rawSets = entry.data?.[ei]?.sets || entry.data?.sets?.[ei]?.sets || [];
        const filled = rawSets.filter(s => s.weight);
        if (filled.length) {
          html += `<span style="color:var(--text)">${name}</span>: ${filled.map(s => `${s.weight}kg×${s.reps||'?'}`).join(', ')}<br>`;
        }
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  });

  if (!hasAny) {
    html += `<div class="empty-state">${term ? `Keine Einträge für "${searchTerm}"` : 'Noch keine Einheiten gespeichert.'}</div>`;
  }

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
  if (searchTerm !== undefined) {
    const input = document.getElementById('history-search');
    if (input) { input.focus(); const len = input.value.length; input.setSelectionRange(len, len); }
  }
}

function exportData() {
  const allData = {};
  storageGetAllKeys().forEach(k => {
    allData[k] = storageGet(k);
  });
  if (!Object.keys(allData).length) {
    alert('Noch keine Daten zum Exportieren vorhanden.');
    return;
  }
  const json = JSON.stringify({ version: 1, exported: todayStr(), data: allData }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gymbook-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  const el = document.getElementById('save-status');
  el.textContent = `Export gespeichert — ${formatDate(todayStr())}`;
  el.className = 'save-status saved';
  setTimeout(() => { el.textContent = 'Alle Änderungen gespeichert'; }, 3000);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      const incoming = parsed.data || parsed; // support both formats
      const keys = Object.keys(incoming).filter(k => k.startsWith('gymbook:'));
      if (!keys.length) { alert('Keine gültigen GymBook-Daten in der Datei gefunden.'); return; }

      const existingKeys = storageGetAllKeys();
      let skipped = 0;
      let imported = 0;

      keys.forEach(k => {
        if (existingKeys.includes(k)) {
          skipped++;
        } else {
          storageSet(k, incoming[k]);
          imported++;
        }
      });

      const msg = skipped > 0
        ? `${imported} Einträge importiert, ${skipped} bereits vorhanden (nicht überschrieben).`
        : `${imported} Einträge erfolgreich importiert.`;

      // Show result in modal
      document.getElementById('modal-content').innerHTML = `
        <button class="modal-close" onclick="closeModal()">×</button>
        <h2>Import abgeschlossen</h2>
        <div style="margin-top:16px;font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.8">${msg}</div>
        ${skipped > 0 ? `<div style="margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--muted2)">Vorhandene Einträge werden nie überschrieben, um Datenverlust zu vermeiden.</div>` : ''}
        <button class="btn btn-accent" style="margin-top:20px;width:100%" onclick="closeModal();renderDay()">OK</button>
      `;
      document.getElementById('modal').style.display = 'flex';
      event.target.value = '';
    } catch(err) {
      alert('Fehler beim Lesen der Datei. Bitte eine gültige GymBook JSON-Datei auswählen.');
    }
  };
  reader.readAsText(file);
}
