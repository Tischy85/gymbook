<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymBook">
<title>GymBook</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:    #1a1a1c;
    --bg2:   #222226;
    --bg3:   #2a2a2f;
    --bg4:   #323238;
    --border:  rgba(255,255,255,0.15);
    --border2: rgba(255,255,255,0.28);
    --text:  #f5f2eb;
    --muted: #a09b94;
    --muted2:#6b6560;
    --accent:  #c9a84c;
    --accent2: #a8863a;
    --accent3: #e8c97a;
    --accent-dim:  rgba(201,168,76,0.09);
    --accent-dim2: rgba(201,168,76,0.16);
    --upper: #9b7fe8;
    --push:  #e87f7f;
    --pull:  #7fb8e8;
    --legs:  #e8a87f;
    --red:   #e86060;
    --mono:  'JetBrains Mono', monospace;
    --sans:  'Inter', sans-serif;
    --display: 'Playfair Display', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  /* HEADER */
  .header { padding: 32px 24px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 0.5px solid var(--border); padding-bottom: 20px; }
  .header-left h1 { font-family: var(--display); font-size: 32px; font-weight: 900; letter-spacing: -1px; line-height: 1; color: var(--text); }
  .header-left h1 span { color: var(--accent); }
  .header-left p { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 6px; letter-spacing: 0.04em; }
  .header-right { display: flex; gap: 6px; align-items: center; }
  .btn { background: none; border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 7px 13px; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; letter-spacing: 0.03em; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent { background: var(--accent); color: #090909; border-color: var(--accent); font-weight: 500; }
  .btn-accent:hover { background: var(--accent3); border-color: var(--accent3); color: #090909; }

  /* NAV */
  .nav { display: flex; gap: 2px; padding: 16px 24px 0; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-family: var(--sans); font-size: 12px; font-weight: 500; padding: 8px 16px; cursor: pointer; transition: all 0.15s; white-space: nowrap; display: flex; align-items: center; gap: 7px; border-radius: 0; }
  .nav-btn .dot { width: 5px; height: 5px; border-radius: 50%; }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active-upper { color: var(--upper); border-bottom-color: var(--upper); }
  .nav-btn.active-legs   { color: var(--legs);  border-bottom-color: var(--legs); }
  .nav-btn.active-push   { color: var(--push);  border-bottom-color: var(--push); }
  .nav-btn.active-pull   { color: var(--pull);  border-bottom-color: var(--pull); }
  .dot-upper { background: var(--upper); }
  .dot-legs  { background: var(--legs); }
  .dot-push  { background: var(--push); }
  .dot-pull  { background: var(--pull); }

  /* MAIN */
  .main { padding: 20px 24px 40px; }

  /* SESSION META */
  .session-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .session-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 10px; border-radius: 3px; font-family: var(--mono); }
  .label-upper { color: var(--upper); background: rgba(155,127,232,0.08); border: 0.5px solid rgba(155,127,232,0.2); }
  .label-legs  { color: var(--legs);  background: rgba(232,168,127,0.08); border: 0.5px solid rgba(232,168,127,0.2); }
  .label-push  { color: var(--push);  background: rgba(232,127,127,0.08); border: 0.5px solid rgba(232,127,127,0.2); }
  .label-pull  { color: var(--pull);  background: rgba(127,184,232,0.08); border: 0.5px solid rgba(127,184,232,0.2); }
  .session-note { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: auto; letter-spacing: 0.03em; }

  /* DATE PICKER */
  .date-picker-wrap { display: flex; align-items: center; gap: 8px; }
  .date-picker { background: transparent; border: none; border-bottom: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 11px; padding: 4px 2px; outline: none; cursor: pointer; transition: border-color 0.15s; color-scheme: dark; }
  .date-picker:hover, .date-picker:focus { border-bottom-color: var(--accent); color: var(--text); }
  .back-entry-badge { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 3px; background: rgba(201,168,76,0.1); color: var(--accent); border: 0.5px solid rgba(201,168,76,0.25); }

  /* EXERCISE CARDS */
  .exercise-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s; }
  .exercise-card:hover { border-color: var(--border2); }
  .exercise-header { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; }
  .ex-num { font-family: var(--mono); font-size: 10px; color: var(--muted2); width: 18px; flex-shrink: 0; }
  .ex-name { font-size: 13px; font-weight: 600; flex: 1; letter-spacing: -0.2px; }
  .ex-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }
  .ex-chevron { font-size: 9px; color: var(--muted2); transition: transform 0.2s; }
  .ex-chevron.open { transform: rotate(90deg); }
  .exercise-body { display: none; padding: 0 18px 16px; border-top: 0.5px solid var(--border); }
  .exercise-body.open { display: block; }

  /* SET ROWS */
  .sets-header { display: grid; grid-template-columns: 24px 1fr 1fr 1fr 28px; gap: 8px; padding: 12px 0 6px; }
  .sets-header span { font-family: var(--mono); font-size: 9px; color: var(--muted2); text-align: center; letter-spacing: 0.06em; text-transform: uppercase; }
  .sets-header span:nth-child(2) { text-align: left; }
  .set-row { display: grid; grid-template-columns: 24px 1fr 1fr 1fr 28px; gap: 8px; align-items: center; margin-bottom: 6px; }
  .set-num { font-family: var(--mono); font-size: 10px; color: var(--muted2); text-align: center; }
  .set-input { background: #111114; border: 1px solid rgba(255,255,255,0.22); color: #f5f2eb; font-family: var(--mono); font-size: 14px; font-weight: 500; padding: 10px 8px; border-radius: 6px; width: 100%; outline: none; transition: border-color 0.15s, box-shadow 0.15s; text-align: center; }
  .set-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(201,168,76,0.2); }
  .set-input::placeholder { color: #6b6560; font-weight: 400; }
  .set-input.done { border-color: var(--accent); color: var(--accent); background: var(--accent-dim2); font-weight: 600; }
  .check-btn { width: 28px; height: 36px; background: none; border: 0.5px solid var(--border); border-radius: 4px; cursor: pointer; color: var(--muted2); font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .check-btn:hover { border-color: var(--accent); color: var(--accent); }
  .check-btn.checked { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .ex-note { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 10px; padding: 8px 10px; background: var(--bg3); border-radius: 4px; border-left: 2px solid var(--border2); line-height: 1.6; }
  .ex-note.warning { border-left-color: var(--legs); color: #b8845a; }

  /* HISTORY */
  .history-section { margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border); }
  .history-title { font-family: var(--mono); font-size: 9px; color: var(--muted2); margin-bottom: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
  .history-entry { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .history-date { font-family: var(--mono); font-size: 10px; color: var(--muted2); width: 60px; flex-shrink: 0; }
  .history-sets { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: 1; }
  .no-history { font-family: var(--mono); font-size: 10px; color: var(--muted2); }

  /* SUGGESTION BADGES */
  .sugg-badge { font-family: var(--mono); font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
  .sugg-up   { background: var(--accent-dim2); color: var(--accent3); border: 0.5px solid rgba(201,168,76,0.3); }
  .sugg-half { background: rgba(201,168,76,0.07); color: var(--accent); border: 0.5px solid rgba(201,168,76,0.2); }
  .sugg-same { background: rgba(255,255,255,0.03); color: var(--muted); border: 0.5px solid var(--border); }
  .history-exceeded { color: var(--accent) !important; }
  .sugg-detail { font-family: var(--mono); font-size: 10px; color: var(--muted2); margin-top: 6px; font-style: italic; }

  /* SWAP */
  .swap-btn { background: var(--bg4); border: 0.5px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 10px; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .swap-btn:hover { border-color: var(--accent); color: var(--accent); }
  .swap-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .swap-panel { display: none; margin-top: 10px; background: var(--bg3); border-radius: 6px; padding: 10px 12px; border: 0.5px solid var(--border2); }
  .swap-panel.open { display: block; }
  .swap-panel-title { font-family: var(--mono); font-size: 9px; color: var(--muted2); margin-bottom: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
  .swap-option { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 0.5px solid var(--border); }
  .swap-option:last-child { border-bottom: none; }
  .swap-option-name { font-size: 12px; color: var(--text); }
  .swap-option-btn { background: none; border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 3px 10px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .swap-option-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .swap-active-badge { font-family: var(--mono); font-size: 10px; color: var(--accent); background: var(--accent-dim); border: 0.5px solid rgba(201,168,76,0.25); padding: 2px 8px; border-radius: 3px; margin-left: 6px; }
  .swap-reset-btn { margin-top: 8px; width: 100%; background: none; border: 0.5px solid var(--border); color: var(--muted2); font-family: var(--mono); font-size: 10px; padding: 5px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .swap-reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* SET ADJUST */
  .set-adjust-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .set-adj-btn { background: var(--bg4); border: 0.5px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 10px; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .set-adj-plus  { border-color: rgba(201,168,76,0.3); color: var(--accent); background: var(--accent-dim); }
  .set-adj-plus:hover  { border-color: var(--accent); background: var(--accent-dim2); }
  .set-adj-minus { border-color: rgba(232,96,96,0.3); color: var(--red); background: rgba(232,96,96,0.06); }
  .set-adj-minus:hover { border-color: var(--red); background: rgba(232,96,96,0.12); }
  .set-adj-reset { border-color: var(--border2); color: var(--muted); }
  .set-adj-reset:hover { border-color: var(--muted); color: var(--text); }

  /* SAVE BAR */
  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 0.5px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100; }
  .save-status { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.03em; }
  .save-status.saved { color: var(--accent); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  .modal { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 10px; padding: 24px; width: 100%; max-width: 460px; max-height: 80vh; overflow-y: auto; }
  .modal h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; letter-spacing: -0.2px; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .history-full-entry { padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .history-full-entry:last-child { border-bottom: none; }
  .history-full-date { font-family: var(--mono); font-size: 10px; color: var(--accent); margin-bottom: 6px; letter-spacing: 0.04em; }
  .history-full-sets { font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.8; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-family: var(--mono); font-size: 11px; }

  /* MOBILE – iPhone 16 Pro optimiert */
  @media (max-width: 480px) {
    body { -webkit-tap-highlight-color: transparent; }

    .header { flex-direction: column; align-items: flex-start; padding: 52px 20px 16px; gap: 10px; }
    .header-left h1 { font-size: 30px; }
    .header-right { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; }
    .btn { padding: 10px 8px; font-size: 10px; text-align: center; border-radius: 6px; }
    .btn-accent { padding: 10px 14px; }

    .nav { padding: 0 20px; gap: 0; border-bottom: 0.5px solid var(--border); }
    .nav-btn { padding: 12px 14px; font-size: 12px; }

    .main { padding: 16px 20px 100px; }

    .session-meta { gap: 8px; margin-bottom: 16px; }
    .session-label { font-size: 10px; padding: 5px 10px; }
    .session-note { font-size: 10px; }

    .exercise-card { border-radius: 10px; margin-bottom: 8px; }
    .exercise-header { padding: 16px 16px; min-height: 60px; }
    .ex-name { font-size: 14px; }
    .ex-meta { font-size: 10px; margin-top: 3px; }
    .exercise-body { padding: 0 14px 16px; }

    .sets-header { grid-template-columns: 22px 1fr 1fr 1fr 38px; gap: 6px; }
    .set-row     { grid-template-columns: 22px 1fr 1fr 1fr 38px; gap: 6px; margin-bottom: 8px; }
    .set-input { font-size: 15px; padding: 11px 8px; border-radius: 6px; }
    .check-btn { width: 38px; height: 44px; border-radius: 6px; font-size: 15px; }

    .save-bar { padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); }
    .save-bar .btn-accent { padding: 12px 20px; font-size: 11px; }

    .sugg-badge { font-size: 9px; padding: 2px 7px; }

    .swap-btn { padding: 5px 10px; font-size: 10px; min-height: 32px; }
    .swap-option { padding: 10px 0; }
    .swap-option-name { font-size: 13px; }
    .swap-option-btn { padding: 6px 14px; min-height: 34px; font-size: 10px; }

    .set-adj-btn { padding: 8px 14px; min-height: 36px; font-size: 10px; }

    .modal { border-radius: 14px; padding: 20px; max-height: 85vh; }
    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal { border-bottom-left-radius: 0; border-bottom-right-radius: 0; max-height: 88vh; }

    .date-picker { font-size: 12px; padding: 6px 4px; }
  }

  /* TIMER */
  #timer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300; display: flex; align-items: flex-end; justify-content: center; padding: 0; backdrop-filter: blur(6px); }
  #timer-box { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 20px 20px 0 0; padding: 24px 24px calc(24px + env(safe-area-inset-bottom)); width: 100%; max-width: 420px; }
  #timer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  #timer-label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  #timer-header button { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 0; }
  #timer-ring-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 20px; }
  #timer-svg { width: 140px; height: 140px; transform: rotate(-90deg); }
  #timer-track { fill: none; stroke: var(--bg4); stroke-width: 6; }
  #timer-progress { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
  #timer-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 42px; font-weight: 700; color: var(--text); letter-spacing: -2px; }
  #timer-adjust { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  #timer-adjust button { background: var(--bg3); border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 11px; padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
  #timer-adjust button:hover { border-color: var(--accent); color: var(--accent); }
  #timer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #timer-pause-btn { background: var(--accent); color: #090909; border: none; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 13px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
  #timer-pause-btn:hover { background: var(--accent3); }
  #timer-skip-btn { background: var(--bg3); border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 12px; padding: 13px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
  #timer-skip-btn:hover { border-color: var(--muted); color: var(--text); }

  /* DAY PICKER PANEL */
  .day-picker-panel { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 8px; }
  .day-pick-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; border: none; background: none; cursor: pointer; transition: background 0.15s; width: 100%; text-align: left; }
  .day-pick-btn:hover { background: var(--bg3); }
  .day-pick-btn.active { background: var(--bg3); }
  .day-pick-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .day-pick-label { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--text); flex: 1; }
  .day-pick-type { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .day-pick-upper.active .day-pick-label { color: var(--upper); }
  .day-pick-push.active   .day-pick-label { color: var(--push); }
  .day-pick-pull.active   .day-pick-label { color: var(--pull); }
  .day-pick-legs.active   .day-pick-label { color: var(--legs); }
  .session-label { transition: opacity 0.15s; }
  .session-label:hover { opacity: 0.75; }

  /* CATALOG MODAL */
  .catalog-modal-inner { padding: 0; overflow: hidden; display: flex; flex-direction: column; max-height: 88vh; }
  .cat-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 20px 12px; border-bottom: 0.5px solid var(--border); }
  .cat-title { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; }
  .cat-subtitle { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 3px; }
  .cat-reset-btn { margin: 10px 20px 0; background: none; border: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 8px 14px; border-radius: 4px; cursor: pointer; transition: all 0.15s; width: calc(100% - 40px); text-align: left; }
  .cat-reset-btn:hover { border-color: var(--red); color: var(--red); }
  .cat-tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 12px 16px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 8px; transition: background 0.15s; min-width: 56px; }
  .cat-tab.active { background: var(--accent-dim); }
  .cat-tab:hover { background: var(--bg4); }
  .cat-svg { width: 36px; height: 36px; display: block; }
  .cat-svg svg { width: 100%; height: 100%; }
  .cat-label { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .cat-tab.active .cat-label { color: var(--accent); }
  .cat-ex-list { overflow-y: auto; flex: 1; padding: 8px 0; }

function getKey(dayId, date) { return `gymbook:${dayId}:${date}`; }
function todayStr() { return new Date().toISOString().slice(0,10); }
function activeDateStr() { return activeDate || todayStr(); }

function formatDate(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function setActiveDate(val) {
  activeDate = val || null;
  loadSessionData();
  renderDay();
}

function weekdayFromDate(iso) {
  const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const [y,m,d] = iso.split('-').map(Number);
  return days[new Date(y, m-1, d).getDay()];
}

// ── JSONBin Storage ──────────────────────────────────────────
const JSONBIN_KEY = '$2a$10$VCqYDBoWnSoJIPwURownZ.CIQBrg2EjsTlU0D9HCpRcV1ww22TT/a';
const JSONBIN_API = 'https://api.jsonbin.io/v3/b';
const FIXED_BIN_ID = '6a1d9bd121f9ee59d2a5bc77';
let binId = FIXED_BIN_ID;
let cloudData = {};
let cloudLoaded = false;

async function cloudInit() {
  setStatus('☁ Verbinde…', false);
  await cloudPull();
}

async function cloudCreate() {
  try {
    const res = await fetch(JSONBIN_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY, 'X-Bin-Name': 'gymbook', 'X-Bin-Private': 'true' },
      body: JSON.stringify({ gymbook: {} })
    });
    if (!res.ok) { setStatus(`⚠ Cloud-Fehler (${res.status})`, false); return; }
    const data = await res.json();
    binId = data.metadata?.id;
    if (binId) {
      localStorage.setItem('gymbook:binId', binId);
      cloudData = {};
      cloudLoaded = true;
      setStatus('☁ Bereit', true);
    } else {
      setStatus('⚠ Cloud-Fehler (kein Bin)', false);
    }
  } catch(e) {
    setStatus(`⚠ Offline (${e.message})`, false);
  }
}

async function cloudPull() {
  try {
    const res = await fetch(`${JSONBIN_API}/${binId}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (!res.ok) { setStatus(`⚠ Cloud-Fehler (${res.status})`, false); return; }
    const data = await res.json();
    cloudData = data.record?.gymbook || {};
    cloudLoaded = true;
    setStatus('☁ Synchronisiert', true);
    // Re-render with cloud data
    renderNav();
    renderDay();
  } catch(e) {
    cloudLoaded = false;
    setStatus(`⚠ Offline (${e.message})`, false);
  }
}

async function cloudPush() {
  if (!binId) return;
  try {
    await fetch(`${JSONBIN_API}/${binId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify({ gymbook: cloudData })
    });
  } catch(e) {
    console.warn('Cloud push failed, saved locally only');
  }
}

function storageSet(key, val) {
  cloudData[key] = val;
  localStorage.setItem(key, JSON.stringify(val)); // local mirror
  cloudPush();
}

function storageGet(key) {
  if (cloudLoaded && cloudData[key] !== undefined) return cloudData[key];
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}

function storageGetAllKeys() {
  if (cloudLoaded) return Object.keys(cloudData).filter(k => k.startsWith('gymbook:') && k !== 'gymbook:binId');
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('gymbook:') && k !== 'gymbook:binId') keys.push(k);
  }
  return keys;
}

function setStatus(msg, ok) {
  const trySet = () => {
    const el = document.getElementById('save-status');
    if (el) { el.textContent = msg; el.className = ok ? 'save-status saved' : 'save-status'; }
    else { setTimeout(trySet, 100); }
  };
  trySet();
}
// ─────────────────────────────────────────────────────────────

function loadSessionData() {
  const day = DAYS[currentDay];
  const date = activeDateStr();
  const existing = storageGet(getKey(day.id, date));
  sessionData = {};
  swappedExercises = {};
  if (existing) {
    if (existing.sets) {
      sessionData = existing.sets;
      swappedExercises = existing.swapped || {};
    } else {
      sessionData = existing;
    }
  } else {
    day.exercises.forEach((ex, ei) => {
      sessionData[ei] = { sets: [] };
      for (let s = 0; s < ex.sets; s++) {
        sessionData[ei].sets.push({ weight: '', reps: '', done: false });
      }
    });
  }
}

function saveSession() {
  const day = DAYS[currentDay];
  const date = activeDateStr();
  collectInputValues();
  storageSet(getKey(day.id, date), { sets: sessionData, swapped: swappedExercises });
  dirty = false;
  const el = document.getElementById('save-status');
  const isBack = date !== todayStr();
  el.textContent = `Gespeichert — ${formatDate(date)}${isBack ? ' (nachgetragen)' : ''}`;
  el.className = 'save-status saved';
  setTimeout(() => { el.textContent = 'Alle Änderungen gespeichert'; }, 2500);
}

function collectInputValues() {
  const day = DAYS[currentDay];
  day.exercises.forEach((ex, ei) => {
    const activeSets = (sessionData[ei] && sessionData[ei].activeSets != null)
      ? sessionData[ei].activeSets : ex.sets;
    for (let s = 0; s < activeSets; s++) {
      const wEl = document.getElementById(`w-${ei}-${s}`);
      const rEl = document.getElementById(`r-${ei}-${s}`);
      if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
      if (wEl) sessionData[ei].sets[s].weight = wEl.value;
      if (rEl) sessionData[ei].sets[s].reps = rEl.value;
    }
  });
}

function getHistory(dayId) {
  const keys = storageGetAllKeys().filter(k => k.startsWith(`gymbook:${dayId}:`));
  return keys.map(k => {
    const date = k.split(':')[2];
    const raw = storageGet(k);
    const data = raw?.sets || raw;
    return { date, data };
  }).sort((a,b) => b.date.localeCompare(a.date));
}

function getLastEntryByName(dayId, exerciseName) {
  const date = activeDateStr();
  const keys = storageGetAllKeys()
    .filter(k => k.startsWith(`gymbook:${dayId}:`) && !k.endsWith(date))
    .sort().reverse();

  for (const k of keys) {
    const raw = storageGet(k);
    if (!raw) continue;
    const sets = raw.sets || raw;
    const swapped = raw.swapped || {};
    const day = DAYS.find(d => d.id === dayId);
    if (!day) continue;

    // Find which slot had this exercise name (original or swapped)
    for (let ei = 0; ei < day.exercises.length; ei++) {
      const slotName = swapped[ei] || day.exercises[ei].name;
      if (slotName === exerciseName && sets[ei]?.sets?.length) {
        return sets[ei].sets;
      }
    }
  }
  return null;
}

function getLastEntry(dayId, exIndex) {
  // Legacy fallback by index
  const date = activeDateStr();
  const keys = storageGetAllKeys()
    .filter(k => k.startsWith(`gymbook:${dayId}:`) && !k.endsWith(date))
    .sort().reverse();
  if (!keys.length) return null;
  const raw = storageGet(keys[0]);
  if (!raw) return null;
  const sets = raw.sets || raw;
  if (!sets[exIndex]) return null;
  return sets[exIndex].sets;
}

function adjustSets(ei, delta) {
  const ex = DAYS[currentDay].exercises[ei];
  if (!sessionData[ei]) sessionData[ei] = { sets: [], activeSets: ex.sets };
  const current = sessionData[ei].activeSets != null ? sessionData[ei].activeSets : ex.sets;
  let next;
  if (delta === 0) {
    next = ex.sets; // reset to plan
  } else {
    next = Math.max(1, Math.min(current + delta, 8));
  }
  sessionData[ei].activeSets = next;
  // Pad sets array if needed
  while (sessionData[ei].sets.length < next) {
    sessionData[ei].sets.push({ weight: '', reps: '', done: false });
  }
  autoSave();
  renderDay();
  // Re-open the exercise card
  setTimeout(() => {
    const body = document.getElementById(`exbody-${ei}`);
    const chev = document.getElementById(`chev-${ei}`);
    if (body) { body.classList.add('open'); }
    if (chev) { chev.classList.add('open'); }
  }, 10);
}

let catalogTargetEi = null;
let catalogActiveMuscle = 'brust';

function openCatalog(ei) {
  catalogTargetEi = ei;
  catalogActiveMuscle = 'brust';
  renderCatalog();
  document.getElementById('catalog-modal').style.display = 'flex';
}

function closeCatalog() {
  document.getElementById('catalog-modal').style.display = 'none';
}

function renderCatalog() {
  const ei = catalogTargetEi;
  const ex = DAYS[currentDay].exercises[ei];
  const swappedName = swappedExercises[ei] || null;

  const tabs = Object.entries(CATALOG).map(([key, cat]) => `
    <button class="cat-tab ${catalogActiveMuscle === key ? 'active' : ''}" onclick="setCatalogMuscle('${key}')">
      <span class="cat-svg" style="color:${catalogActiveMuscle === key ? 'var(--accent)' : 'var(--muted2)'}">${cat.svg}</span>
      <span class="cat-label">${cat.label}</span>
    </button>
  `).join('');

  const exercises = CATALOG[catalogActiveMuscle].exercises.map(name => {
    const isActive = swappedName === name;
    const isOriginal = ex.name === name;
    return `
      <div class="cat-ex-row ${isActive ? 'cat-ex-active' : ''}" onclick="applySwap(${ei}, '${name.replace(/'/g, "\\'")}')">
        <span class="cat-ex-name">${name}${isOriginal ? ' <span class="cat-original-badge">Original</span>' : ''}${isActive ? ' <span class="cat-active-badge">Aktiv</span>' : ''}</span>
        <span class="cat-ex-arrow">${isActive ? '✓' : '→'}</span>
      </div>
    `;
  }).join('');

  document.getElementById('catalog-inner').innerHTML = `
    <div class="cat-header">
      <div>
        <div class="cat-title">Übung tauschen</div>
        <div class="cat-subtitle">${ex.name}</div>
      </div>
      <button class="modal-close" onclick="closeCatalog()">×</button>
    </div>
    ${swappedName ? `<button class="cat-reset-btn" onclick="resetSwap(${ei});closeCatalog()">↺ Zurück zu: ${ex.name}</button>` : ''}
    <div class="cat-tabs">${tabs}</div>
    <div class="cat-ex-list">${exercises}</div>
  `;
}

function setCatalogMuscle(key) {
  catalogActiveMuscle = key;
  renderCatalog();
}

function applySwap(ei, altName) {
  swappedExercises[ei] = altName;
  autoSave();
  closeCatalog();
  renderDay();
  setTimeout(() => {
    const body = document.getElementById(`exbody-${ei}`);
    const chev = document.getElementById(`chev-${ei}`);
    if (body) body.classList.add('open');
    if (chev) chev.classList.add('open');

}

function resetSwap(ei) {
  delete swappedExercises[ei];
  autoSave();
  renderDay();
  setTimeout(() => {
    const body = document.getElementById(`exbody-${ei}`);
    const chev = document.getElementById(`chev-${ei}`);
    if (body) body.classList.add('open');
    if (chev) chev.classList.add('open');
  }, 10);
}

function renderDay() {

      </div>
      <span class="session-note">${day.duration}</span>
    </div>

  day.exercises.forEach((ex, ei) => {

    const displayName = swappedName || ex.name;
    const lastEntry = getLastEntryByName(day.id, displayName) || getLastEntry(day.id, ei);
    const suggestion = calcWeightSuggestion(lastEntry, ex.reps);

      } else if (suggestion.reason === 'some') {

      } else {

      }

      <div class="swap-panel" id="swap-panel-${ei}" style="display:none"></div>
    `;

    html += `
      <div class="exercise-card">
        <div class="exercise-header" onclick="toggleEx(${ei})">

            <div class="ex-meta">${ex.muscle} · ${ex.sets}×${ex.reps} · Pause ${ex.pause}</div>
          </div>
          ${suggLabel}
          ${anyDone ? '<span style="color:var(--accent);font-size:11px;font-family:var(--mono);margin-left:6px">✓</span>' : ''}
          <span class="ex-chevron" id="chev-${ei}">▶</span>
        </div>
        <div class="exercise-body" id="exbody-${ei}">
          <div style="display:flex;justify-content:flex-end;margin-bottom:8px;gap:6px">
            <button class="swap-btn ${swappedName ? 'active' : ''}" onclick="event.stopPropagation();openCatalog(${ei})">⇄ Übung tauschen</button>
            ${swappedName ? `<button class="swap-btn" style="color:var(--red);border-color:var(--red)" onclick="event.stopPropagation();resetSwap(${ei})">↺ Zurücksetzen</button>` : ''}
          </div>
          ${swapPanelHtml}
          <div class="sets-header">
            <span>Satz</span><span>Gewicht (kg)</span><span>Wdh.</span><span>Ziel</span><span></span>
          </div>
    `;

    // Determine active set count (plan default or user-adjusted)
    const activeSets = (sessionData[ei] && sessionData[ei].activeSets != null)
      ? sessionData[ei].activeSets
      : ex.sets;

    // Ensure sessionData has enough set slots
    if (!sessionData[ei]) sessionData[ei] = { sets: [], activeSets: ex.sets };
    while (sessionData[ei].sets.length < activeSets) {
      sessionData[ei].sets.push({ weight: '', reps: '', done: false });
    }

    for (let s = 0; s < activeSets; s++) {
      const setData = sessionData[ei].sets[s] || { weight: '', reps: '', done: false };
      const suggWeight = suggestion ? suggestion.weight : '';
      const placeholder = setData.weight ? '' : (suggWeight ? `${suggWeight}` : (lastEntry ? lastEntry[s]?.weight || '—' : '—'));
      html += `
        <div class="set-row" id="set-row-${ei}-${s}">
          <span class="set-num">${s+1}</span>
          <input class="set-input ${setData.done?'done':''}" id="w-${ei}-${s}" type="number" step="0.5" min="0" placeholder="${placeholder}" value="${setData.weight}" oninput="markDirty()" onchange="autoSave()">
          <input class="set-input ${setData.done?'done':''}" id="r-${ei}-${s}" type="number" min="0" placeholder="${ex.reps.split(/[–\-]/)[0]}" value="${setData.reps}" oninput="markDirty()" onchange="autoSave()">
          <span class="set-input" style="cursor:default;color:var(--muted2);font-size:11px">${ex.reps}</span>

    }

    // + / - set buttons
    html += `
      <div class="set-adjust-row">
        ${activeSets > 1 ? `<button class="set-adj-btn set-adj-minus" onclick="adjustSets(${ei}, -1)">− Satz entfernen</button>` : ''}
        <button class="set-adj-btn set-adj-plus" onclick="adjustSets(${ei}, 1)">+ Satz hinzufügen</button>
        ${activeSets !== ex.sets ? `<button class="set-adj-btn set-adj-reset" onclick="adjustSets(${ei}, 0)">↺ ${ex.sets} Sätze (Plan)</button>` : ''}
      </div>
    `;

    if (ex.note) {
      html += `<div class="ex-note ${ex.warn?'warning':''}">${ex.note}</div>`;

    // Last session + suggestion detail
    if (lastEntry) {
      const filledSets = lastEntry.filter(s => s.weight);
      if (filledSets.length) {
        html += `
          <div class="history-section">
            <div class="history-title">LETZTE EINHEIT</div>
            ${lastEntry.map((s,i) => {
              if (!s.weight) return '';
              const { high } = parseRepRange(ex.reps);
              const exceeded = s.reps && parseInt(s.reps) > high;
              return `<div class="history-entry">
                <span class="history-date">Satz ${i+1}</span>
                <span class="history-sets ${exceeded ? 'history-exceeded' : ''}">${s.weight} kg × ${s.reps || '—'} Wdh.${exceeded ? ' ↑' : ''}</span>
              </div>`;
            }).join('')}
            ${suggestion && suggestion.reason !== 'same' ? `<div class="sugg-detail">Vorschlag basiert auf übertroffenem Ziel (>${parseRepRange(ex.reps).high} Wdh.)</div>` : ''}
          </div>
        `;
      }
    }

    html += `</div></div>`;
  });

  document.getElementById('main-content').innerHTML = html;
  document.getElementById('main-content').style.paddingBottom = '80px';

  const status = document.getElementById('save-status');
  const saved = storageGet(getKey(day.id, date));
  status.textContent = saved ? `Gespeichert — ${formatDate(date)}` : 'Nicht gespeichert';
  status.className = saved ? 'save-status saved' : 'save-status';
}

function getLastEntry(dayId, exIndex) {
  const date = activeDateStr();
  const keys = storageGetAllKeys()
    .filter(k => k.startsWith(`gymbook:${dayId}:`) && !k.endsWith(date))
    .sort().reverse();
  if (!keys.length) return null;
  const data = storageGet(keys[0]);
  if (!data) return null;
  const sets = data.sets || data;
  if (!sets[exIndex]) return null;
  return sets[exIndex].sets;
}

function parseRepRange(repsStr) {
  const parts = repsStr.split(/[–\-]/);
  if (parts.length === 2) return { low: parseInt(parts[0]), high: parseInt(parts[1]) };
  const single = parseInt(repsStr);
  return { low: single, high: single };
}

function calcWeightSuggestion(lastSets, repsTarget) {
  if (!lastSets || !lastSets.length) return null;
  const { high } = parseRepRange(repsTarget);
  const logged = lastSets.filter(s => s.weight && s.reps);
  if (!logged.length) return null;
  const allExceeded = logged.every(s => parseInt(s.reps) > high);
  const anyExceeded = logged.some(s => parseInt(s.reps) > high);
  const baseWeight = parseFloat(logged[logged.length - 1].weight);
  if (isNaN(baseWeight) || baseWeight <= 0) return null;
  if (allExceeded) return { weight: baseWeight + 2.5, reason: 'all', prevWeight: baseWeight };
  if (anyExceeded) return { weight: baseWeight + 1.25, reason: 'some', prevWeight: baseWeight };
  return { weight: baseWeight, reason: 'same', prevWeight: baseWeight };
}

// ── TIMER ─────────────────────────────────────────────────────
let timerInterval = null;
let timerTotal = 0;
let timerStartTime = null;   // timestamp when timer started
let timerPaused = false;
let timerPausedAt = null;    // remaining seconds when paused
let timerExerciseName = '';
let notificationTimeout = null;
const CIRCUMFERENCE = 2 * Math.PI * 52;

function parsePause(pauseStr) {
  if (!pauseStr) return 120;
  const rangeMatch = pauseStr.match(/(\d+)[–\-](\d+)/);
  if (rangeMatch) return parseInt(rangeMatch[2]);
  const colonMatch = pauseStr.match(/(\d+):(\d+)/);
  if (colonMatch) return parseInt(colonMatch[1]) * 60 + parseInt(colonMatch[2]);
  const secMatch = pauseStr.match(/(\d+)/);
  if (secMatch) return parseInt(secMatch[1]);
  return 120;
}

async function requestNotificationPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const result = await Notification.requestPermission();
  return result === 'granted';
}

function scheduleNotification(seconds, exerciseName) {
  clearTimeout(notificationTimeout);
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  notificationTimeout = setTimeout(() => {
    try {
      new Notification('GymBook – Pause vorbei! 💪', {
        body: `Nächster Satz: ${exerciseName}`,
        icon: 'https://tischy85.github.io/gymbook/icon.png',
        vibrate: [200, 100, 200]
      });
    } catch(e) {}
  }, seconds * 1000);
}

function getRemainingSeconds() {
  if (!timerStartTime) return 0;
  if (timerPaused) return timerPausedAt;
  const elapsed = (Date.now() - timerStartTime) / 1000;
  return Math.max(0, timerTotal - elapsed);
}

async function startTimer(seconds, exerciseName) {
  clearInterval(timerInterval);
  clearTimeout(notificationTimeout);
  timerTotal = seconds;
  timerStartTime = Date.now();
  timerPaused = false;
  timerPausedAt = null;
  timerExerciseName = exerciseName;

  // Request notification permission on first use
  await requestNotificationPermission();
  scheduleNotification(seconds, exerciseName);

  document.getElementById('timer-label').textContent = `Pause · ${exerciseName}`;
  document.getElementById('timer-pause-btn').textContent = 'Pause';
  document.getElementById('timer-overlay').style.display = 'flex';
  document.getElementById('timer-progress').style.stroke = 'var(--accent)';

  updateTimerDisplay();
  timerInterval = setInterval(timerTick, 250); // faster tick for smooth display
}

function timerTick() {
  if (timerPaused) return;
  const remaining = getRemainingSeconds();
  if (remaining <= 0) {
    clearInterval(timerInterval);
    timerStartTime = null;
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    document.getElementById('timer-progress').style.stroke = 'var(--pull)';
    document.getElementById('timer-pause-btn').textContent = 'Fertig';
    document.getElementById('timer-time').textContent = '0:00';
    document.getElementById('timer-progress').style.strokeDashoffset = CIRCUMFERENCE;
  } else {
    updateTimerDisplay();
  }
}

function updateTimerDisplay() {
  const remaining = getRemainingSeconds();
  const m = Math.floor(remaining / 60);
  const s = Math.floor(remaining % 60);
  document.getElementById('timer-time').textContent = `${m}:${String(s).padStart(2,'0')}`;
  const progress = timerTotal > 0 ? remaining / timerTotal : 0;
  const offset = CIRCUMFERENCE * (1 - progress);
  document.getElementById('timer-progress').style.strokeDashoffset = offset;
  document.getElementById('timer-progress').style.strokeDasharray = CIRCUMFERENCE;
  if (remaining > 0 && remaining <= 10) {
    document.getElementById('timer-progress').style.stroke = 'var(--push)';
  } else if (remaining > 0) {
    document.getElementById('timer-progress').style.stroke = 'var(--accent)';
  }
}

function toggleTimerPause() {
  const remaining = getRemainingSeconds();
  if (remaining <= 0) { closeTimer(); return; }
  timerPaused = !timerPaused;
  if (timerPaused) {
    timerPausedAt = remaining;
    clearTimeout(notificationTimeout);
    document.getElementById('timer-pause-btn').textContent = 'Weiter';
  } else {
    // Recalculate start time based on remaining
    timerStartTime = Date.now() - ((timerTotal - timerPausedAt) * 1000);
    timerPausedAt = null;
    scheduleNotification(remaining, timerExerciseName);
    document.getElementById('timer-pause-btn').textContent = 'Pause';
  }
}

function adjustTimer(delta) {
  if (timerPaused) {
    timerPausedAt = Math.max(0, timerPausedAt + delta);
    timerTotal = Math.max(timerTotal, timerPausedAt);
  } else {
    // Shift start time to simulate more/less time
    timerStartTime -= delta * 1000;
    const remaining = getRemainingSeconds();
    timerTotal = Math.max(timerTotal, remaining);
    clearTimeout(notificationTimeout);
    scheduleNotification(remaining, timerExerciseName);
  }
  updateTimerDisplay();
}

function closeTimer() {
  clearInterval(timerInterval);
  clearTimeout(notificationTimeout);
  timerStartTime = null;
  timerPaused = false;
  document.getElementById('timer-overlay').style.display = 'none';
  document.getElementById('timer-progress').style.stroke = 'var(--accent)';
}

// Resume timer if app comes back from background
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && timerStartTime && !timerPaused) {
    const remaining = getRemainingSeconds();
    if (remaining <= 0) {
      timerTick(); // trigger finish
    } else {
      updateTimerDisplay();
      clearInterval(timerInterval);
      timerInterval = setInterval(timerTick, 250);
    }
  }
});

function toggleDone(ei, s) {
  collectInputValues();
  if (!sessionData[ei]) sessionData[ei] = { sets: [] };
  if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
  sessionData[ei].sets[s].done = !sessionData[ei].sets[s].done;
  const btn = document.getElementById(`chk-${ei}-${s}`);
  const w = document.getElementById(`w-${ei}-${s}`);
  const r = document.getElementById(`r-${ei}-${s}`);
  const done = sessionData[ei].sets[s].done;
  btn.classList.toggle('checked', done);
  if(w) w.classList.toggle('done', done);
  if(r) r.classList.toggle('done', done);
  autoSave();
  // Start pause timer when set is checked
  if (done) {
    const ex = DAYS[currentDay].exercises[ei];
    const swappedName = swappedExercises[ei] || null;
    const displayName = swappedName || ex.name;
    const seconds = parsePause(ex.pause);
    startTimer(seconds, displayName);
  } else {
    closeTimer();
  }
}

function exportData() {
  const allData = {};
  storageGetAllKeys().forEach(k => {
    allData[k] = storageGet(k);
  });
  if (!Object.keys(allData).length) {
    alert('Noch keine Daten zum Exportieren vorhanden.');
    return;
  }
  const json = JSON.stringify({ version: 1, exported: todayStr(), data: allData }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gymbook-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  const el = document.getElementById('save-status');
  el.textContent = `Export gespeichert — ${formatDate(todayStr())}`;
  el.className = 'save-status saved';
  setTimeout(() => { el.textContent = 'Alle Änderungen gespeichert'; }, 3000);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      const incoming = parsed.data || parsed; // support both formats
      const keys = Object.keys(incoming).filter(k => k.startsWith('gymbook:'));
      if (!keys.length) { alert('Keine gültigen GymBook-Daten in der Datei gefunden.'); return; }

      const existingKeys = storageGetAllKeys();
      let skipped = 0;
      let imported = 0;

      keys.forEach(k => {
        if (existingKeys.includes(k)) {
          skipped++;
        } else {
          storageSet(k, incoming[k]);
          imported++;
        }
      });

      const msg = skipped > 0
        ? `${imported} Einträge importiert, ${skipped} bereits vorhanden (nicht überschrieben).`
        : `${imported} Einträge erfolgreich importiert.`;

      // Show result in modal
      document.getElementById('modal-content').innerHTML = `
        <button class="modal-close" onclick="closeModal()">×</button>
        <h2>Import abgeschlossen</h2>
        <div style="margin-top:16px;font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.8">${msg}</div>
        ${skipped > 0 ? `<div style="margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--muted2)">Vorhandene Einträge werden nie überschrieben, um Datenverlust zu vermeiden.</div>` : ''}
        <button class="btn btn-accent" style="margin-top:20px;width:100%" onclick="closeModal();renderDay()">OK</button>
      `;
      document.getElementById('modal').style.display = 'flex';
      event.target.value = '';
    } catch(err) {
      alert('Fehler beim Lesen der Datei. Bitte eine gültige GymBook JSON-Datei auswählen.');
    }
  };
  reader.readAsText(file);
}



function showDayPicker() {
  const panel = document.getElementById('day-picker-panel');
  if (panel) panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
}
function hideDayPicker() {
  const panel = document.getElementById('day-picker-panel');
  if (panel) panel.style.display = 'none';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

// Init
renderNav();
renderDay();
cloudInit();
</script>
</body>
</html>
