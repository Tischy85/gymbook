// ── STATISTIKEN ───────────────────────────────────────────────
let statsSearchTerm = '';

function renderStats() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const dayNames = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const dayColors = { upper: '#9b7fe8', push: '#e87f7f', pull: '#7fb8e8', legs: '#e8a87f' };

  // All completed keys for stats
  const allKeys = storageGetAllKeys().filter(k => {
    const p = k.split(':');
    return p.length === 3 && !['customplan','customcatalog','pausesettings'].includes(p[1]) && !p[1].startsWith('note') && !p[1].startsWith('binId');
  });
  const completedKeys = allKeys.filter(k => storageGet(k)?.completed === true);

  // Session dates map
  const sessionDates = {};
  allKeys.forEach(k => {
    const parts = k.split(':');
    const date = parts[2]; const dayId = parts[1];
    if (!sessionDates[date]) sessionDates[date] = [];
    sessionDates[date].push(dayId);
  });

  // Calendar
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr();
    const sessions = sessionDates[dateStr] || [];
    const isPast = new Date(dateStr) < new Date(todayStr());
    const dots = sessions.map(id => `<div style="width:5px;height:5px;border-radius:50%;background:${dayColors[id]||'var(--accent)'}"></div>`).join('');
    cells += `<div class="cal-cell ${isToday?'today':''} ${sessions.length?'has-session':''} ${isPast&&!sessions.length?'past-empty':''}" onclick="showDayDetail('${dateStr}')">
      <span class="cal-day">${d}</span>
      ${dots ? `<div style="display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:2px">${dots}</div>` : ''}
    </div>`;
  }

  // Progress stats
  const weightHistory = {};
  const volumeHistory = {};
  completedKeys.sort().forEach(k => {
    const raw = storageGet(k);
    if (!raw) return;
    const sets = raw.sets || raw;
    const swapped = raw.swapped || {};
    const dayId = k.split(':')[1];
    const date = k.split(':')[2];
    const day = DAYS.find(d => d.id === dayId);
    if (!day) return;
    let dayVolume = 0;
    day.exercises.forEach((ex, ei) => {
      const name = swapped[ei] || ex.name;
      const exSets = sets[ei]?.sets || [];
      const maxW = Math.max(...exSets.map(s => parseFloat(s.weight) || 0));
      if (maxW > 0) { if (!weightHistory[name]) weightHistory[name] = []; weightHistory[name].push({ weight: maxW }); }
      exSets.forEach(s => { const w = parseFloat(s.weight)||0; const r = parseInt(s.reps)||0; if(w>0&&r>0) dayVolume+=w*r; });
    });
    if (dayVolume > 0) volumeHistory[date] = (volumeHistory[date]||0) + dayVolume;
  });

  const bestLifts = {};
  Object.entries(weightHistory).forEach(([name, entries]) => { bestLifts[name] = Math.max(...entries.map(e => e.weight)); });

  const progressExercises = Object.entries(weightHistory)
    .filter(([,e]) => e.length >= 2)
    .map(([name, entries]) => ({ name, diff: entries[entries.length-1].weight - entries[0].weight, last6: entries.slice(-6), first: entries[0].weight, last: entries[entries.length-1].weight }))
    .sort((a,b) => b.diff - a.diff).slice(0,5);

  const volumeEntries = Object.entries(volumeHistory).sort().slice(-8);
  const maxVolume = Math.max(...volumeEntries.map(([,v]) => v), 1);

  // Streak
  const sessionDateList = [...new Set(completedKeys.map(k => k.split(':')[2]))].sort().reverse();
  let streak = 0;
  let checkDate = new Date(now); checkDate.setHours(0,0,0,0);
  for (const date of sessionDateList) {
    const d = new Date(date); const diff = Math.round((checkDate-d)/86400000);
    if (diff <= 7) { streak++; checkDate = d; } else break;
  }

  // History with search
  const term = statsSearchTerm.toLowerCase().trim();
  let historyHtml = '';
  DAYS.forEach(day => {
    const dayKeys = completedKeys.filter(k => k.split(':')[1] === day.id).sort().reverse().slice(0,10);
    if (!dayKeys.length) return;
    const filtered = dayKeys.filter(k => {
      if (!term) return true;
      const raw = storageGet(k);
      const sets = raw?.sets || raw || {};
      const swapped = raw?.swapped || {};
      return day.exercises.some((ex, ei) => (swapped[ei]||ex.name).toLowerCase().includes(term));
    });
    if (!filtered.length) return;
    historyHtml += `<div style="margin-bottom:14px"><div style="font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">${day.type}</div>`;
    filtered.forEach(k => {
      const date = k.split(':')[2];
      const raw = storageGet(k);
      const sets = raw?.sets || raw || {};
      const swapped = raw?.swapped || {};
      const noteKey = `gymbook:note:${day.id}:${date}`;
      const note = storageGet(noteKey) || '';
      historyHtml += `<div class="history-full-entry"><div class="history-full-date">${formatDate(date)}</div><div class="history-full-sets">`;
      day.exercises.forEach((ex, ei) => {
        const name = swapped[ei] || ex.name;
        if (term && !name.toLowerCase().includes(term)) return;
        const skip = sets[ei]?.skipped;
        if (skip) { historyHtml += `<span style="color:var(--red)">✕ ${name}</span>: ${skip.reason}<br>`; return; }
        const exSets = sets[ei]?.sets || [];
        const filled = exSets.filter(s => s.weight);
        if (filled.length) historyHtml += `<span style="color:var(--text)">${name}</span>: ${filled.map(s=>`${s.weight}kg×${s.reps||'?'}`).join(', ')}<br>`;
      });
      if (note) historyHtml += `<div style="margin-top:6px;padding:6px 8px;background:var(--bg3);border-radius:4px;border-left:2px solid var(--accent);font-size:10px;color:var(--muted);font-style:italic">${note}</div>`;
      historyHtml += `</div></div>`;
    });
    historyHtml += `</div>`;
  });

  // Body weight for stats
  const bwKeys = storageGetAllKeys().filter(k => k.startsWith('gymbook:bodyweight:')).sort();
  const bwHistory = bwKeys.slice(-12).map(k => ({
    date: k.split(':')[2],
    weight: parseFloat(storageGet(k))
  })).filter(e => !isNaN(e.weight));

  document.getElementById('stats-content').innerHTML = `
    <!-- KÖRPERGEWICHT -->
    ${bwHistory.length > 0 ? (() => {
      const weights = bwHistory.map(e => e.weight);
      const minW = Math.min(...weights) - 0.5;
      const maxW = Math.max(...weights) + 0.5;
      const range = maxW - minW || 1;
      const W = 280, H = 56;
      const pts = bwHistory.map((e, i) => {
        const x = bwHistory.length > 1 ? (i / (bwHistory.length - 1)) * W : W/2;
        const y = H - ((e.weight - minW) / range) * H;
        return `${x},${y}`;
      }).join(' ');
      const trend = weights.length > 1 ? weights[weights.length-1] - weights[0] : 0;
      const trendColor = trend < 0 ? '#22c55e' : trend > 0 ? '#e87f7f' : 'var(--muted)';
      return `<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em">Körpergewicht</div>
          <button onclick="showBWInput()" style="background:var(--bg3);border:0.5px solid var(--border2);color:var(--accent);font-family:var(--mono);font-size:12px;padding:4px 12px;border-radius:6px;cursor:pointer">+ Eintrag</button>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
          <span style="font-family:var(--display,serif);font-size:28px;font-weight:700;color:var(--accent)">${weights[weights.length-1].toFixed(1)} kg</span>
          ${trend !== 0 ? `<span style="font-family:var(--mono);font-size:11px;color:${trendColor}">${trend > 0 ? '+' : ''}${trend.toFixed(1)} kg</span>` : ''}
        </div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:56px;overflow:visible">
          <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          ${bwHistory.map((e, i) => { const x=bwHistory.length>1?(i/(bwHistory.length-1))*W:W/2; const y=H-((e.weight-minW)/range)*H; return `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`; }).join('')}
        </svg>
        <div style="display:flex;justify-content:space-between;margin-top:4px">
          <span style="font-family:var(--mono);font-size:9px;color:var(--muted2)">${formatDate(bwHistory[0].date)}</span>
          <span style="font-family:var(--mono);font-size:9px;color:var(--muted2)">${formatDate(bwHistory[bwHistory.length-1].date)}</span>
        </div>
      </div>`;
    })() : `<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted)">Noch kein Körpergewicht eingetragen</div>
      <button onclick="showBWInput()" style="background:var(--bg3);border:0.5px solid var(--border2);color:var(--accent);font-family:var(--mono);font-size:12px;padding:4px 12px;border-radius:6px;cursor:pointer">+ Eintrag</button>
    </div>`}

    <!-- KALENDER -->
    <div style="margin-bottom:20px">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">${monthNames[month]} ${year} · ${completedKeys.length} Einheiten gesamt</div>
      <div class="cal-legend" style="margin-bottom:10px">
        ${Object.entries(dayColors).map(([id,color]) => { const d=DAYS.find(x=>x.id===id); return `<div style="display:flex;align-items:center;gap:4px"><div style="width:7px;height:7px;border-radius:50%;background:${color}"></div><span style="font-family:var(--mono);font-size:9px;color:var(--muted)">${d?.type||id}</span></div>`; }).join('')}
      </div>
      <div class="cal-header-row">${dayNames.map(d=>`<div class="cal-header-cell">${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>

    <!-- STATS KACHELN -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
      <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:12px;text-align:center">
        <div style="font-family:var(--display,serif);font-size:24px;font-weight:700;color:var(--accent)">${completedKeys.length}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.06em">Einheiten</div>
      </div>

        ${DAYS.map(d => `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <span style="font-family:var(--mono);font-size:10px;color:var(--muted);width:80px;flex-shrink:0">${d.type}</span>
            <div style="flex:1;background:var(--bg3);border-radius:4px;height:5px;overflow:hidden">
              <div style="height:100%;background:${dayColors[d.id]||'var(--accent)'};border-radius:4px;width:${Math.round((sessionsByDay[d.id]/maxD)*100)}%"></div>
            </div>
            <span style="font-family:var(--mono);font-size:11px;color:var(--text);width:16px;text-align:right">${sessionsByDay[d.id]}</span>
          </div>
        `).join('')}
      </div>`;
    })()}

    <!-- VOLUMEN -->
    ${volumeEntries.length >= 2 ? `
    <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Trainingsvolumen</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:48px">
        ${volumeEntries.map(([date,vol],i) => { const pct=Math.round((vol/maxVolume)*100); const isLast=i===volumeEntries.length-1; return `<div style="flex:1;background:${isLast?'var(--accent)':'var(--bg4)'};border-radius:2px 2px 0 0;height:${pct}%;min-height:4px" title="${Math.round(vol).toLocaleString()} kg"></div>`; }).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px">
        <span style="font-family:var(--mono);font-size:9px;color:var(--muted2)">${formatDate(volumeEntries[0][0])}</span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--accent)">${Math.round(volumeEntries[volumeEntries.length-1][1]).toLocaleString()} kg</span>
      </div>
    </div>` : ''}

    <!-- GEWICHTSENTWICKLUNG -->
    ${progressExercises.length > 0 ? `
    <div style="margin-bottom:12px">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Gewichtsentwicklung</div>
      ${progressExercises.map(ex => `
        <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:12px;font-weight:500;color:var(--text)">${ex.name}</span>
            <span style="font-family:var(--mono);font-size:11px;color:${ex.diff>0?'var(--accent)':'var(--muted)'}">${ex.diff>0?'+':''}${ex.diff} kg</span>
          </div>
          <div style="display:flex;align-items:flex-end;gap:3px;height:28px">
            ${ex.last6.map((e,i)=>{ const maxW=Math.max(...ex.last6.map(x=>x.weight)); const pct=maxW>0?Math.round((e.weight/maxW)*100):0; const isLast=i===ex.last6.length-1; return `<div style="flex:1;background:${isLast?'var(--accent)':'var(--bg4)'};border-radius:2px 2px 0 0;height:${pct}%;min-height:4px"></div>`; }).join('')}
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:4px">
            <span style="font-family:var(--mono);font-size:9px;color:var(--muted2)">${ex.first} kg</span>
            <span style="font-family:var(--mono);font-size:9px;color:var(--accent)">${ex.last} kg</span>
          </div>
        </div>
      `).join('')}
    </div>` : ''}

    <!-- BESTLEISTUNGEN -->
    ${Object.keys(bestLifts).length > 0 ? `
    <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">🏆 Bestleistungen</div>
      ${Object.entries(bestLifts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([name,weight])=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)">
          <span style="font-size:12px;color:var(--text)">${name}</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500">${weight} kg</span>
        </div>
      `).join('')}
    </div>` : ''}

    <!-- VERLAUF mit Suche -->
    <div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Verlauf</div>
      <input type="text" placeholder="Übung suchen…" value="${statsSearchTerm}"
        oninput="statsSearchTerm=this.value;renderStats()"
        style="background:#111114;border:1px solid rgba(255,255,255,0.22);color:#f5f2eb;font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:6px;width:100%;outline:none;box-sizing:border-box;margin-bottom:12px">
      ${historyHtml || '<div style="font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding:20px 0">Noch keine abgeschlossenen Einheiten</div>'}
    </div>
  `;
}

function showDayDetail(dateStr) {
  // Find which day this was
  const dayEntry = Object.entries({ upper:1, push:3, pull:5, legs:6 }).find(([id, wd]) => {
    const d = new Date(dateStr);
    return (d.getDay() + 6) % 7 + 1 === wd || d.getDay() === wd;
  });
  // Show day details in a modal
  const allDayKeys = storageGetAllKeys().filter(k => k.endsWith(`:${dateStr}`));
  if (!allDayKeys.length) return;
  const k = allDayKeys[0];
  const dayId = k.split(':')[1];
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return;
  const raw = storageGet(k);
  const sets = raw?.sets || raw || {};
  const swapped = raw?.swapped || {};
  const noteKey = `gymbook:note:${dayId}:${dateStr}`;
  const note = storageGet(noteKey) || '';
  let html = `<button class="modal-close" onclick="closeModal()">×</button><h2>${day.type} · ${formatDate(dateStr)}</h2><div style="margin-top:14px">`;
  day.exercises.forEach((ex, ei) => {
    const name = swapped[ei] || ex.name;
    const skip = sets[ei]?.skipped;
    if (skip) { html += `<div style="padding:8px 0;border-bottom:0.5px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--red)">✕ ${name}: ${skip.reason}</div>`; return; }
    const exSets = sets[ei]?.sets || [];
    const filled = exSets.filter(s => s.weight);
    if (!filled.length) return;
    html += `<div style="padding:8px 0;border-bottom:0.5px solid var(--border)"><div style="font-size:12px;font-weight:500;color:var(--text);margin-bottom:3px">${name}</div><div style="font-family:var(--mono);font-size:11px;color:var(--muted)">${filled.map(s=>`${s.weight}kg×${s.reps||'?'}`).join(' · ')}</div></div>`;
  });
  if (note) html += `<div style="margin-top:10px;padding:8px 10px;background:var(--bg3);border-radius:6px;border-left:2px solid var(--accent);font-size:11px;color:var(--muted);font-style:italic">${note}</div>`;
  html += '</div>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}

function renderHome() {
  const now = new Date();
  const weekdays = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const greeting = now.getHours() < 12 ? 'Guten Morgen' : now.getHours() < 18 ? 'Guten Tag' : 'Guten Abend';

  document.getElementById('home-date').textContent = `${weekdays[now.getDay()]}, ${formatDate(todayStr())}`;

  // Next training day
  const weekdayMap = { upper: 1, push: 3, pull: 5, legs: 6 };
  const todayWd = now.getDay();
  let nextDay = null, nextDiff = 8;
  DAYS.forEach(d => {
    const target = weekdayMap[d.id];
    let diff = (target - todayWd + 7) % 7;
    if (diff === 0) diff = 7;
    if (diff < nextDiff) { nextDiff = diff; nextDay = d; }
  });

  // Today's session if exists
  const todaySession = DAYS.find(d => {
    const wd = weekdayMap[d.id];
    return wd === todayWd;
  });
  const todayCompleted = todaySession ? isSessionCompleted(todaySession.id, todayStr()) : false;

  // Week stats – only completed sessions
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  weekStart.setHours(0,0,0,0);
  const weekKeys = storageGetAllKeys().filter(k => {
    const p = k.split(':');
    if (p.length !== 3 || ['customplan','customcatalog','pausesettings'].includes(p[1])) return false;
    if (p[1].startsWith('note') || p[1].startsWith('binId')) return false;
    if (new Date(p[2]) < weekStart) return false;
    const raw = storageGet(k);
    return raw?.completed === true;
  });
  const weekDone = weekKeys.length;

  // Total sessions – only completed
  const allKeys = storageGetAllKeys().filter(k => {
    const p = k.split(':');
    if (p.length !== 3 || ['customplan','customcatalog','pausesettings'].includes(p[1])) return false;
    if (p[1].startsWith('note') || p[1].startsWith('binId')) return false;
    const raw = storageGet(k);
    return raw?.completed === true;
  });

  // Streak – based on completed sessions
  const sessionDates = [...new Set(allKeys.map(k => k.split(':')[2]))].sort().reverse();
  let streak = 0;
  let checkDate = new Date(now); checkDate.setHours(0,0,0,0);
  for (const date of sessionDates) {
    const d = new Date(date);
    const diff = Math.round((checkDate - d) / 86400000);
    if (diff <= 7) { streak++; checkDate = d; } else break;
  }

  // Last session
  const lastKey = allKeys.sort().reverse()[0];
  let lastSessionHtml = '';
  if (lastKey) {
    const lastDayId = lastKey.split(':')[1];
    const lastDate = lastKey.split(':')[2];
    const lastDay = DAYS.find(d => d.id === lastDayId);
    const raw = storageGet(lastKey);
    if (raw && lastDay) {
      const sets = raw.sets || raw;
      const swapped = raw.swapped || {};
      const entries = lastDay.exercises.slice(0, 4).map((ex, ei) => {
        const name = swapped[ei] || ex.name;
        const exSets = sets[ei]?.sets || [];
        const filled = exSets.filter(s => s.weight);
        if (!filled.length) return null;
        const maxW = Math.max(...filled.map(s => parseFloat(s.weight)));
        return { name, weight: maxW };
      }).filter(Boolean).slice(0, 3);

      lastSessionHtml = `
        <div class="home-card">
          <div class="home-card-title">Letztes Training · ${lastDay.type} · ${formatDate(lastDate)}</div>
          ${entries.map(e => `
            <div class="home-last-ex">
              <span class="home-last-ex-name">${e.name}</span>
              <span class="home-last-ex-val">${e.weight} kg</span>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  // Top PRs
  const bestLifts = {};
  allKeys.forEach(k => {
    const raw = storageGet(k);
    if (!raw) return;
    const sets = raw.sets || raw;
    const swapped = raw.swapped || {};
    DAYS.forEach((day, di) => {
      day.exercises.forEach((ex, ei) => {
        const name = swapped[ei] || ex.name;
        const exSets = sets[ei]?.sets || [];
        exSets.forEach(s => {
          const w = parseFloat(s.weight);
          if (!isNaN(w) && w > 0 && (!bestLifts[name] || w > bestLifts[name])) bestLifts[name] = w;
        });
      });
    });
  });
  const topPRs = Object.entries(bestLifts).sort((a,b) => b[1]-a[1]).slice(0, 3);

  const weekPills = DAYS.filter(d => d.id !== 'legs').map(d => {
    const wd = weekdayMap[d.id];
    const dateObj = new Date(weekStart);
    dateObj.setDate(weekStart.getDate() + wd - 1);
    const dateStr = dateObj.toISOString().slice(0,10);
    const done = !!storageGet(getKey(d.id, dateStr));
    const labels = { upper: 'Mo', push: 'Mi', pull: 'Fr' };
    return `<div class="home-week-pill ${done ? 'done' : 'pending'}">
      <div class="home-week-pill-label">${labels[d.id]}</div>
      <div style="font-size:14px;margin-top:2px">${done ? '✓' : '○'}</div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--muted2);margin-top:1px">${d.type.split('-')[0]}</div>
    </div>`;
  }).join('');

  const nextDayName = nextDiff === 1 ? 'Morgen' : nextDiff === 7 ? 'Nächsten ' + ['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(now.getTime() + nextDiff * 86400000).getDay()] : ['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(now.getTime() + nextDiff * 86400000).getDay()];

  // Body weight history
  const bwKeys = storageGetAllKeys().filter(k => k.startsWith('gymbook:bodyweight:')).sort().reverse();
  const latestBW = bwKeys.length ? storageGet(bwKeys[0]) : null;
  const bwHistory = bwKeys.slice(0, 12).map(k => ({
    date: k.split(':')[2],
    weight: parseFloat(storageGet(k))
  })).reverse().filter(e => !isNaN(e.weight));

  document.getElementById('home-content').innerHTML = `
    <div class="home-greeting">
      <div class="home-greeting-title">${greeting}, Marco 👋</div>
      <div class="home-greeting-sub">${todayCompleted ? 'Starkes Training heute! 💪' : 'Bereit fürs Training?'}</div>
    </div>

    ${todaySession && todayCompleted ? `
    <div class="home-card" style="border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.04)">
      <div class="home-card-title">✓ Heute abgeschlossen</div>
      <div class="home-next-type">${todaySession.type}</div>
      <div class="home-next-day" style="margin-top:4px">${nextDay ? `Nächste Einheit: ${nextDayName} · ${nextDay.type}` : 'Genieß die Erholung!'}</div>
    </div>
    ` : todaySession ? `
    <div class="home-card" style="border-color:rgba(201,168,76,0.3);background:rgba(201,168,76,0.05)">
      <div class="home-card-title">Heute auf dem Plan</div>
      <div class="home-next-type">${todaySession.type}</div>
      <div class="home-next-day">${todaySession.duration}</div>
      <button class="home-start-btn" onclick="currentDay=${DAYS.indexOf(todaySession)};switchTab('training')">Training starten →</button>
    </div>
    ` : nextDay ? `
    <div class="home-card">
      <div class="home-card-title">Nächste Einheit · ${nextDayName}</div>
      <div class="home-next-type">${nextDay.type}</div>
      <div class="home-next-day">${nextDay.duration}</div>
      <button class="home-start-btn" onclick="currentDay=${DAYS.indexOf(nextDay)};switchTab('training')">Zum Plan →</button>
    </div>
    ` : ''}

    <!-- KÖRPERGEWICHT -->
    <div class="home-card">
      <div class="home-card-title">Körpergewicht</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:${bwHistory.length > 1 ? '12px' : '0'}">
        <div style="flex:1">
          <div style="font-family:var(--display,serif);font-size:28px;font-weight:700;color:var(--accent)">${latestBW ? parseFloat(latestBW).toFixed(1) + ' kg' : '—'}</div>
          ${latestBW ? `<div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px">${formatDate(bwKeys[0].split(':')[2])}</div>` : '<div style="font-family:var(--mono);font-size:10px;color:var(--muted)">Noch kein Eintrag</div>'}
        </div>
        <button onclick="showBWInput()" style="background:var(--bg3);border:0.5px solid var(--border2);color:var(--accent);font-family:var(--mono);font-size:18px;font-weight:600;width:40px;height:40px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button>
      </div>
      ${bwHistory.length > 1 ? (() => {
        const weights = bwHistory.map(e => e.weight);
        const minW = Math.min(...weights) - 0.5;
        const maxW = Math.max(...weights) + 0.5;
        const range = maxW - minW || 1;
        const w = 260, h = 48;
        const pts = bwHistory.map((e, i) => {
          const x = (i / (bwHistory.length - 1)) * w;
          const y = h - ((e.weight - minW) / range) * h;
          return `${x},${y}`;
        }).join(' ');
        const trend = weights[weights.length-1] - weights[0];
        const trendColor = trend < 0 ? '#22c55e' : trend > 0 ? '#e87f7f' : 'var(--muted)';
        const trendStr = (trend > 0 ? '+' : '') + trend.toFixed(1) + ' kg';
        return `<div style="position:relative">
          <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:48px;overflow:visible">
            <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            ${bwHistory.map((e, i) => { const x=(i/(bwHistory.length-1))*w; const y=h-((e.weight-minW)/range)*h; return `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`; }).join('')}
          </svg>
          <div style="display:flex;justify-content:space-between;margin-top:4px">
            <span style="font-family:var(--mono);font-size:9px;color:var(--muted2)">${formatDate(bwHistory[0].date)}</span>
            <span style="font-family:var(--mono);font-size:9px;color:${trendColor}">${trendStr}</span>
          </div>
        </div>`;
      })() : ''}
    </div>

    <div class="home-card">
      <div class="home-card-title">Diese Woche</div>
      <div class="home-week-pills">${weekPills}</div>
    </div>

    <div class="home-stats-grid" style="margin-bottom:12px">
      <div class="home-stat">
        <div class="home-stat-val">${allKeys.length}</div>
        <div class="home-stat-label">Einheiten</div>
      </div>
      <div class="home-stat">
        <div class="home-stat-val">${streak}</div>
        <div class="home-stat-label">Streak</div>
      </div>
      <div class="home-stat">
        <div class="home-stat-val">${weekDone}</div>
        <div class="home-stat-label">Diese Woche</div>
      </div>
    </div>

    ${lastSessionHtml}

    ${topPRs.length ? `
    <div class="home-card">
      <div class="home-card-title">🏆 Bestleistungen</div>
      ${topPRs.map(([name, w]) => `
        <div class="home-pr-row">
          <span style="font-size:12px;color:var(--text)">${name}</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500">${w} kg</span>
        </div>
      `).join('')}
    </div>
    ` : ''}
  `;
}

let sessionStartTime = null;

function showFinishModal() {
  const day = DAYS[currentDay];
  const date = activeDateStr();

  // Calculate stats
  const duration = sessionStartTime ? Math.round((Date.now() - sessionStartTime) / 60000) : null;
  let totalSetsCompleted = 0;
  let newPRs = [];

  day.exercises.forEach((ex, ei) => {
    const sd = sessionData[ei] || { sets: [] };
    if (sd.skipped) return;
    const doneSets = (sd.sets || []).filter(s => s.done);
    totalSetsCompleted += doneSets.length;
  });

  const html = `
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:40px;margin-bottom:8px">🏆</div>
      <div style="font-size:20px;font-weight:700;letter-spacing:-0.3px">Training abgeschlossen!</div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px">${day.type} · ${formatDate(date)}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
      ${duration ? `
      <div style="background:var(--bg3);border-radius:8px;padding:12px;text-align:center">
        <div style="font-family:var(--display,serif);font-size:24px;font-weight:700;color:var(--accent)">${duration}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.06em">Minuten</div>
      </div>` : ''}
      <div style="background:var(--bg3);border-radius:8px;padding:12px;text-align:center">
        <div style="font-family:var(--display,serif);font-size:24px;font-weight:700;color:var(--accent)">${totalSetsCompleted}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:0.06em">Sätze</div>
      </div>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Notiz zum Training</div>
      <textarea id="finish-note" placeholder="Wie war das Training heute? (optional)"
        style="width:100%;background:#111114;border:1px solid rgba(255,255,255,0.22);color:#f5f2eb;font-family:var(--mono);font-size:13px;padding:12px;border-radius:8px;outline:none;resize:none;height:80px;box-sizing:border-box;line-height:1.5"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='rgba(255,255,255,0.22)'">${storageGet(`gymbook:note:${day.id}:${date}`) || ''}</textarea>
    </div>
    <button onclick="completeSession()" style="width:100%;background:var(--accent);color:#090909;border:none;font-family:var(--mono);font-size:13px;font-weight:600;padding:15px;border-radius:10px;cursor:pointer;margin-bottom:8px">✓ Training abschließen</button>
    <button onclick="closeFinishModal()" style="width:100%;background:none;border:0.5px solid var(--border2);color:var(--muted);font-family:var(--mono);font-size:12px;padding:13px;border-radius:10px;cursor:pointer">Weiter trainieren</button>
  `;

  document.getElementById('finish-modal-content').innerHTML = html;
  document.getElementById('finish-modal').style.display = 'flex';
}

function closeFinishModal() {
  document.getElementById('finish-modal').style.display = 'none';
}

function completeSession() {
  const day = DAYS[currentDay];
  const date = activeDateStr();

  // Save note from modal if filled in
  const noteEl = document.getElementById('finish-note');
  if (noteEl && noteEl.value.trim()) {
    const noteKey = `gymbook:note:${day.id}:${date}`;
    storageSet(noteKey, noteEl.value.trim());
  }

  // Mark session as completed
  const key = getKey(day.id, date);
  const existing = storageGet(key) || {};
  existing.completed = true;
  storageSet(key, existing);
  closeFinishModal();
  setStatus('✓ Training abgeschlossen!', true);
  setTimeout(() => switchTab('home'), 800);
}

function isSessionCompleted(dayId, date) {
  const raw = storageGet(getKey(dayId, date));
  return raw?.completed === true;
}
// ─────────────────────────────────────────────────────────────

// ── KÖRPERGEWICHT ─────────────────────────────────────────────
function showBWInput() {
  const today = todayStr();
  const existing = storageGet(`gymbook:bodyweight:${today}`) || '';
  const html = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Körpergewicht</h2>
    <div style="margin:16px 0">
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Heutiges Gewicht (kg)</div>
      <input type="number" id="bw-input" step="0.1" min="30" max="300" value="${existing}" placeholder="z.B. 79.5"
        style="width:100%;background:#111114;border:1px solid rgba(255,255,255,0.22);color:#f5f2eb;font-family:var(--mono);font-size:24px;padding:14px;border-radius:8px;outline:none;text-align:center;box-sizing:border-box"
        onfocus="this.select()">
    </div>
    <button onclick="saveBW()" style="width:100%;background:var(--accent);color:#090909;border:none;font-family:var(--mono);font-size:13px;font-weight:600;padding:14px;border-radius:10px;cursor:pointer">Speichern</button>
  `;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('bw-input')?.focus(), 100);
}

function saveBW() {
  const val = parseFloat(document.getElementById('bw-input')?.value);
  if (isNaN(val) || val <= 0) return;
  const today = todayStr();
  storageSet(`gymbook:bodyweight:${today}`, String(val));
  closeModal();
  renderHome();
}
// ─────────────────────────────────────────────────────────────

function toggleMenu() {
  const menu = document.getElementById('menu-dropdown');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', e => {
  const menu = document.getElementById('menu-dropdown');
  if (menu && !menu.contains(e.target) && !e.target.closest('.menu-btn')) {
    menu.style.display = 'none';
  }
});

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

// ── 2. AUTO-SELECT INPUT FIELDS ──────────────────────────────
document.addEventListener('focusin', e => {
  if (e.target.classList.contains('set-input') || e.target.tagName === 'INPUT') {
    setTimeout(() => e.target.select(), 0);
  }
});

// ── 3. UNSAVED WARNING ────────────────────────────────────────
window.addEventListener('beforeunload', e => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// Save custom pause when user adjusts timer
function adjustTimer(delta) {
  if (timerPaused) {
    timerPausedAt = Math.max(0, timerPausedAt + delta);
    timerTotal = Math.max(timerTotal, timerPausedAt);
  } else {
    // +delta means more time: move startTime earlier so elapsed is less
    timerStartTime += delta * 1000;
    // Don't let startTime be in the future
    if (timerStartTime > Date.now()) timerStartTime = Date.now();
    const remaining = getRemainingSeconds();
    if (remaining > timerTotal) timerTotal = remaining;
  }
  updateTimerDisplay();
}

// ── OFFLINE / SERVICE WORKER ──────────────────────────────────
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'gymbook-v1';
    const ASSETS = [location.href];
    self.addEventListener('install', e => e.waitUntil(
      caches.open(CACHE).then(c => c.addAll(ASSETS))
    ));
    self.addEventListener('fetch', e => {
      if (e.request.url.includes('jsonbin.io')) return;
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
          return res;
        }))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
// ─────────────────────────────────────────────────────────────

// Init
renderNav();
switchTab('home');
cloudInit();
</script>
