<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GymBook">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23000000'/%3E%3Ctext x='90' y='80' font-family='Arial Narrow,Arial,sans-serif' font-weight='900' font-size='52' letter-spacing='4' text-anchor='middle' fill='%23f5f2eb'%3EGYM%3C/text%3E%3Ctext x='90' y='130' font-family='Arial Narrow,Arial,sans-serif' font-weight='900' font-size='52' letter-spacing='4' text-anchor='middle' fill='%23ff5a47'%3EBOOK%3C/text%3E%3C/svg%3E">
<title>GymBook</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
  /* iOS-Farb-Tokens – Hellmodus. Hell/Dunkel folgt automatisch der
     iPhone-Einstellung. */
  :root {
    color-scheme: light dark;
    --bg:    #f2f2f7;
    --bg2:   #ffffff;
    --bg3:   #f2f2f7;
    --bg4:   #d1d1d6;
    --field: rgba(118,118,128,0.12);
    --border:  rgba(60,60,67,0.14);
    --border2: rgba(60,60,67,0.26);
    --text:  #1c1c1e;
    --muted: #636366;
    --muted2:#8e8e93;
    --accent:  #ff5a47;
    --accent2: #e84a38;
    --accent3: #ff7a6b;
    --accent-dim:  color-mix(in srgb, var(--accent) 10%, transparent);
    --accent-dim2: color-mix(in srgb, var(--accent) 18%, transparent);
    --on-accent: #ffffff;
    --upper: #7d5fe0;
    --push:  #e5534b;
    --pull:  #2f86d6;
    --legs:  #e07a2f;
    --red:   #ff3b30;
    --green: #34c759;
    --bar:   rgba(249,249,249,0.92);
    --overlay: rgba(0,0,0,0.4);
    --card-shadow: 0 1px 2px rgba(0,0,0,0.05);
    --mono:  -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    --sans:  -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  }
  /* Dunkelmodus */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:    #000000;
      --bg2:   #1c1c1e;
      --bg3:   #2c2c2e;
      --bg4:   #48484a;
      --field: rgba(118,118,128,0.24);
      --border:  #38383a;
      --border2: #545458;
      --text:  #ffffff;
      --muted: #aeaeb2;
      --muted2:#8e8e93;
      --accent:  #ff6b5b;
      --accent2: #ff5a47;
      --accent3: #ff8a7d;
      --upper: #9b7fe8;
      --push:  #e87f7f;
      --pull:  #64a8e8;
      --legs:  #e8a06a;
      --red:   #ff453a;
      --green: #30d158;
      --bar:   rgba(22,22,24,0.9);
      --overlay: rgba(0,0,0,0.6);
      --card-shadow: none;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh;
    /* Verhindert, dass Safari beim Überziehen die Seite neu lädt (Pull-to-Refresh)
       und dass das Gummiband-Scrolling mitten im Training stört. */
    overscroll-behavior-y: contain;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  input, textarea, select, button { font-family: var(--sans); }

  /* Bedienelemente sollen sich beim Antippen nicht wie Text markieren lassen –
     passiert am iPhone sonst leicht beim schnellen Tippen im Training. */
  button, .nav-btn, .tab-btn, .exercise-header, .cat-ex-row,
  .ex-list-row, .quick-btns button, .check-btn, .filter-popup-item {
    -webkit-user-select: none; user-select: none; }

  /* Sekundäre Knöpfe: graue Fläche, kein Rahmen */
  .btn { background: var(--bg3); border: none; color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 7px 13px; border-radius: 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { color: var(--accent); }
  .nav-btn .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot-upper { background: var(--upper); }
  .dot-legs  { background: var(--legs); }
  .dot-push  { background: var(--push); }
  .dot-pull  { background: var(--pull); }

  /* DATE PICKER */
  .date-picker { background: transparent; border: none; border-bottom: 0.5px solid var(--border2); color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 4px 2px; outline: none; cursor: pointer; transition: border-color 0.15s; color-scheme: light dark; }
  .date-picker:hover, .date-picker:focus { border-bottom-color: var(--accent); color: var(--text); }
  .back-entry-badge { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); border: 0.5px solid color-mix(in srgb, var(--accent) 25%, transparent); }

  /* KARTEN & FLÄCHEN – ohne Rahmen, mit leichtem Schatten (im Dunkelmodus keiner) */
  .home-card, .exercise-card, .ex-list-row, .plan-row, .edit-card, .edit-new-ex, .filter-popup, .menu-dropdown, .plan-select {
    background: var(--bg2); border: none; border-radius: 14px; box-shadow: var(--card-shadow); }

  /* EXERCISE CARDS */
  .exercise-card { margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s; }
  .exercise-header { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; }
  .ex-name { font-size: 13px; font-weight: 600; flex: 1; letter-spacing: -0.2px; }
  .ex-chevron { width: 18px; height: 18px; color: var(--muted2); transition: transform 0.25s ease; flex-shrink: 0; }
  .ex-chevron.open { transform: rotate(90deg); }
  .exercise-body { display: none; padding: 0 14px 14px; border-top: 0.5px solid var(--border); }
  .exercise-body.open { display: block; }

  /* SET ROWS */
  .sets-header { display: grid; grid-template-columns: 22px 1fr 42px 1fr 42px 36px; gap: 6px; padding: 12px 0 6px; }
  .sets-header span { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted2); text-align: center; letter-spacing: 0; text-transform: none; }
  .sets-header span:nth-child(2) { text-align: left; }
  .set-row { display: grid; grid-template-columns: 22px 1fr 42px 1fr 42px 36px; gap: 6px; align-items: center; margin-bottom: 8px; }
  .set-num { font-family: var(--mono); font-size: 12px; color: var(--muted2); text-align: center; }
  .set-input { background: var(--field); border: 1.5px solid transparent; color: var(--text); font-family: var(--mono); font-size: 17px; font-weight: 600; padding: 10px 8px; border-radius: 10px; width: 100%; outline: none; transition: border-color 0.15s, box-shadow 0.15s; text-align: center; }
  .set-input:focus { border-color: var(--accent); }
  .set-input::placeholder { color: var(--muted2); font-weight: 400; }
  .set-input.done { color: var(--muted2); }
  /* Abhaken: runder Kreis, grün wenn erledigt */
  .check-btn { width: 34px; height: 34px; margin: auto; background: none; border: 2px solid var(--bg4); border-radius: 50%; cursor: pointer; color: transparent; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .check-btn.checked { background: var(--green); border-color: var(--green); color: #fff; }
  .ex-note { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 10px; padding: 8px 10px; background: var(--bg3); border-radius: 10px; border-left: 3px solid var(--border2); line-height: 1.6; }
  .ex-note.warning { border-left-color: var(--legs); color: #b8845a; }

  /* HISTORY */
  .history-section { margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border); }
  .history-title { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted2); margin-bottom: 8px; letter-spacing: 0; text-transform: none; }
  .history-entry { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .history-date { font-family: var(--mono); font-size: 12px; color: var(--muted2); width: 60px; flex-shrink: 0; }
  .history-sets { font-family: var(--mono); font-size: 13px; color: var(--muted); flex: 1; }

  /* SUGGESTION BADGES */
  .history-exceeded { color: var(--accent) !important; }
  .sugg-detail { font-family: var(--mono); font-size: 12px; color: var(--muted2); margin-top: 6px; font-style: italic; }

  /* SWAP */
  .swap-btn { background: var(--bg3); border: none; color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .swap-btn:hover { color: var(--accent); }
  .swap-btn.active { color: var(--accent); background: var(--accent-dim); }

  /* SET ADJUST */
  .set-adjust-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .set-adj-btn { background: var(--bg3); border: none; color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 10px; cursor: pointer; transition: all 0.15s; }
  .set-adj-plus  { color: var(--accent); background: var(--accent-dim); }
  .set-adj-plus:hover  { background: var(--accent-dim2); }
  .set-adj-minus { color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); }
  .set-adj-minus:hover { background: color-mix(in srgb, var(--red) 12%, transparent); }

  /* MODAL – als iOS-Sheet */
  .modal-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  .modal { background: var(--bg2); border: none; border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; max-height: 80vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.2px; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .history-full-entry { padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .history-full-entry:last-child { border-bottom: none; }
  .history-full-date { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-bottom: 6px; letter-spacing: 0.04em; }
  .history-full-sets { font-family: var(--mono); font-size: 13px; color: var(--muted); line-height: 1.8; }

  /* MOBILE */
  @media (max-width: 480px) {
    .set-row     { margin-bottom: 10px; }
    .set-input   { padding: 11px 6px; }
    .swap-btn    { padding: 5px 10px; min-height: 32px; }
    .set-adj-btn { padding: 8px 14px; min-height: 36px; }
    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal { border-radius: 16px 16px 0 0; max-height: 88vh; }
    .date-picker { font-size: 12px; padding: 6px 4px; }
  }

  /* TIMER */
  #timer-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 300; display: flex; align-items: flex-end; justify-content: center; padding: 0; backdrop-filter: blur(8px); }
  #timer-box { background: var(--bg2); border: none; border-radius: 22px 22px 0 0; padding: 20px 24px calc(20px + env(safe-area-inset-bottom)); width: 100%; }
  #timer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #timer-label { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; text-transform: none; }
  #timer-header button { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 0; }
  #timer-ring-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 10px; }
  #timer-svg { width: 120px; height: 120px; transform: rotate(-90deg); }
  #timer-track { fill: none; stroke: var(--bg4); stroke-width: 6; }
  #timer-progress { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
  #timer-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--sans); font-size: 40px; font-weight: 700; color: var(--text); letter-spacing: -1px; }
  #timer-rir { margin-bottom: 12px; text-align: center; }
  .rir-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .rir-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .rir-btn { background: var(--bg3); border: none; color: var(--text); font-size: 15px; font-weight: 600; padding: 10px 0; border-radius: 10px; cursor: pointer; }
  .rir-btn.active { background: var(--accent); color: var(--on-accent); }
  .warmup-row .set-num { font-weight: 700; color: var(--legs); }
  .warmup-row .set-input { font-size: 15px; padding-top: 7px; padding-bottom: 7px; }
  .warmup-row .check-btn { width: 28px; height: 28px; }
  .stag-hint { font-size: 12px; color: var(--legs); margin-top: 4px; }
  /* Supersatz: zwei Karten in einem gemeinsamen Rahmen */
  .superset-group { border: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 16px; padding: 6px 6px 0; margin-bottom: 10px; }
  .superset-group .exercise-card { margin-bottom: 6px; }
  .superset-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 6px 6px; font-size: 12px; font-weight: 600; color: var(--accent); }
  .superset-head button { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 4px; }
  #timer-next-info { margin-bottom: 10px; text-align: center; }
  #timer-next-label { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #timer-next-inputs { display: flex; gap: 10px; justify-content: center; }
  #timer-next-inputs > div { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #timer-next-inputs input { background: var(--field); border: 1.5px solid transparent; color: var(--text); font-family: var(--mono); font-size: 18px; padding: 10px 8px; border-radius: 8px; width: 80px; text-align: center; outline: none; }
  #timer-next-inputs input:focus { border-color: var(--accent); }
  #timer-adjust { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  #timer-adjust button { background: var(--bg3); border: none; color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 12px 0; border-radius: 10px; cursor: pointer; transition: all 0.15s; text-align: center; }
  #timer-adjust button:hover { color: var(--accent); }
  #timer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #timer-pause-btn { background: var(--accent); color: var(--on-accent); border: none; font-family: var(--mono); font-size: 16px; font-weight: 600; padding: 15px; border-radius: 12px; cursor: pointer; transition: background 0.15s; }
  #timer-pause-btn:hover { background: var(--accent3); }
  #timer-skip-btn { background: var(--bg3); border: none; color: var(--text); font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 15px; border-radius: 10px; cursor: pointer; transition: all 0.15s; }

  .training-end { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 0.03em; margin-left: auto; white-space: nowrap; }
  @keyframes prPop { 0%{opacity:0;transform:translateX(-50%) scale(0.8)} 100%{opacity:1;transform:translateX(-50%) scale(1)} }
  .menu-item-danger { color: var(--red); }
  .menu-storage { padding: 4px 14px 10px; }
  .menu-item-danger:hover { background: color-mix(in srgb, var(--red) 8%, transparent); }
  .progress-dots { display: flex; gap: 4px; margin-top: 2px; }
  .progress-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--bg4); transition: background 0.2s; }
  .progress-bar.done { background: var(--green); }

  /* Kartenkopf: Name + Zielwiederholungen in einer Zeile */
  .ex-title-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .ex-title-row .ex-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
  .ex-target { font-family: var(--mono); font-size: 13px; color: var(--muted2); white-space: nowrap; flex-shrink: 0; }

  /* Gewichtsvorschlag – die Zahl, die beim Rangehen zählt */
  .sugg-block { text-align: right; flex-shrink: 0; margin-left: 4px; }
  .sugg-value { font-family: var(--mono); font-size: 17px; font-weight: 500; line-height: 1.1; }
  .sugg-unit { font-family: var(--mono); font-size: 12px; color: var(--muted2); margin-top: 1px; }

  /* Muskelgruppe/Pause: aus dem Kopf in die aufgeklappte Ansicht verschoben */
  .ex-detail-meta { font-family: var(--mono); font-size: 12px; color: var(--muted2); padding: 2px 0 6px; }
  .quick-btns { display: flex; flex-direction: column; gap: 3px; }
  .quick-btns button { background: var(--bg3); border: none; color: var(--accent); font-family: var(--mono); font-size: 17px; font-weight: 600; width: 42px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; line-height: 1; padding: 0; }
  .quick-btns button:active { transform: scale(0.92); background: var(--accent-dim2); }

  /* CALENDAR */
  .cal-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .cal-header-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
  .cal-header-cell { font-family: var(--mono); font-size: 12px; color: var(--muted2); text-align: center; padding: 4px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-cell { background: var(--bg2); border-radius: 6px; padding: 5px 3px; min-height: 44px; display: flex; flex-direction: column; align-items: center; }
  .cal-cell.empty { background: none; }
  .cal-cell.today { border: 1.5px solid var(--accent); }
  .cal-cell.has-session { background: var(--bg3); }
  .cal-cell.past-empty { opacity: 0.35; }
  .cal-day { font-family: var(--mono); font-size: 13px; color: var(--text); }
  .cal-cell.today .cal-day { color: var(--accent); font-weight: 600; }

  /* WEEK STATS + NOTE */
  .week-stats { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 0; }
  .week-stat-pills { display: flex; align-items: center; gap: 5px; }
  .week-pill { width: 20px; height: 5px; border-radius: 3px; background: var(--bg4); }
  .week-pill.done { background: var(--green); }
  .week-stat-label { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 8px; }
  .expand-all-btn { background: var(--bg3); border: none; color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 10px; cursor: pointer; transition: all 0.15s; }
  .expand-all-btn:hover { color: var(--accent); }
  .note-wrap { padding: 8px 20px 0; }
  .session-note-input { width: 100%; background: var(--field); border: none; color: var(--text); font-family: var(--mono); font-size: 16px; padding: 10px 12px; border-radius: 10px; outline: none; resize: none; min-height: 36px; max-height: 80px; transition: border-color 0.15s; line-height: 1.5; box-sizing: border-box; }
  .session-note-input::placeholder { color: var(--muted2); }

  /* PLAN-EDITOR */
  .edit-mode-bar { background: color-mix(in srgb, var(--accent) 8%, transparent); border: 0.5px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .edit-mode-label { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: 0; text-transform: none; }
  .edit-card { margin-bottom: 8px; overflow: hidden; }
  .edit-card-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 0.5px solid var(--border); }
  .edit-ex-num { font-family: var(--mono); font-size: 12px; color: var(--muted2); width: 18px; flex-shrink: 0; }
  .edit-ex-name { font-size: 13px; font-weight: 600; color: var(--accent); flex: 1; }
  .edit-swap-btn { background: var(--bg3); border: none; color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .edit-swap-btn:hover { color: var(--accent); }
  .edit-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 16px; }
  .edit-field { display: flex; flex-direction: column; gap: 4px; }
  .edit-field label { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted2); text-transform: none; letter-spacing: 0; }
  .edit-field input { background: var(--field); border: 1px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 16px; padding: 8px; border-radius: 4px; outline: none; text-align: center; width: 100%; transition: border-color 0.15s; }
  .edit-field input:focus { border-color: var(--accent); }

  /* CATALOG MODAL */
  .catalog-modal-inner { padding: 0; overflow: hidden; display: flex; flex-direction: column; max-height: 88vh; }

  .cat-reset-btn { margin: 10px 20px 0; background: var(--bg3); border: none; color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: all 0.15s; width: calc(100% - 40px); text-align: left; }

  .cat-tab.active { background: var(--accent-dim); }

  .cat-label { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; white-space: nowrap; }
  .cat-tab.active .cat-label { color: var(--accent); }
  .cat-ex-list { overflow-y: auto; flex: 1; padding: 8px 0; }
  .cat-ex-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.1s; }
  .cat-ex-row:last-child { border-bottom: none; }
  .cat-ex-row:hover { background: var(--bg3); }
  .ex-list-row { display: flex; align-items: center; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
  .ex-list-row .ex-chevron { color: var(--muted2); }
  .filter-btn { background: var(--field); border: none; color: var(--accent); width: 42px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .filter-popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 250; display: flex; align-items: flex-start; justify-content: flex-end; padding-top: 150px; padding-right: 20px; }
  .filter-popup { padding: 6px; min-width: 200px; max-height: 70vh; overflow-y: auto; }
  .filter-popup-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--text); transition: background 0.1s; }
  .filter-popup-item:hover { background: var(--bg3); }
  .filter-popup-item.active { color: var(--accent); font-weight: 600; }
  .filter-popup-check { color: var(--accent); font-size: 15px; }
  .filter-popup-divider { height: 0.5px; background: var(--border); margin: 4px 8px; }
  .cat-ex-row.cat-ex-active { background: var(--accent-dim); }
  .cat-ex-name { font-size: 13px; color: var(--text); flex: 1; }
  .cat-ex-arrow { font-family: var(--mono); font-size: 12px; color: var(--muted2); margin-left: 10px; }
  .cat-ex-row.cat-ex-active .cat-ex-arrow { color: var(--accent); }
  .cat-original-badge { font-family: var(--mono); font-size: 12px; color: var(--muted2); background: var(--bg4); border: 0.5px solid var(--border2); padding: 2px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }
  .cat-active-badge { font-family: var(--mono); font-size: 12px; color: var(--accent); background: var(--accent-dim); border: 0.5px solid color-mix(in srgb, var(--accent) 30%, transparent); padding: 2px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }

  @media (max-width: 480px) {
    .catalog-modal-inner { max-height: 90vh; }
    .cat-ex-row { padding: 16px 20px; }
    .cat-ex-name { font-size: 14px; }
  }

  /* HEADER – iOS Large Title */
  .header { padding: max(env(safe-area-inset-top), 16px) 20px 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .header-left h1 { font-family: var(--display); font-size: 32px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1; color: var(--text); }
  .header-left h1 span { color: var(--accent); }
  .header-left h1 span:first-child { color: var(--text); }
  .header-left p { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--muted2); margin-top: 4px; letter-spacing: 0; }
  .header-right { display: flex; gap: 8px; align-items: center; }

  /* Menu button */
  .menu-btn { background: none; border: none; color: var(--accent); font-size: 24px; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.15s; flex-shrink: 0; letter-spacing: 2px; }
  .menu-btn:hover { color: var(--text); }
  .edit-plan-btn-new { background: var(--bg3); border: none; color: var(--accent); font-family: var(--mono); font-size: 14px; font-weight: 600; padding: 0 14px; height: 34px; border-radius: 18px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }

  /* Dropdown menu */
  .menu-dropdown { position: absolute; top: 60px; right: 20px; padding: 6px; z-index: 150; min-width: 180px; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 8px; font-family: var(--mono); font-size: 12px; color: var(--text); cursor: pointer; transition: background 0.1s; border: none; background: none; width: 100%; text-align: left; }
  .menu-item:hover { background: var(--bg3); }
  .menu-item-icon { font-size: 15px; width: 20px; text-align: center; }
  .menu-divider { height: 0.5px; background: var(--border); margin: 4px 0; }

  /* Nav chips – aktiver Tag in seiner Farbe */
  .nav { display: flex; gap: 6px; padding: 14px 20px 0; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn { background: var(--bg2); border: none; color: var(--text); font-family: var(--mono); font-size: 14px; font-weight: 600; padding: 8px 15px; border-radius: 20px; cursor: pointer; transition: all 0.15s; white-space: nowrap; letter-spacing: 0.02em; box-shadow: var(--card-shadow); }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active-upper, .nav-btn.active-push, .nav-btn.active-pull, .nav-btn.active-legs { color: #fff; }
  .nav-btn.active-upper { background: var(--upper); }
  .nav-btn.active-push  { background: var(--push); }
  .nav-btn.active-pull  { background: var(--pull); }
  .nav-btn.active-legs  { background: var(--legs); }

  /* PLAN SWITCHER */
  /* Plan-Auswahl: ein Knopf statt einer Leiste, die mit jedem Plan enger wird */
  .plan-switcher { padding: 12px 20px 0; }
  .plan-select { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 14px; cursor: pointer; transition: border-color 0.15s; color: var(--text); }
  .plan-select-label { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted2); text-transform: none; letter-spacing: 0; flex-shrink: 0; }
  .plan-select-name { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--accent); flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-select-count { font-family: var(--mono); font-size: 12px; color: var(--muted2); background: var(--bg3); border-radius: 10px; padding: 2px 7px; flex-shrink: 0; }

  /* Planverwaltung */
  .plan-row { display: flex; align-items: center; gap: 8px; padding: 12px 12px; margin-bottom: 8px; }
  .plan-row.active { background: var(--accent-dim); }
  .plan-row-name { font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-row-meta { font-family: var(--mono); font-size: 12px; color: var(--muted2); margin-top: 3px; }
  .plan-row-badge { font-family: var(--mono); font-size: 12px; color: var(--accent); background: var(--accent-dim2); border-radius: 3px; padding: 2px 6px; vertical-align: middle; }
  .plan-row-btn { background: var(--bg3); border: none; color: var(--text); font-family: var(--mono); font-size: 12px; font-weight: 600; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 10px; cursor: pointer; flex-shrink: 0; transition: all 0.15s; }
  .plan-row-btn:hover { color: var(--accent); }
  .plan-row-btn.danger:hover { color: var(--red); }
  .plan-add-btn { width: 100%; background: none; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); font-family: var(--mono); font-size: 12px; padding: 13px; border-radius: 10px; cursor: pointer; margin-top: 6px; }
  .plan-add-btn:hover { background: var(--accent-dim); }

  /* Session meta */
  .session-meta { display: flex; align-items: center; gap: 10px; padding: 14px 20px 0; flex-wrap: nowrap; }
  .session-label { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted); white-space: nowrap; transition: opacity 0.15s; }
  .session-label:hover { opacity: 0.75; }
  .session-date-wrap { display: flex; align-items: center; gap: 6px; flex: 1; }
  .session-note { font-family: var(--mono); font-size: 12px; color: var(--muted2); margin-left: auto; white-space: nowrap; }

  /* TAB BAR – durchscheinend mit Unschärfe wie bei iOS */
  .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid var(--border); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); display: flex; z-index: 200; }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 4px 0; transition: all 0.15s; color: var(--muted2); }
  .tab-btn:hover { color: var(--muted); }
  .tab-btn.active { color: var(--accent); }
  .tab-icon-svg { width: 22px; height: 22px; }
  .tab-label { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; }

  /* HOME PAGE */
  .home-page { padding: 14px 20px 100px; }
  .home-greeting { margin-bottom: 20px; }
  .home-greeting-title { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; }
  .home-greeting-sub { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 4px; }
  .home-card { padding: 16px; margin-bottom: 12px; }
  .home-card-title { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted2); text-transform: none; letter-spacing: 0; margin-bottom: 10px; }
  .home-next-type { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.4px; }
  .home-next-day { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 3px; }
  .home-start-btn { display: block; width: 100%; background: var(--accent); color: var(--on-accent); border: none; font-family: var(--mono); font-size: 16px; font-weight: 600; padding: 14px; border-radius: 12px; cursor: pointer; margin-top: 14px; transition: background 0.15s; }
  .home-start-btn:hover { background: var(--accent3); }
  .home-stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .home-stat { background: var(--bg2); border-radius: 12px; padding: 12px; text-align: center; box-shadow: var(--card-shadow); }
  .home-stat-val { font-family: var(--sans); font-size: 26px; font-weight: 700; color: var(--text); }
  .home-stats-grid .home-stat:nth-child(2) .home-stat-val { color: var(--accent); }
  .home-stat-label { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 3px; text-transform: none; letter-spacing: 0; }
  .home-last-ex { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 0.5px solid var(--border); font-size: 12px; }
  .home-last-ex:last-child { border-bottom: none; }
  .home-last-ex-name { color: var(--text); }
  .home-last-ex-val { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .home-week-pills { display: flex; gap: 6px; margin-top: 8px; }
  .home-week-pill { flex: 1; border-radius: 6px; padding: 8px 4px; text-align: center; }
  .home-week-pill-label { font-family: var(--mono); font-size: 12px; color: var(--muted2); }
  .home-week-pill.done { background: color-mix(in srgb, var(--green) 14%, transparent); border: none; }
  .home-week-pill.done .home-week-pill-label { color: var(--green); }
  .home-week-pill.pending { background: var(--bg3); border: none; }
  .home-pr-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 0.5px solid var(--border); }
  .home-pr-row:last-child { border-bottom: none; }

  .save-bar { position: fixed; bottom: calc(56px + env(safe-area-inset-bottom)); left: 0; right: 0; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid var(--border); padding: 8px 20px; display: flex; align-items: center; gap: 12px; z-index: 100; }
  .save-status { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.03em; flex: 1; }
  .save-status.saved { color: var(--accent); }
  /* Abschluss-Knopf am Seitenende – nicht mehr in der fixierten Fußleiste */
  .finish-wrap { padding: 20px 20px 0; margin-top: 4px; border-top: 0.5px solid var(--border); }
  .finish-btn-large { width: 100%; background: var(--accent); color: var(--on-accent); border: none; font-family: var(--mono); font-size: 16px; font-weight: 600; padding: 16px; border-radius: 12px; cursor: pointer; transition: background 0.15s; letter-spacing: 0.02em; }
  .finish-btn-large:hover { background: var(--accent3); }
  .finish-btn-large:active { transform: scale(0.99); }
  .main { padding: 14px 20px 140px; }

  /* Suchfeld im Übungen-Tab */
  #exercises-search { flex: 1; min-width: 0; background: var(--field); border: none; border-radius: 10px; color: var(--text); font-family: var(--mono); font-size: 16px; padding: 11px 14px; outline: none; box-sizing: border-box; }

  /* Backup-Erinnerung */
  .backup-card { display: flex; align-items: center; gap: 12px; }
  .backup-card .bk-text { flex: 1; font-size: 14px; line-height: 1.4; }
  .backup-card .bk-text small { display: block; color: var(--muted2); font-size: 13px; margin-top: 2px; }
  .backup-card button { background: var(--accent); color: var(--on-accent); border: none; font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>

<div id="home-page" style="display:none">
  <div class="header">
    <div class="header-left">
      <h1><span>Gym</span><span>Book</span></h1>
      <p id="home-date"></p>
    </div>
    <div class="header-right">
      <button class="menu-btn" onclick="toggleMenu()">⋯</button>
    </div>
  </div>
  <div class="home-page" id="home-content"></div>
</div>

<div id="training-page" style="display:none">

</div>

</div><!-- end training-page -->

<!-- Dropdown Menu – bewusst AUSSERHALB der Training-Seite, sonst ist es auf
     Home/Übungen/Statistiken mit der Training-Seite zusammen unsichtbar -->
<div class="menu-dropdown" id="menu-dropdown" style="display:none;position:fixed;top:70px;right:20px">
  <button class="menu-item" onclick="switchTab('stats');toggleMenu()"><span class="menu-item-icon">📊</span>Statistiken</button>
  <div class="menu-divider"></div>
  <button class="menu-item" onclick="toggleMenu();syncNow()"><span class="menu-item-icon">☁</span><span id="menu-sync-label">Jetzt synchronisieren</span></button>

      <button class="menu-btn" onclick="toggleMenu()">⋯</button>

// den Hintergrund geht, gibt iOS die Sperre frei; bei Rückkehr wird sie
// neu angefordert. Ohne Browser-Unterstützung passiert einfach nichts.
let wakeLockSentinel = null;
async function updateWakeLock() {
  const want = (typeof currentTab !== 'undefined' && currentTab === 'training') && document.visibilityState === 'visible';
  try {
    if (want && !wakeLockSentinel && 'wakeLock' in navigator) {
      wakeLockSentinel = await navigator.wakeLock.request('screen');
      wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
    } else if (!want && wakeLockSentinel) {
      const s = wakeLockSentinel; wakeLockSentinel = null;
      await s.release();
    }
  } catch (e) { wakeLockSentinel = null; }
}

    const raw = localStorage.getItem('gymbook:userplans');

    const plans = JSON.parse(raw);

})();

// Datum als JJJJ-MM-TT in ÖRTLICHER Zeit. toISOString() rechnet in UTC –
// damit galt in Deutschland bis 1 Uhr (Winter) bzw. 2 Uhr (Sommer) noch der
// Vortag, und ein Training kurz nach Mitternacht landete am falschen Datum.
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// "JJJJ-MM-TT" als örtliches Datum lesen (new Date(str) würde es als UTC lesen)
function parseLocalDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function todayStr() { return localDateStr(new Date()); }
function activeDateStr() { return activeDate || todayStr(); }

// Eigene Texte (Übungs-/Plannamen, Notizen, Gründe, Importdaten) dürfen nie
// als HTML ausgewertet werden. Vorher brach z. B. ein " in einem Übungsnamen
// die Knöpfe, und eine präparierte Importdatei hätte Skriptcode ausführen
// können.
// esc():   für Text und Attributwerte in innerHTML-Vorlagen
// jsArg(): für Werte, die in onclick="…" als JS-Zeichenkette übergeben werden
//          (inkl. Anführungszeichen – also OHNE eigene '…' drumherum einsetzen)
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function jsArg(v) { return esc(JSON.stringify(String(v ?? ''))); }

function formatDate(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function setActiveDate(val) {
  activeDate = val || null;
  loadSessionData();
  renderDay();
}

function weekdayFromDate(iso) {
  const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const [y,m,d] = iso.split('-').map(Number);
  return days[new Date(y, m-1, d).getDay()];
}

// ── JSONBin Storage ──────────────────────────────────────────
// Der Schlüssel steht bewusst NICHT im Code: Er wird einmal über das Menü
// eingegeben und nur im lokalen Speicher dieses Geräts abgelegt. Der Präfix
// "gymbook_" (Unterstrich) sorgt dafür, dass er weder exportiert noch in die
// Cloud hochgeladen wird – beides erfasst nur "gymbook:"-Schlüssel.
const JSONBIN_KEY_STORE = 'gymbook_jsonbinKey';
const JSONBIN_KEY_TYPE_STORE = 'gymbook_jsonbinKeyType';   // 'access' | 'master'

function getJsonbinKey() {
  try { return localStorage.getItem(JSONBIN_KEY_STORE) || ''; } catch(e) { return ''; }
}

function jsonbinAuthHeaders() {
  let type = 'access';
  try { type = localStorage.getItem(JSONBIN_KEY_TYPE_STORE) || 'access'; } catch(e) {}
  return { [type === 'master' ? 'X-Master-Key' : 'X-Access-Key']: getJsonbinKey() };
}

function openCloudKeyModal() {
  let type = 'access';
  try { type = localStorage.getItem(JSONBIN_KEY_TYPE_STORE) || 'access'; } catch(e) {}
  const hasKey = !!getJsonbinKey();
  document.getElementById('modal-content').innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Cloud-Schlüssel</h2>
    <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin:12px 0 14px;line-height:1.6">
      Wird nur auf diesem Gerät gespeichert. ${hasKey ? 'Ein Schlüssel ist bereits hinterlegt.' : 'Noch kein Schlüssel hinterlegt – die App arbeitet nur lokal.'}
    </div>
    <select id="cloud-key-type" style="width:100%;background:var(--field);border:none;color:var(--text);font-size:16px;padding:11px 12px;border-radius:10px;margin-bottom:8px">
      <option value="access" ${type !== 'master' ? 'selected' : ''}>Access-Key (empfohlen)</option>
      <option value="master" ${type === 'master' ? 'selected' : ''}>Master-Key</option>
    </select>
    <input type="password" id="cloud-key-input" autocomplete="off" placeholder="${hasKey ? 'Neuen Schlüssel eingeben' : 'Schlüssel eingeben'}"
      style="width:100%;background:var(--field);border:none;color:var(--text);font-size:16px;padding:11px 12px;border-radius:10px;box-sizing:border-box;margin-bottom:14px">
    <button onclick="saveCloudKey()" style="width:100%;background:var(--accent);color:var(--on-accent);border:none;font-size:15px;font-weight:600;padding:14px;border-radius:12px;cursor:pointer;margin-bottom:8px">Speichern & verbinden</button>
    ${hasKey ? `<button onclick="removeCloudKey()" style="width:100%;background:none;border:none;color:var(--red);font-size:14px;padding:10px;cursor:pointer">Schlüssel von diesem Gerät entfernen</button>` : ''}
  `;
  document.getElementById('modal').style.display = 'flex';
}

function saveCloudKey() {
  const val = (document.getElementById('cloud-key-input')?.value || '').trim();
  const type = document.getElementById('cloud-key-type')?.value === 'master' ? 'master' : 'access';
  try {
    if (val) localStorage.setItem(JSONBIN_KEY_STORE, val);
    localStorage.setItem(JSONBIN_KEY_TYPE_STORE, type);
  } catch(e) { setStatus('⚠ Schlüssel konnte nicht gespeichert werden', false); return; }
  closeModal();
  cloudInit();
}

function removeCloudKey() {
  try { localStorage.removeItem(JSONBIN_KEY_STORE); } catch(e) {}
  cloudLoaded = false;
  invalidateExerciseIndex();   // Daten kommen ab jetzt aus dem lokalen Speicher
  closeModal();
  setStatus('Cloud getrennt – nur lokal gespeichert', false);
}

const JSONBIN_API = 'https://api.jsonbin.io/v3/b';
const FIXED_BIN_ID = '6a1d9bd121f9ee59d2a5bc77';
let binId = FIXED_BIN_ID;
let cloudData = {};
let cloudLoaded = false;

async function cloudInit() {
  setStatus('☁ Verbinde…', false);
  await cloudPull();
}

async function cloudPull() {
  if (!getJsonbinKey()) { setStatus('Cloud nicht eingerichtet – nur lokal', false); return; }
  try {
    const res = await fetchWithTimeout(`${JSONBIN_API}/${binId}/latest`, {
      headers: jsonbinAuthHeaders()
    });
    if (!res.ok) { setStatus(`⚠ Cloud-Fehler (${res.status})`, false); return; }
    const data = await res.json();
    cloudData = data.record?.gymbook || {};
    const receivedSize = JSON.stringify(cloudData).length;
    decodeCloudData(cloudData);          // kompakte Cloud-Schreibweise → normale Form
    cloudLoaded = true;
    invalidateExerciseIndex();           // komplett neuer Datenstand

    // Änderungen, die es vor dem letzten Schließen nicht mehr in die Cloud
    // geschafft haben, aus dem lokalen Speicher zurückholen – sonst würde
    // der Serverstand sie stillschweigend überschreiben.
    try {
      const pend = JSON.parse(localStorage.getItem('gymbook:pending') || '[]');
      let restored = 0;
      pend.forEach(k => {
        const raw = localStorage.getItem(k);
        if (raw === null) return;
        try { cloudData[k] = JSON.parse(raw); restored++; } catch(e) {}
      });
      // Offline gelöschte Einträge auch im frisch geladenen Stand löschen
      getDeletedKeys().forEach(k => {
        if (k in cloudData) { delete cloudData[k]; restored++; }
      });
      if (restored) { schedulePush(); }
    } catch(e) {}
    loadUserPlans();
    migratePlanStorage();
    loadActivePlan();
    loadCustomPlan();
    loadCustomCatalog();
    loadPauseSettings();

    // Liegt in der Cloud noch die lange Schreibweise, einmalig kompakt
    // zurückschreiben. Danach ist beides gleich groß – kein weiterer Upload.
    try {
      if (JSON.stringify(compactForCloud(cloudData)).length < receivedSize * 0.95) schedulePush();
    } catch(e) {}

    setStatus('☁ Synchronisiert', true);
    renderNav();
    if (currentTab === 'home') renderHome();
    else { renderPlanSwitcher(); renderDay(); }
  } catch(e) {
    cloudLoaded = false;
    setStatus(`⚠ Offline (${e.message})`, false);
  }
}

// Altlast: frühere Offline-Warteschlange – wird nicht mehr gebraucht, die
// Sicherheitsliste (gymbook:pending) übernimmt das vollständig.
try { localStorage.removeItem('gymbook:offlinequeue'); } catch(e) {}

// fetch hat kein eingebautes Zeitlimit – bei schlechtem Empfang im Gym blieb
// die App sonst minutenlang auf "Synchronisiere…" stehen. Nach Ablauf wird
// die Anfrage abgebrochen und landet im normalen Offline-Zweig (catch).
const CLOUD_TIMEOUT_MS = 15000;
const KEEPALIVE_LIMIT = 60000;   // knapp unter der 64-KB-Grenze für keepalive
function fetchWithTimeout(url, opts) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), CLOUD_TIMEOUT_MS);
  return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
}

// Laufende Ladevorgänge bündeln, damit Start und Push nicht doppelt laden
let cloudPullInFlight = null;
function cloudPullOnce() {
  if (!cloudPullInFlight) cloudPullInFlight = cloudPull().finally(() => { cloudPullInFlight = null; });
  return cloudPullInFlight;
}

// opts.closing: Aufruf beim Schließen/Wegwischen der App (siehe flushPush)
async function cloudPush(opts = {}) {
  if (!binId || !getJsonbinKey()) {
    setStatus('⚠ Kein Cloud-Schlüssel auf diesem Gerät – nur lokal gesichert', false);
    return false;
  }
  // SCHUTZ VOR DATENVERLUST: Der Upload ersetzt den kompletten Cloud-Stand.
  // Wurde die Cloud noch nicht geladen (App offline gestartet, Ladefehler),
  // enthält cloudData nur die Änderungen dieser Sitzung – ein Upload würde
  // die gesamte Historie in der Cloud überschreiben. Deshalb erst laden;
  // klappt das nicht, wird NICHT hochgeladen. Die Änderungen bleiben lokal
  // in der Sicherheitsliste (gymbook:pending) und werden beim nächsten
  // erfolgreichen Laden automatisch übernommen.
  if (!cloudLoaded) {
    // Beim Schließen bleibt keine Zeit, erst zu laden – dann lieber nichts
    // senden. Die Änderungen liegen sicher in der Sicherheitsliste.
    if (opts.closing) return false;
    await cloudPullOnce();
    if (!cloudLoaded) {
      setStatus('⚠ Cloud nicht erreichbar – nur lokal gesichert', false);
      return false;
    }
  }
  const payload = JSON.stringify({ gymbook: compactForCloud(cloudData) });
  try {
    const res = await fetchWithTimeout(`${JSONBIN_API}/${binId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', ...jsonbinAuthHeaders() },
      body: payload,
      // keepalive: Der Browser schickt die Anfrage zu Ende, auch wenn die App
      // gerade geschlossen wird – sonst bricht iOS sie meist ab. Erlaubt sind
      // nur bis 64 KB; bei größeren Daten normal senden (klappt das nicht,
      // holt die Sicherheitsliste es beim nächsten Öffnen nach).
      keepalive: !!opts.closing && payload.length < KEEPALIVE_LIMIT
    });
    // fetch meldet nur Netzwerkausfälle als Fehler, NICHT wenn der Server
    // ablehnt (Datei zu groß, Anfragen aufgebraucht, Schlüssel ungültig).
    // Vorher wurde in diesem Fall die Sicherheitsliste gelöscht und
    // "Gespeichert" angezeigt, obwohl nichts in der Cloud angekommen war.
    if (!res.ok) {
      let msg = '';
      try { msg = (await res.json())?.message || ''; } catch(e) {}
      const reason = /size|large|limit/i.test(msg) ? 'Cloud-Speicher voll'
                   : /request/i.test(msg)         ? 'Cloud-Anfragen aufgebraucht'
                   : `Cloud lehnt ab (${res.status})`;
      setStatus(`⚠ ${reason} – nur lokal gesichert`, false);
      console.warn('cloudPush abgelehnt:', res.status, msg);
      return false;                     // Sicherheitsliste bleibt erhalten
    }
    clearPendingKeys();
    clearDeletedKeys();                 // Löschungen sind jetzt in der Cloud
    return true;
  } catch(e) {
    // Nichts weiter vormerken: Sicherheitsliste und Löschliste bleiben bis
    // zum nächsten erfolgreichen Upload stehen.
    setStatus('⚠ Offline – wird später synchronisiert', false);
    console.warn('Cloud push failed, queued for retry');
    return false;
  }
}

// Verbindung wieder da: Ausstehendes hochladen.
// War die App offline gestartet, wird jetzt zuerst der Cloud-Stand geladen
// (cloudPull übernimmt dabei ausstehende lokale Änderungen und plant den
// Upload selbst ein). Statusmeldung nur bei echtem Erfolg.
window.addEventListener('online', async () => {
  if (!getJsonbinKey()) return;
  setStatus('☁ Synchronisiere…', false);
  if (!cloudLoaded) { await cloudPullOnce(); return; }
  if (getPendingCount() || getDeletedKeys().length) {
    const ok = await cloudPush();
    if (ok) setStatus('☁ Synchronisiert', true);
  } else {
    setStatus('☁ Synchronisiert', true);
  }
});

// Lokal wird SOFORT geschrieben, die Cloud erst nach kurzer Ruhe einmal
// gebündelt. Vorher ging pro Tastendruck eine Anfrage raus – ein Training
// verbrauchte über 120 Anfragen, allein die Notiz eine pro Buchstabe.
const CLOUD_PUSH_DELAY = 4000;
let cloudPushTimer = null;

function markPendingKey(key) {
  try {
    const pend = JSON.parse(localStorage.getItem('gymbook:pending') || '[]');
    if (!pend.includes(key)) {
      pend.push(key);
      localStorage.setItem('gymbook:pending', JSON.stringify(pend));
    }
  } catch(e) {}
}

function clearPendingKeys() {
  try { localStorage.removeItem('gymbook:pending'); } catch(e) {}
}

// Gelöschte Schlüssel, deren Löschung noch nicht in der Cloud angekommen
// ist. Nur lokal ("gymbook_"-Präfix → weder Export noch Upload). Werden nach
// jedem Laden aus der Cloud erneut angewendet und nach erfolgreichem Upload
// geleert.
const DELETED_KEYS_STORE = 'gymbook_deletedKeys';
function getDeletedKeys() {
  try { return JSON.parse(localStorage.getItem(DELETED_KEYS_STORE) || '[]'); } catch(e) { return []; }
}
function markDeletedKeys(keys) {
  try {
    const del = getDeletedKeys();
    keys.forEach(k => { if (!del.includes(k)) del.push(k); });
    localStorage.setItem(DELETED_KEYS_STORE, JSON.stringify(del));
    // Aus der Sicherheitsliste nehmen – dort hätten sie nichts mehr verloren
    const pend = JSON.parse(localStorage.getItem('gymbook:pending') || '[]').filter(k => !keys.includes(k));
    localStorage.setItem('gymbook:pending', JSON.stringify(pend));
  } catch(e) {}
}
function clearDeletedKeys() {
  try { localStorage.removeItem(DELETED_KEYS_STORE); } catch(e) {}
}

// Trainingsdaten (Sätze, Notizen) gehen erst beim "Training beenden" in die
// Cloud – während der Einheit nur lokal. Alles andere (Pläne, Katalog,
// Körpergewicht, Einstellungen) wird wie bisher gebündelt übertragen.
function isDeferredKey(key) {
  return isSessionKey(key) || key.startsWith('gymbook:note:');
}

function storageSet(key, val) {
  // Wird ein zuvor gelöschter Eintrag neu angelegt (Einheit gelöscht, dann
  // am selben Tag neu begonnen), darf die alte Löschung ihn nicht erwischen.
  const del = getDeletedKeys();
  if (del.includes(key)) {
    try { localStorage.setItem(DELETED_KEYS_STORE, JSON.stringify(del.filter(k => k !== key))); } catch(e) {}
  }
  invalidateExerciseIndex();
  cloudData[key] = val;
  localStorage.setItem(key, JSON.stringify(val));   // sofort lokal sichern
  markPendingKey(key);                              // für den Fall eines Absturzes
  if (!isDeferredKey(key)) schedulePush();
}

// Manuell aus dem Menü – überträgt sofort alles, was noch aussteht
async function syncNow() {
  clearTimeout(cloudPushTimer); cloudPushTimer = null;
  setStatus('☁ Synchronisiere…', false);
  const ok = await cloudPush();
  if (ok) setStatus('☁ Synchronisiert', true);
}

// Unberührte Übungen (kein Gewicht, keine Wiederholung, nicht abgehakt,
// nicht übersprungen, Satzzahl nicht geändert) werden nicht mit hochgeladen.
// Die App legt beim Rendern für jede Übung leere Felder an – die kosteten
// bei dir rund ein Drittel des Platzes. Lokal bleibt alles unverändert.
function compactForCloud(data) {
  const out = {};
  Object.entries(data).forEach(([k, v]) => {
    if (!isSessionKey(k) || !v || !v.sets) { out[k] = v; return; }
    const sets = {}, meta = {};
    Object.entries(v.sets).forEach(([ei, slot]) => {
      const touched = arr => (arr || []).some(s => s && (s.weight || s.reps || s.done));
      const used = slot && (slot.skipped || slot.activeSets != null ||
        touched(slot.sets) || touched(slot.warmup));
      if (used) { sets[ei] = slot; if (v.meta?.[ei]) meta[ei] = v.meta[ei]; }
    });
    const copy = { ...v, sets, meta };
    if (!Object.keys(copy.swapped || {}).length) delete copy.swapped;
    if (!Object.keys(copy.swappedIds || {}).length) delete copy.swappedIds;
    out[k] = copy;
  });

  // Zweite Stufe: Einheiten in die kurze Cloud-Schreibweise bringen
  const dict = { list: [], map: {} };
  Object.keys(out).forEach(k => {
    if (!isSessionKey(k)) return;
    const enc = encodeSession(out[k], dict);
    if (enc) out[k] = enc;                 // sonst bleibt die Einheit unverändert
  });
  if (dict.list.length) out['gymbook:exdict'] = dict.list;
  return out;
}

// ── KOMPAKTE ABLAGE DER EINHEITEN IN DER CLOUD ────────────────
// Im Arbeitsspeicher und im lokalen Speicher bleibt alles unverändert. Nur
// für die Cloud wird eine Einheit kürzer geschrieben:
//   Sätze als Text    {"weight":"92.5","reps":"7","done":true}  →  "92.5x7*"
//                     mit RIR {…,"rir":2}                         →  "92.5x7~2*"
//   Aufwärmsätze      genauso, im Feld "w" des Slots
//   Übungsnamen       statt in jeder Einheit einmal in einem Verzeichnis
// Beim Laden wird alles zurückübersetzt (decodeCloudData). Jede Einheit wird
// direkt nach dem Verkürzen zurückgerechnet und mit dem Original verglichen –
// weicht auch nur ein Zeichen ab, bleibt sie unverkürzt.
const SET_VALUE_RE = /^[0-9.]*$/;

// Vergleich unabhängig von der Reihenfolge der Schlüssel
function canon(o) {
  if (Array.isArray(o)) return '[' + o.map(canon).join(',') + ']';
  if (o && typeof o === 'object') {
    return '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + canon(o[k])).join(',') + '}';
  }
  return JSON.stringify(o) ?? 'undefined';
}

function encodeSession(v, dict) {
  if (!v || typeof v !== 'object' || !v.sets || typeof v.sets !== 'object' || Array.isArray(v.sets)) return null;
  if ('s' in v || 'm' in v || '_f' in v) return null;           // Schlüssel würden kollidieren

  const added = [];
  const ref = (id, name) => {
    const key = id + '\u0001' + name;
    if (!(key in dict.map)) { dict.map[key] = dict.list.length; dict.list.push([id, name]); added.push(key); }
    return dict.map[key];
  };
  const rollback = () => { added.reverse().forEach(key => { delete dict.map[key]; dict.list.pop(); }); };
  const fail = () => { rollback(); return null; };

  // Liste von Sätzen → "92.5x7~2*,90x8" (null = nicht darstellbar)
  const encList = arr => {
    if (!Array.isArray(arr)) return null;
    const toks = [];
    for (const st of arr) {
      if (!st || typeof st !== 'object') return null;
      if (Object.keys(st).some(k => k !== 'weight' && k !== 'reps' && k !== 'done' && k !== 'rir')) return null;
      if (typeof st.weight !== 'string' || typeof st.reps !== 'string' || typeof st.done !== 'boolean') return null;
      if (!SET_VALUE_RE.test(st.weight) || !SET_VALUE_RE.test(st.reps)) return null;
      if (st.rir !== undefined && !(Number.isInteger(st.rir) && st.rir >= 0 && st.rir <= 9)) return null;
      toks.push(st.weight + 'x' + st.reps + (st.rir !== undefined ? '~' + st.rir : '') + (st.done ? '*' : ''));
    }
    return toks.join(',');
  };

  try {
    const s = {};
    for (const [ei, slot] of Object.entries(v.sets)) {
      if (!slot || typeof slot !== 'object' || !Array.isArray(slot.sets)) return fail();
      if (Object.keys(slot).some(k => k !== 'sets' && k !== 'activeSets' && k !== 'skipped' && k !== 'warmup')) return fail();
      const str = encList(slot.sets);
      if (str === null) return fail();
      const extras = {};
      if (slot.activeSets !== undefined) extras.a = slot.activeSets;
      if (slot.skipped !== undefined) extras.k = slot.skipped;
      if (slot.warmup !== undefined) {
        const w = encList(slot.warmup);
        if (w === null) return fail();
        extras.w = w;
      }
      s[ei] = Object.keys(extras).length ? { s: str, ...extras } : str;
    }
    const enc = { _f: 2, s };
    if (v.meta !== undefined) {
      if (!v.meta || typeof v.meta !== 'object') return fail();
      const m = {};
      for (const [ei, mm] of Object.entries(v.meta)) {
        if (!mm || typeof mm.id !== 'string' || typeof mm.name !== 'string' || Object.keys(mm).length !== 2) return fail();
        m[ei] = ref(mm.id, mm.name);
      }
      enc.m = m;
    }
    Object.keys(v).forEach(k => { if (k !== 'sets' && k !== 'meta') enc[k] = v[k]; });

    // Selbstprüfung – über den echten Übertragungsweg (Text und zurück)
    const back = decodeSession(JSON.parse(JSON.stringify(enc)), JSON.parse(JSON.stringify(dict.list)));
    if (canon(back) !== canon(v)) return fail();
    return enc;
  } catch (e) { return fail(); }
}

function decodeSession(enc, list) {
  if (!enc || enc._f !== 2) return enc;
  const sets = {};
  const decList = str => str === '' ? [] : str.split(',').map(tok => {
    const done = tok.endsWith('*');
    let t = done ? tok.slice(0, -1) : tok;
    let rir;
    const r = t.indexOf('~');
    if (r >= 0) { rir = parseInt(t.slice(r + 1), 10); t = t.slice(0, r); }
    const i = t.indexOf('x');
    const st = { weight: t.slice(0, i), reps: t.slice(i + 1), done };
    if (rir !== undefined) st.rir = rir;
    return st;
  });
  Object.entries(enc.s || {}).forEach(([ei, e]) => {
    const str = typeof e === 'string' ? e : (e.s || '');
    const slot = { sets: decList(str) };
    if (e && typeof e === 'object') {
      if (e.a !== undefined) slot.activeSets = e.a;
      if (e.k !== undefined) slot.skipped = e.k;
      if (e.w !== undefined) slot.warmup = decList(e.w);
    }
    sets[ei] = slot;
  });
  const out = { sets };
  if (enc.m) {
    out.meta = {};
    Object.entries(enc.m).forEach(([ei, idx]) => {
      const p = list[idx];
      // Fehlt der Verzeichniseintrag (dürfte nie vorkommen), gehen die SÄTZE
      // trotzdem nicht verloren – nur der Name ist dann nicht lesbar. Wichtig,
      // dass die Einheit danach in der normalen Form vorliegt, sonst würde
      // sie beim nächsten Upload mit falschem Verzeichnis zurückgeschrieben.
      out.meta[ei] = p ? { id: p[0], name: p[1] } : { id: 'unbekannt', name: '(Name nicht lesbar)' };
    });
  }
  Object.keys(enc).forEach(k => { if (k !== '_f' && k !== 's' && k !== 'm') out[k] = enc[k]; });
  return out;
}

// Beim Laden aus der Cloud alles zurück in die normale Form übersetzen.
function decodeCloudData(data) {
  const list = Array.isArray(data['gymbook:exdict']) ? data['gymbook:exdict'] : [];
  delete data['gymbook:exdict'];
  Object.keys(data).forEach(k => {
    const v = data[k];
    if (v && typeof v === 'object' && v._f === 2) {
      try { data[k] = decodeSession(v, list); }
      catch (e) { console.error('Einheit nicht lesbar:', k, e); }
    }
  });
  return data;
}

// Wie viel liegt noch nur lokal?
function getPendingCount() {
  try { return JSON.parse(localStorage.getItem('gymbook:pending') || '[]').length; }
  catch(e) { return 0; }
}

function schedulePush() {
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(() => cloudPush(), CLOUD_PUSH_DELAY);
}

// Vor dem Schließen/Wegwischen der App sofort übertragen, damit nichts
// nur lokal liegen bleibt.
function flushPush() {
  if (cloudPushTimer) {
    clearTimeout(cloudPushTimer);
    cloudPushTimer = null;
    cloudPush({ closing: true });
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushPush(); });
window.addEventListener('pagehide', flushPush);

function storageGet(key) {
  if (cloudLoaded && cloudData[key] !== undefined) return cloudData[key];
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}

function storageGetAllKeys() {
  if (cloudLoaded) return Object.keys(cloudData).filter(k => k.startsWith('gymbook:') && k !== 'gymbook:binId');
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('gymbook:') && k !== 'gymbook:binId') keys.push(k);
  }
  return keys;
}

// Namensräume die KEINE Trainingseinheit sind, aber dieselbe Key-Form
// (gymbook:<name>:<etwas>) haben könnten. Ohne diese Liste wurde z.B.
// "gymbook:bodyweight:2026-08-07" fälschlich als Trainingseinheit gewertet
// und tauchte als Punkt im Kalender auf.
const NON_SESSION_NAMESPACES = [
  'customplan', 'customcatalog', 'pausesettings', 'offlinequeue',
  'userplans', 'activeplan', 'bodyweight', 'note', 'binId', 'timerEnabled'
];

// Einzige Wahrheit dafür, was als gespeicherte Trainingseinheit zählt.
function isSessionKey(k) {
  const p = k.split(':');
  return p.length === 3 && !NON_SESSION_NAMESPACES.includes(p[1]);
}

// Alle Trainingseinheiten; mit onlyCompleted nur abgeschlossene.
// Session-Keys haben die Form gymbook:<tag>:<datum>. Ein reines .sort()
// sortiert deshalb nach TAGESNAME und erst danach nach Datum – "die letzte
// Einheit" war so nicht die neueste, sondern die des alphabetisch letzten
// Tages. Immer hierüber sortieren.
function sortByDate(keys, desc) {
  return keys.slice().sort((a, b) => {
    const da = a.split(':')[2] || '', db = b.split(':')[2] || '';
    return desc ? db.localeCompare(da) : da.localeCompare(db);
  });
}

function getSessionKeys(onlyCompleted) {
  const keys = storageGetAllKeys().filter(isSessionKey);
  return onlyCompleted ? keys.filter(k => storageGet(k)?.completed === true) : keys;
}

function setStatus(msg, ok) {
  const trySet = () => {
    const el = document.getElementById('save-status');
    if (el) {
      el.textContent = msg;
      el.className = ok ? 'save-status saved' : 'save-status';
    } else {
      setTimeout(trySet, 100);
    }
  };
  trySet();
}
// ─────────────────────────────────────────────────────────────

function loadSessionData() {
  const day = DAYS[currentDay];
  const date = activeDateStr();
  const existing = storageGet(getKey(day.id, date));
  sessionData = {};
  swappedExercises = {};
  swappedExerciseIds = {};
  sessionSupersets = null;
  if (existing) {
    if (existing.sets) {
      sessionData = existing.sets;
      swappedExercises = existing.swapped || {};
      swappedExerciseIds = existing.swappedIds || {};
      sessionSupersets = Array.isArray(existing.supersets) ? existing.supersets : null;
    } else {
      sessionData = existing;
    }
  }
  // Jede Übung des Tages muss einen Eintrag mit Satz-Feldern haben. Beim
  // Hochladen werden unberührte Übungen weggelassen (spart Platz) – beim
  // Laden werden sie hier wieder ergänzt. Ohne das würden zahlreiche Stellen,
  // die sessionData[ei].sets direkt ansprechen, ins Leere greifen.
  day.exercises.forEach((ex, ei) => {
    if (!sessionData[ei]) sessionData[ei] = { sets: [] };
    if (!Array.isArray(sessionData[ei].sets)) sessionData[ei].sets = [];
    const target = sessionData[ei].activeSets != null ? sessionData[ei].activeSets : ex.sets;
    while (sessionData[ei].sets.length < target) {
      sessionData[ei].sets.push({ weight: '', reps: '', done: false });
    }
  });
}

function saveSession() {
  const day = DAYS[currentDay];
  const date = activeDateStr();
  collectInputValues();

  // Record id + name for every slot (swapped or plan-default) so future
  // lookups are fully self-contained — independent of whichever plan/DAYS
  // structure is active later.
  const slotMeta = {};
  day.exercises.forEach((ex, ei) => {
    slotMeta[ei] = {
      id: swappedExerciseIds[ei] || ex.id || slugify(ex.name),
      name: swappedExercises[ei] || ex.name
    };
  });

  // Startzeitpunkt mitspeichern: sessionStartTime lebt nur im Arbeitsspeicher
  // und ginge beim Schließen der App verloren – die gemessene Dauer wäre dann
  // zu kurz und würde die gelernte Schätzung verfälschen.
  const prev = storageGet(getKey(day.id, date)) || {};
  const startedAt = prev.startedAt || (sessionStartTime || Date.now());

  // Altbestand bereinigen: Einheiten, in denen früher Sätze nur ausgeblendet
  // statt entfernt wurden, beim nächsten Speichern auf die echte Satzzahl kürzen.
  Object.values(sessionData).forEach(slot => {
    if (slot && slot.activeSets != null && Array.isArray(slot.sets) && slot.sets.length > slot.activeSets) {
      slot.sets.length = slot.activeSets;
    }
  });

  storageSet(getKey(day.id, date), {
    sets: sessionData, swapped: swappedExercises, swappedIds: swappedExerciseIds,
    meta: slotMeta, startedAt,
    ...(Array.isArray(sessionSupersets) ? { supersets: sessionSupersets } : {}),
    ...(prev.completed ? { completed: true } : {}),
    ...(prev.durationMin ? { durationMin: prev.durationMin, setsDone: prev.setsDone } : {})
  });
  dirty = false;
  const el = document.getElementById('save-status');
  const isBack = date !== todayStr();
  el.textContent = `Gespeichert — ${formatDate(date)}${isBack ? ' (nachgetragen)' : ''}`;
  el.className = 'save-status saved';
  setTimeout(() => { el.textContent = 'Alle Änderungen gespeichert'; }, 2500);
}

function collectInputValues() {
  const day = DAYS[currentDay];
  day.exercises.forEach((ex, ei) => {
    const activeSets = (sessionData[ei] && sessionData[ei].activeSets != null)
      ? sessionData[ei].activeSets : ex.sets;
    for (let s = 0; s < activeSets; s++) {
      const wEl = document.getElementById(`w-${ei}-${s}`);
      const rEl = document.getElementById(`r-${ei}-${s}`);
      if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
      if (wEl) sessionData[ei].sets[s].weight = wEl.value;
      if (rEl) sessionData[ei].sets[s].reps = rEl.value;
    }
    // Aufwärmsätze (nur die gerade angezeigten haben Eingabefelder)
    (sessionData[ei]?.warmup || []).forEach((w, k) => {
      const wEl = document.getElementById(`ww-${ei}-${k}`);
      const rEl = document.getElementById(`wr-${ei}-${k}`);
      if (wEl) w.weight = wEl.value;
      if (rEl) w.reps = rEl.value;
    });
  });
}

function getLastEntry(dayId, exIndex) {
  // Legacy fallback by index
  const date = activeDateStr();
  const keys = sortByDate(storageGetAllKeys()
    .filter(k => k.startsWith(`gymbook:${dayId}:`) && !k.endsWith(date)), true);
  if (!keys.length) return null;
  const raw = storageGet(keys[0]);
  if (!raw) return null;
  const sets = raw.sets || raw;
  if (!sets[exIndex]) return null;
  return sets[exIndex].sets;
}

// ── ID-BASIERTE HISTORIE (plan-übergreifend) ──────────────────
// Sucht über ALLE Tage/Pläne hinweg nach der letzten Session für eine
// Übungs-ID. Fällt für alte Einträge ohne gespeicherte ID auf den
// namensbasierten Weg zurück (nur innerhalb des aktuell aktiven Plans).
// Eine Übung gilt nur dann als "trainiert", wenn mindestens ein Satz ein
// Gewicht ODER Wiederholungen enthält. Wichtig: beim Rendern eines Tages
// werden für JEDE Übung leere Satz-Slots angelegt und mitgespeichert – ohne
// diese Prüfung würde eine Session, in der die Übung nur angezeigt (aber
// nicht ausgeführt) wurde, die echte letzte Einheit verdecken.
function hasLoggedData(sets) {
  return Array.isArray(sets) && sets.some(s => s && (s.weight || s.reps));
}

// Nur die Sätze, in denen tatsächlich etwas steht – Gewicht ODER Wiederholungen.
// Körpergewichtsübungen (Klimmzüge, Beinheben, Dips …) haben kein Gewicht und
// würden sonst überall als "nicht trainiert" gelten.
function loggedSets(sets) {
  return Array.isArray(sets) ? sets.filter(s => s && (s.weight || s.reps)) : [];
}

// Einheitliche Darstellung eines Satzes: "80kg×8" bzw. "12 Wdh." ohne Gewicht.
function formatSet(s, opts) {
  const long = opts && opts.long;
  const rir = s.rir !== undefined ? ` · RIR ${s.rir === 4 ? '4+' : s.rir}` : '';
  const sep = long ? ' kg × ' : 'kg×';
  if (s.weight) return `${s.weight}${sep}${s.reps || '?'}${long ? ' Wdh.' : ''}${rir}`;
  return `${s.reps || '?'} Wdh.${rir}`;
}

// Geschätztes Maximalgewicht für 1 Wiederholung (Epley-Formel). Macht Sätze
// mit unterschiedlichen Wiederholungszahlen vergleichbar: 80 kg × 10 ergibt
// ≈ 107 kg und schlägt damit 82,5 kg × 5 (≈ 96 kg). Über 12 Wdh. wird die
// Formel ungenau – dann wird mit 12 gerechnet. Ergebnis auf 0,5 kg gerundet.
function e1rm(weight, reps) {
  const w = parseFloat(weight), r = parseInt(reps, 10);
  if (!(w > 0) || !(r > 0)) return 0;
  const est = r === 1 ? w : w * (1 + Math.min(r, 12) / 30);
  return Math.round(est * 2) / 2;
}
function bestE1rm(sets) {
  return Math.max(0, ...(sets || []).map(s => e1rm(s?.weight, s?.reps)));
}

// Bester Wert einer Übung für Listenanzeigen: kg wenn vorhanden, sonst Wdh.
function bestSetValue(sets) {
  const logged = loggedSets(sets);
  if (!logged.length) return null;
  const withWeight = logged.filter(s => s.weight);
  if (withWeight.length) return { value: Math.max(...withWeight.map(s => parseFloat(s.weight))), unit: 'kg' };
  const reps = logged.map(s => parseInt(s.reps)).filter(n => !isNaN(n));
  return reps.length ? { value: Math.max(...reps), unit: 'Wdh.' } : null;
}

// ── ÜBUNGS-INDEX ──────────────────────────────────────────────
// Vorher ging jede Abfrage (letzte Einheit, Bestleistung, Verlauf) ALLE
// Einheiten durch und sortierte sie neu – im Übungen-Tab für jede der rund
// 80 Übungen zweimal, und das bei jedem Buchstaben in der Suche. Jetzt wird
// einmal ein Verzeichnis "Übung → ihre Einträge, neueste zuerst" gebaut und
// erst neu erstellt, wenn sich Daten ändern (invalidateExerciseIndex).
//   byId:   Einheiten mit meta (Übungs-ID gespeichert, plan-unabhängig)
//   byName: Altbestand ohne meta – über Namen + aktuellen Plan (DAYS)
let exerciseIndex = null;
function invalidateExerciseIndex() { exerciseIndex = null; }

function getExerciseIndex() {
  // DAYS-Wechsel (anderer Plan) betrifft die Zuordnung des Altbestands
  if (exerciseIndex && exerciseIndex.days === DAYS) return exerciseIndex;
  const byId = {}, byName = {};
  const add = (map, k, entry) => { (map[k] = map[k] || []).push(entry); };
  sortByDate(getSessionKeys(), true).forEach(key => {
    const raw = storageGet(key);
    if (!raw) return;
    const sets = raw.sets || raw;
    const date = key.split(':')[2];
    if (raw.meta) {
      for (const ei in raw.meta) {
        if (Array.isArray(sets[ei]?.sets)) add(byId, raw.meta[ei].id, { key, date, sets: sets[ei].sets });
      }
    } else {
      const day = DAYS.find(d => d.id === key.split(':')[1]);
      if (!day) return;
      const swapped = raw.swapped || {};
      day.exercises.forEach((ex, ei) => {
        if (Array.isArray(sets[ei]?.sets)) add(byName, swapped[ei] || ex.name, { key, date, sets: sets[ei].sets });
      });
    }
  });
  exerciseIndex = { days: DAYS, byId, byName, merged: {} };
  return exerciseIndex;
}

// Alle Einträge einer Übung (ID-Treffer + Altbestand per Name), neueste zuerst
function getExerciseEntries(exerciseId, exerciseName) {
  const idx = getExerciseIndex();
  const cacheKey = exerciseId + '\u0001' + exerciseName;
  if (!idx.merged[cacheKey]) {
    const list = (idx.byId[exerciseId] || []).concat(idx.byName[exerciseName] || []);
    idx.merged[cacheKey] = list.sort((a, b) => b.date.localeCompare(a.date));
  }
  return idx.merged[cacheKey];
}

// Die letzten `count` Einheiten mit echten Einträgen, ohne das aktive Datum
// (je Einheit nur der erste passende Slot)
function getLastEntriesById(exerciseId, exerciseName, count) {
  const date = activeDateStr();
  const results = [], seen = new Set();
  for (const e of getExerciseEntries(exerciseId, exerciseName)) {
    if (results.length >= count) break;
    if (e.date === date || seen.has(e.key) || !hasLoggedData(e.sets)) continue;
    seen.add(e.key);
    results.push(e.sets);
  }
  return results;
}

function getLastEntryById(exerciseId, exerciseName) {
  return getLastEntriesById(exerciseId, exerciseName, 1)[0] || null;
}

// excludeKey: diese Einheit nicht mitzählen. Für die Rekord-Meldung nötig –
// die laufende Einheit ist beim Abhaken schon gespeichert, ohne Ausschluss
// wurde das neue Gewicht mit sich selbst verglichen und war nie größer.
function getPersonalRecordById(exerciseId, exerciseName, excludeKey) {
  let best = 0;
  getExerciseEntries(exerciseId, exerciseName).forEach(e => {
    if (e.key === excludeKey) return;
    e.sets.forEach(s => { const w = parseFloat(s?.weight); if (!isNaN(w) && w > best) best = w; });
  });
  return best;
}

// Bestes geschätztes 1RM über alle Einheiten (excludeKey wie oben)
function getBestE1rmById(exerciseId, exerciseName, excludeKey) {
  let best = 0;
  getExerciseEntries(exerciseId, exerciseName).forEach(e => {
    if (e.key !== excludeKey) best = Math.max(best, bestE1rm(e.sets));
  });
  return best;
}

// Stagnation: Die letzten 3 Einheiten waren nicht besser als die davor.
// Gemessen am besten geschätzten 1RM je Einheit, bei Übungen ohne Gewicht
// an den meisten Wiederholungen. Braucht mindestens 4 Einheiten.
function getStagnation(exerciseId, exerciseName) {
  const sessions = getLastEntriesById(exerciseId, exerciseName, 4);
  if (sessions.length < 4) return null;
  const score = sets => bestE1rm(sets) || Math.max(0, ...loggedSets(sets).map(s => parseInt(s.reps, 10) || 0));
  const [a, b, c, before] = sessions.map(score);
  if (!before) return null;
  return Math.max(a, b, c) <= before ? { sessions: 3, value: before } : null;
}

function adjustReps(ei, s, delta) {
  const input = document.getElementById(`r-${ei}-${s}`);
  if (!input) return;
  const current = parseInt(input.value) || parseInt(input.placeholder) || 0;
  const newVal = Math.max(0, current + delta);
  input.value = newVal;
  if (!sessionData[ei]) sessionData[ei] = { sets: [] };
  if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
  sessionData[ei].sets[s].reps = String(newVal);
  autoSave();
}

function adjustWeight(ei, s, delta) {
  const input = document.getElementById(`w-${ei}-${s}`);
  if (!input) return;
  const current = parseFloat(input.value) || parseFloat(input.placeholder) || 0;
  const newVal = Math.max(0, Math.round((current + delta) * 100) / 100);
  input.value = newVal;
  if (!sessionData[ei]) sessionData[ei] = { sets: [] };
  if (!sessionData[ei].sets[s]) sessionData[ei].sets[s] = { weight: '', reps: '', done: false };
  sessionData[ei].sets[s].weight = String(newVal);
  autoSave();
}

function adjustSets(ei, delta) {
  collectInputValues();   // gerade getippte Werte berücksichtigen
  const ex = DAYS[currentDay].exercises[ei];
  if (!sessionData[ei]) sessionData[ei] = { sets: [], activeSets: ex.sets };
  const current = sessionData[ei].activeSets != null ? sessionData[ei].activeSets : ex.sets;
  let next;
  if (delta === 0) {
    next = ex.sets; // reset to plan
  } else {
    next = Math.max(1, Math.min(current + delta, 8));
  }
  // Wegfallende Sätze wirklich entfernen. Vorher blieben sie unsichtbar im
  // Array und zählten weiter für Rekorde, Verlauf, Volumen und Satzanzahl.
  const dropped = sessionData[ei].sets.slice(next);
  if (dropped.some(st => st && (st.weight || st.reps || st.done))) {
    if (!confirm(`Der entfernte Satz enthält Einträge. Trotzdem entfernen?`)) return;
  }
  sessionData[ei].sets.length = Math.min(sessionData[ei].sets.length, next);
  sessionData[ei].activeSets = next;
  // Pad sets array if needed
  while (sessionData[ei].sets.length < next) {
    sessionData[ei].sets.push({ weight: '', reps: '', done: false });
  }
  autoSave();
  renderDay();
  reopenCard(ei);
}

function slugify(name) {
  let s = name.toLowerCase();
  s = s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  s = s.replace(/[^a-z0-9]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
  return s;
}

function makeUniqueId(baseId, existingIds) {
  let id = baseId;
  let i = 2;
  while (existingIds.has(id)) { id = `${baseId}_${i}`; i++; }
  return id;
}

// Farben je Muskelgruppe (Katalog-Schlüssel) – Kartenrand und Statistik
const MUSCLE_COLORS = {
  brust:   '#e87f7f',  // Rot
  trizeps: '#e8a060',  // Orange/Koralle
  ruecken: '#7fb8e8',  // Blau
  bizeps:  '#5dcaa5',  // Türkis
  schulter:'#9b7fe8',  // Lila
  beine:   '#e8b87f',  // Orange warm
  bauch:   '#c9a84c'   // Gold

// Muskelgruppe einer Übung als Katalog-Schlüssel (brust, ruecken, …) oder
// null. Reihenfolge: exakt per ID im Katalog, dann per Namensteil (z. B.
// "Brustpresse Maschine (anderer Winkel)"), zuletzt über das Muskelfeld
// des Plans.
function muscleCategory(id, name, muscleText) {
  const cats = Object.entries(CATALOG);
  for (const [key, cat] of cats) if (cat.exercises.some(e => e?.id === id)) return key;
  const n = (name || '').toLowerCase();
  if (n) for (const [key, cat] of cats) {
    if (cat.exercises.some(e => e?.name && (n.includes(e.name.toLowerCase()) || e.name.toLowerCase().includes(n)))) return key;
  }
  const m = (muscleText || '').toLowerCase();
  if (m.includes('trizeps')) return 'trizeps';
  if (m.includes('bizeps') || m.includes('brachialis')) return 'bizeps';
  if (m.includes('brust')) return 'brust';
  if (m.includes('rücken') || m.includes('lat')) return 'ruecken';
  if (m.includes('schulter')) return 'schulter';
  if (m.includes('bein') || m.includes('waden') || m.includes('gluteus') || m.includes('hamstring') || m.includes('quadrizeps')) return 'beine';
  if (m.includes('bauch')) return 'bauch';
  return null;
}

function getMuscleCategoryForExercise(exerciseName) {
  for (const [key, cat] of Object.entries(CATALOG)) {
    if (cat.exercises.some(e => e.name === exerciseName)) return key;
  }
  return 'brust';
}

function getExerciseIdByName(exerciseName) {
  for (const cat of Object.values(CATALOG)) {
    const found = cat.exercises.find(e => e.name === exerciseName);
    if (found) return found.id;
  }
  return null;
}

function deleteFromCatalog(name, event) {

  if (!confirm(`"${name}" aus dem Katalog entfernen?`)) return;
  const key = catalogActiveMuscle;
  const idx = CATALOG[key].exercises.findIndex(e => e.name === name);
  if (idx > -1) {
    CATALOG[key].exercises.splice(idx, 1);
    saveCustomCatalog();
    renderCatalog();
  }
}

function applySwap(ei, altName, altId) {
  // Save scroll position before re-render
  const scrollY = document.getElementById('main-content')?.scrollTop || window.scrollY;
  const resolvedId = altId || getExerciseIdByName(altName) || slugify(altName);

  if (catalogEditMode) {
    const di = catalogTargetDi;
    let muscle = DAYS[di].exercises[ei].muscle;
    for (const [key, cat] of Object.entries(CATALOG)) {
      if (cat.exercises.some(e => e.name === altName)) { muscle = cat.label; break; }
    }
    if (editDraft) {
      editDraft[di].exercises[ei].name = altName;
      editDraft[di].exercises[ei].muscle = muscle;
      editDraft[di].exercises[ei].id = resolvedId;
    }
    DAYS[di].exercises[ei].name = altName;
    DAYS[di].exercises[ei].muscle = muscle;
    DAYS[di].exercises[ei].id = resolvedId;
    catalogEditMode = false;
    closeCatalog();
    renderDay();
    return;
  }
  swappedExercises[ei] = altName;
  swappedExerciseIds[ei] = resolvedId;
  autoSave();
  closeCatalog();
  renderDay();
  // Scrollposition wiederherstellen und Karte wieder öffnen
  setTimeout(() => window.scrollTo(0, scrollY), 10);
  reopenCard(ei);
}

function resetSwap(ei) {
  delete swappedExercises[ei];
  delete swappedExerciseIds[ei];
  autoSave();
  renderDay();
  reopenCard(ei);
}
