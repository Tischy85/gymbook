// ── PLAN EDITOR ───────────────────────────────────────────────
let editMode = false;
let editDraft = null;
let catalogTargetDi = 0;
let catalogEditMode = false;

// Zustand vor dem Bearbeiten. editDraft taugt dafür nicht: Löschen und
// Anhängen verändern ihn parallel zu DAYS, er ist also kein Original.
// Ohne Rückstellung blieb eine "abgebrochene" Änderung im Arbeitsspeicher
// und wurde beim nächsten Speichern still mitgeschrieben.
let editSnapshot = null;

// Ursprüngliche Übungs-OBJEKTE je Tag (keine Kopien). Umsortieren und Löschen
// verschieben dieselben Objekte, Tauschen ändert sie an Ort und Stelle – so
// lässt sich beim Speichern für jede neue Position die alte bestimmen.
let editOrigRefs = null;

// Die Sätze einer Einheit hängen am Index der Übung. Nach Umsortieren oder
// Löschen im Plan landeten bereits eingetragene Sätze der gewählten Einheit
// sonst bei der falschen Übung. Hier wird die Einheit am aktiven Datum für
// jeden geänderten Tag auf die neue Reihenfolge umgeschrieben.
function getPlanEditRemaps() {
  if (!editOrigRefs) return [];
  const date = activeDateStr();
  const remaps = [];
  DAYS.forEach((day, di) => {
    const orig = editOrigRefs[di] || [];
    const newToOld = day.exercises.map(ex => orig.indexOf(ex));
    const unchanged = newToOld.length === orig.length && newToOld.every((oi, ni) => oi === ni);
    if (unchanged) return;
    const key = getKey(day.id, date);
    const raw = storageGet(key);
    if (!raw || !raw.sets) return;
    // Übungen, die gelöscht wurden, aber heute schon Einträge hatten
    const lost = orig.map((ex, oi) => oi).filter(oi => !newToOld.includes(oi) && raw.sets[oi]
      && (raw.sets[oi].skipped || loggedSets(raw.sets[oi].sets).length));
    remaps.push({ key, raw, newToOld, lost: lost.length });
  });
  return remaps;
}

function applyPlanEditRemaps(remaps) {
  remaps.forEach(({ key, raw, newToOld }) => {
    const remap = obj => {
      const out = {};
      newToOld.forEach((oi, ni) => { if (oi >= 0 && obj && obj[oi] !== undefined) out[ni] = obj[oi]; });
      return out;
    };
    const updated = {
      ...raw,
      sets: remap(raw.sets),
      swapped: remap(raw.swapped || {}),
      swappedIds: remap(raw.swappedIds || {}),
      meta: remap(raw.meta || {})
    };
    // Supersätze dieser Einheit auf die neuen Positionen umrechnen; Paare mit
    // einer gelöschten Übung fallen weg
    if (Array.isArray(raw.supersets)) {
      const oldToNew = i => newToOld.indexOf(i);
      updated.supersets = raw.supersets
        .map(([a, b]) => [oldToNew(a), oldToNew(b)])
        .filter(([a, b]) => a >= 0 && b >= 0)
        .map(([a, b]) => [Math.min(a, b), Math.max(a, b)]);
    }
    storageSet(key, updated);
  });
}

function discardPlanEdits() {
  if (editSnapshot) {
    editSnapshot.forEach((day, di) => { if (DAYS[di]) DAYS[di].exercises = day.exercises; });
  }
  editSnapshot = null;
  editOrigRefs = null;
  editDraft = null;
  editMode = false;
  invalidateExerciseIndex();   // Übungsnamen sind wieder die alten
  const btn = document.getElementById('edit-plan-btn');
  if (btn) { btn.classList.remove('active'); btn.textContent = '✏ Plan'; }
}

function toggleEditMode() {
  const btn = document.getElementById('edit-plan-btn');
  if (!editMode) {
    editMode = true;
    editSnapshot = JSON.parse(JSON.stringify(DAYS));
    editOrigRefs = DAYS.map(d => d.exercises.slice());
    editDraft = JSON.parse(JSON.stringify(DAYS));
    btn.classList.add('active');
    btn.textContent = '× Abbrechen';
  } else {
    discardPlanEdits();            // Abbrechen = alles zurück
  }
  renderDay();
}

async function saveCustomPlan() {
  if (!editDraft) return;
  // Vor dem Speichern prüfen, ob dadurch heute eingetragene Sätze wegfallen
  const remaps = getPlanEditRemaps();
  const lostCount = remaps.reduce((n, r) => n + r.lost, 0);
  if (lostCount && !confirm(`${lostCount} gelöschte Übung(en) haben in der Einheit vom ${formatDate(activeDateStr())} schon Einträge. Diese Einträge werden entfernt. Trotzdem speichern?`)) return;
  // Collect field values from DOM
  DAYS.forEach((day, di) => {
    day.exercises.forEach((ex, ei) => {
      const setsEl = document.getElementById(`edit-sets-${di}-${ei}`);
      const repsEl = document.getElementById(`edit-reps-${di}-${ei}`);
      const pauseEl = document.getElementById(`edit-pause-${di}-${ei}`);
      const stepEl = document.getElementById(`edit-step-${di}-${ei}`);
      const warmEl = document.getElementById(`edit-warmup-${di}-${ei}`);
      if (warmEl) editDraft[di].exercises[ei].warmup = warmEl.value === '' ? undefined : parseInt(warmEl.value, 10);
      const ssEl = document.getElementById(`edit-ss-${di}-${ei}`);
      if (document.getElementById(`edit-sets-${di}-${ei}`)) editDraft[di].exercises[ei].superset = !!ssEl?.checked;
      if (setsEl) editDraft[di].exercises[ei].sets = parseInt(setsEl.value) || ex.sets;
      if (repsEl) editDraft[di].exercises[ei].reps = repsEl.value || ex.reps;
      if (pauseEl) editDraft[di].exercises[ei].pause = pauseEl.value || ex.pause;
      if (stepEl) editDraft[di].exercises[ei].step = parseFloat(stepEl.value) || 2.5;
    });
  });
  // Apply to DAYS
  editDraft.forEach((day, di) => {
    day.exercises.forEach((ex, ei) => {
      if (!DAYS[di].exercises[ei]) return;
      DAYS[di].exercises[ei].name   = ex.name;
      DAYS[di].exercises[ei].muscle = ex.muscle;
      DAYS[di].exercises[ei].sets   = ex.sets;
      DAYS[di].exercises[ei].reps   = ex.reps;
      DAYS[di].exercises[ei].pause  = ex.pause;
      if (ex.step) DAYS[di].exercises[ei].step = ex.step;
      if (Number.isInteger(ex.warmup)) DAYS[di].exercises[ei].warmup = ex.warmup;
      else delete DAYS[di].exercises[ei].warmup;          // zurück auf "Auto"
      if (ex.superset) DAYS[di].exercises[ei].superset = true;
      else delete DAYS[di].exercises[ei].superset;
    });
  });

  persistActivePlan();
  saveCustomCatalog();
  applyPlanEditRemaps(remaps);   // Sätze der Einheit an die neue Reihenfolge anpassen

  // Exit edit mode cleanly – Änderungen gelten jetzt, kein Zurückstellen mehr
  editSnapshot = null;
  editOrigRefs = null;
  editMode = false;
  editDraft = null;
  const btn = document.getElementById('edit-plan-btn');
  if (btn) { btn.classList.remove('active'); btn.textContent = '✏ Plan'; }

  setStatus('Plan gespeichert ✓', true);
  renderNav();
  renderDay();
  setTimeout(() => setStatus('☁ Synchronisiert', true), 2000);
}

// Wie viele Einheiten der Plan pro Woche vorsieht. Früher aus den festen
// Wochentagen abgeleitet – jetzt eine reine Zielzahl, weil die Reihenfolge
// rotiert statt an Kalendertagen zu hängen.
// Kalenderwoche (ISO) als Schlüssel, damit sich Einheiten gruppieren lassen
function isoWeekKey(dateStr) {
  const d = parseLocalDate(dateStr);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));   // auf Donnerstag der Woche
  const week1 = new Date(d.getFullYear(), 0, 4);
  const week = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return `${d.getFullYear()}-${String(week).padStart(2,'0')}`;
}

// Streak = Wochen IN FOLGE, in denen das Wochenziel erreicht wurde.
// Vorher wurden schlicht Einheiten gezählt, solange zwischen zweien höchstens
// sieben Tage lagen – vier volle Wochen ergaben dann 12 statt 4.
// Die laufende Woche zählt nur mit, wenn das Ziel dort schon erreicht ist;
// sie bricht die Serie aber nicht ab, solange sie noch läuft.
function getWeekStreak() {
  const target = getWeeklyTarget();
  const counts = {};
  getSessionKeys(true).forEach(k => {
    const wk = isoWeekKey(k.split(':')[2]);
    counts[wk] = (counts[wk] || 0) + 1;
  });
  let streak = 0;
  const cursor = new Date();
  const currentWeek = isoWeekKey(localDateStr(cursor));
  if ((counts[currentWeek] || 0) >= target) streak++;
  cursor.setDate(cursor.getDate() - 7);
  while (true) {
    const wk = isoWeekKey(localDateStr(cursor));
    if ((counts[wk] || 0) >= target) { streak++; cursor.setDate(cursor.getDate() - 7); }
    else break;
  }
  return streak;
}

function getWeeklyTarget(plan) {
  const p = plan || PLAN_DEFS[activePlanId];
  if (!p) return 3;
  if (p.weeklyTarget) return p.weeklyTarget;
  if (p.schedule) return Object.keys(p.schedule).length;   // Altbestand
  return p.days.length;
}

// Nächster Tag im Zyklus: der auf die zuletzt abgeschlossene Einheit folgende.
// Bewusst kalenderunabhängig – verschiebt sich ein Training, verschiebt sich
// die Reihenfolge mit, statt dass ein Tag übersprungen wird.
function getNextPlannedDay() {
  if (!DAYS.length) return null;
  const dayIds = DAYS.map(d => d.id);
  const lastKey = sortByDate(getSessionKeys(true)
    .filter(k => dayIds.includes(k.split(':')[1])), true)[0];
  if (!lastKey) return { day: DAYS[0], lastDayType: null, lastDate: null };
  const lastDayId = lastKey.split(':')[1];
  const idx = dayIds.indexOf(lastDayId);
  const next = DAYS[(idx + 1) % DAYS.length];
  return { day: next, lastDayType: DAYS[idx]?.type || null, lastDate: lastKey.split(':')[2] };
}

function loadUserPlans() {
  const saved = storageGet('gymbook:userplans');
  if (!saved) return;
  try {
    const plans = typeof saved === 'string' ? JSON.parse(saved) : saved;
    Object.entries(plans).forEach(([id, plan]) => {
      PLAN_DEFS[id] = plan;
      plan.days.forEach(day => { if (day.color && day.color.startsWith('#')) DAY_COLOR_MAP[day.id] = day.color; });
    });
  } catch(e) {}
}

function loadActivePlan() {
  const saved = storageGet('gymbook:activeplan');
  if (saved && PLAN_DEFS[saved]) {
    activePlanId = saved;
    DAYS = PLAN_DEFS[activePlanId].days;
  }
}

function switchPlan(planId) {
  if (!PLAN_DEFS[planId] || planId === activePlanId) return;
  if (editMode) {
    if (!confirm('Du bist noch im Bearbeitungsmodus. Änderungen werden verworfen. Trotzdem wechseln?')) return;
    discardPlanEdits();
  }
  activePlanId = planId;
  DAYS = PLAN_DEFS[activePlanId].days;
  storageSet('gymbook:activeplan', planId);
  loadCustomPlan(); // eigene Anpassungen für diesen Plan laden, falls vorhanden
  currentDay = 0;
  activeDate = null;
  sessionStartTime = null;
  renderPlanSwitcher();
  renderNav();
  renderDay();
  if (currentTab === 'home') renderHome();
}

// Sichtbare Pläne = alle außer den ausgeblendeten. Eingebaute Pläne lassen
// sich nicht löschen (sie stehen im Code), aber ausblenden – und jederzeit
// wieder einblenden.
function getHiddenPlanIds() {
  const saved = storageGet('gymbook:hiddenplans');
  if (!saved) return [];
  try { return typeof saved === 'string' ? JSON.parse(saved) : saved; } catch(e) { return []; }
}

function getVisiblePlans() {
  const hidden = getHiddenPlanIds();
  const visible = Object.values(PLAN_DEFS).filter(p => !hidden.includes(p.id));
  // Sicherheitsnetz: nie ohne Plan dastehen
  return visible.length ? visible : Object.values(PLAN_DEFS);
}

function renderPlanSwitcher() {
  const wrap = document.getElementById('plan-switcher');
  if (!wrap) return;
  const plan = PLAN_DEFS[activePlanId];
  const count = getVisiblePlans().length;
  wrap.innerHTML = `
    <button class="plan-select" onclick="openPlanManager()">
      <span class="plan-select-label">Plan</span>
      <span class="plan-select-name">${plan ? esc(plan.shortName) : '—'}</span>
      <span class="plan-select-count">${count}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0"><polyline points="6 9 12 15 18 9"/></svg>
    </button>`;
}

// ── PLANVERWALTUNG ────────────────────────────────────────────
function openPlanManager() {
  const hidden = getHiddenPlanIds();
  const visible = getVisiblePlans();
  const hiddenPlans = Object.values(PLAN_DEFS).filter(p => hidden.includes(p.id));

  const row = (plan) => {
    const active = plan.id === activePlanId;
    const days = plan.days.length;
    const canRemove = visible.length > 1;
    return `
      <div class="plan-row ${active ? 'active' : ''}">
        <div style="flex:1;min-width:0;cursor:pointer" onclick="switchPlan('${plan.id}');closeModal()">
          <div class="plan-row-name">${esc(plan.name)}${active ? ' <span class="plan-row-badge">aktiv</span>' : ''}</div>
          <div class="plan-row-meta">${days} Trainingstage${plan.builtin ? ' · Vorlage' : ''}</div>
        </div>
        ${!plan.builtin ? `<button class="plan-row-btn" onclick="renamePlan('${plan.id}')" aria-label="Umbenennen">✎</button>` : ''}
        ${canRemove ? `<button class="plan-row-btn danger" onclick="${plan.builtin ? `hidePlan('${plan.id}')` : `deleteUserPlan('${plan.id}')`}" aria-label="Entfernen">${plan.builtin ? '⊘' : '🗑'}</button>` : ''}
      </div>`;
  };

  document.getElementById('modal-content').innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Trainingspläne</h2>
    <div style="margin-top:14px">${visible.map(row).join('')}</div>

    <button class="plan-add-btn" onclick="openCreatePlanModal()">+ Neuen Plan erstellen</button>

    ${hiddenPlans.length ? `
      <div style="margin-top:18px">
        <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Ausgeblendet</div>
        ${hiddenPlans.map(p => `
          <div class="plan-row" style="opacity:0.6">
            <div style="flex:1;min-width:0">
              <div class="plan-row-name">${esc(p.name)}</div>
              <div class="plan-row-meta">${p.days.length} Trainingstage · Vorlage</div>
            </div>
            <button class="plan-row-btn" onclick="unhidePlan('${p.id}')">Einblenden</button>
          </div>`).join('')}
      </div>` : ''}

    ${visible.length === 1 ? `<div style="font-family:var(--mono);font-size:12px;color:var(--muted2);margin-top:14px;line-height:1.6">Der letzte verbleibende Plan lässt sich nicht entfernen.</div>` : ''}
  `;
  document.getElementById('modal').style.display = 'flex';
}

function hidePlan(planId) {
  if (getVisiblePlans().length <= 1) return;
  const hidden = getHiddenPlanIds();
  if (!hidden.includes(planId)) hidden.push(planId);
  storageSet('gymbook:hiddenplans', hidden);
  if (activePlanId === planId) {
    const next = getVisiblePlans()[0];
    if (next) switchPlan(next.id);
  }
  renderPlanSwitcher();
  openPlanManager();
}

function unhidePlan(planId) {
  const hidden = getHiddenPlanIds().filter(id => id !== planId);
  storageSet('gymbook:hiddenplans', hidden);
  renderPlanSwitcher();
  openPlanManager();
}

function renamePlan(planId) {
  const plan = PLAN_DEFS[planId];
  if (!plan || plan.builtin) return;
  const name = prompt('Neuer Name für den Plan:', plan.name);
  if (!name || !name.trim()) return;
  plan.name = name.trim();
  plan.shortName = plan.name.length > 16 ? plan.name.slice(0,16) + '…' : plan.name;
  const saved = storageGet('gymbook:userplans');
  const all = saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : {};
  if (all[planId]) { all[planId].name = plan.name; all[planId].shortName = plan.shortName; }
  storageSet('gymbook:userplans', all);
  renderPlanSwitcher();
  openPlanManager();
}

function createNewPlan() {
  const name = document.getElementById('new-plan-name').value.trim();
  if (!name) { alert('Bitte einen Plan-Namen eingeben.'); return; }
  const dayAName = document.getElementById('new-plan-day-a').value.trim() || 'TAG A';
  const dayBName = document.getElementById('new-plan-day-b').value.trim() || 'TAG B';
  const dayCName = document.getElementById('new-plan-day-c').value.trim() || 'TAG C';

  const existingIds = new Set(Object.keys(PLAN_DEFS));
  const planId = makeUniqueId(slugify(name), existingIds);

  // Farbpalette die sich von den bereits verwendeten Tag-Farben abhebt
  const palette = ['#7fd9c9', '#d97fc9', '#c9d97f', '#7f9bd9', '#d9a87f', '#a87fd9'];
  const usedColors = new Set(Object.values(DAY_COLOR_MAP));
  const pickColor = (idx) => palette.find(c => !usedColors.has(c)) || palette[idx % palette.length];

  const dayA = { id: `${planId}_a`, label: 'Montag', type: dayAName.toUpperCase(), color: pickColor(0), duration: '– Min', exercises: [] };
  usedColors.add(dayA.color);
  const dayB = { id: `${planId}_b`, label: 'Mittwoch', type: dayBName.toUpperCase(), color: pickColor(1), duration: '– Min', exercises: [] };
  usedColors.add(dayB.color);
  const dayC = { id: `${planId}_c`, label: 'Freitag', type: dayCName.toUpperCase(), color: pickColor(2), duration: '– Min', exercises: [] };

  const newPlan = {
    id: planId,
    name: name,
    shortName: name.length > 16 ? name.slice(0, 16) + '…' : name,
    days: [dayA, dayB, dayC],
    weeklyTarget: 3,
    builtin: false
  };

  PLAN_DEFS[planId] = newPlan;
  DAY_COLOR_MAP[dayA.id] = dayA.color;
  DAY_COLOR_MAP[dayB.id] = dayB.color;
  DAY_COLOR_MAP[dayC.id] = dayC.color;

  const saved = storageGet('gymbook:userplans');
  const allUserPlans = saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : {};
  allUserPlans[planId] = newPlan;
  storageSet('gymbook:userplans', allUserPlans);

  closeModal();
  // Ein neu angelegter Plan darf nicht als ausgeblendet gelten
  storageSet('gymbook:hiddenplans', getHiddenPlanIds().filter(id => id !== planId));
  switchPlan(planId);
  toggleEditMode(); // direkt in den Plan-Editor, damit sofort Übungen ergänzt werden können
}

function deleteUserPlan(planId) {
  const plan = PLAN_DEFS[planId];
  if (!plan || plan.builtin) return;
  if (!confirm(`Plan "${plan.name}" wirklich löschen?\n\nDeine bisherige Trainingshistorie mit diesem Plan bleibt erhalten — nur der Plan selbst wird entfernt.`)) return;

  delete PLAN_DEFS[planId];
  const saved = storageGet('gymbook:userplans');
  const allUserPlans = saved ? (typeof saved === 'string' ? JSON.parse(saved) : saved) : {};
  delete allUserPlans[planId];
  storageSet('gymbook:userplans', allUserPlans);
  // Altlast aus der früheren Doppelspeicherung ebenfalls entfernen
  const { custom } = readPlanStores();
  if (custom && typeof custom === 'object' && custom[planId]) {
    delete custom[planId];
    storageSet('gymbook:customplan', custom);
  }

  if (activePlanId === planId) {
    const next = getVisiblePlans()[0];
    if (next) switchPlan(next.id);
  }
  renderPlanSwitcher();
  if (document.getElementById('modal').style.display === 'flex') openPlanManager();
}

// Legt gespeicherte Anpassungen über die Tage eines Plans. Wird vom Laden UND
// von der Umstellungs-Selbstprüfung benutzt, damit beide garantiert dasselbe
// Ergebnis liefern.
function applyCustomOverride(baseDays, override) {
  if (!Array.isArray(override)) return baseDays;
  override.forEach((day, di) => {
    if (!baseDays[di] || !day?.exercises) return;
    baseDays[di].exercises = day.exercises.map(ex => ({
      ...ex,
      id: ex.id || slugify(ex.name),      // alte Einträge ohne ID
      alternatives: ex.alternatives || []
    }));
  });
  return baseDays;
}

function loadCustomPlan() {
  const saved = storageGet('gymbook:customplan');
  if (!saved) return;
  try {
    let all = typeof saved === 'string' ? JSON.parse(saved) : saved;
    // Altformat: reines Array statt {planId: [...]} – gehörte immer zu PPL
    if (Array.isArray(all)) all = { ppl: all };
    applyCustomOverride(DAYS, all[activePlanId]);
  } catch(e) {}
}

// ── PLAN-SPEICHERUNG ──────────────────────────────────────────
// Eingebaute Pläne (PPL, Ganzkörper): nur die Anpassungen, in "customplan".
// Eigene Pläne: komplett in "userplans" – früher zusätzlich als zweite Kopie
// in "customplan", was Platz verschwendete und zwei Wahrheiten erzeugte.
// "alternatives" wird nirgends mehr gelesen und nicht mehr gespeichert.
function slimDays(days) {
  return (days || []).map(d => ({
    ...d,
    exercises: (d.exercises || []).map(ex => { const { alternatives, ...rest } = ex; return rest; })
  }));
}

// Gespeicherten Wert lesen: null = fehlt, undefined = unlesbar, sonst Objekt
function parseStored(v) {
  if (v == null) return null;
  if (typeof v !== 'string') return v;
  try { return JSON.parse(v); } catch(e) { return undefined; }
}

function readPlanStores() {
  let custom = parseStored(storageGet('gymbook:customplan'));
  const users = parseStored(storageGet('gymbook:userplans'));
  if (Array.isArray(custom)) custom = { ppl: custom };     // Altformat
  return { custom, users };
}

function persistActivePlan() {
  const plan = PLAN_DEFS[activePlanId];
  const { custom, users } = readPlanStores();
  const customObj = (custom && typeof custom === 'object') ? custom : {};
  const usersObj = (users && typeof users === 'object') ? users : {};

  if (plan.builtin) {
    customObj[activePlanId] = slimDays(DAYS);
    storageSet('gymbook:customplan', customObj);
  } else {
    usersObj[activePlanId] = { ...plan, days: slimDays(DAYS) };
    storageSet('gymbook:userplans', usersObj);
    if (customObj[activePlanId]) {            // Altlast aus der Doppelspeicherung
      delete customObj[activePlanId];
      storageSet('gymbook:customplan', customObj);
    }
  }
}

// Einmalige Umstellung vom alten Format. Läuft bei jedem Laden, ändert aber
// nur etwas, wenn noch Altformat vorliegt. Schreibt NICHTS, wenn die
// Selbstprüfung abweicht oder Daten unlesbar sind.
function migratePlanStorage() {
  try {
    const { custom, users } = readPlanStores();
    if (custom === undefined || users === undefined) return;     // unlesbar → nichts anfassen
    if (!custom && !users) return;
    const oldCustom = (custom && typeof custom === 'object') ? custom : {};
    const oldUsers  = (users  && typeof users  === 'object') ? users  : {};

    const newCustom = {}, newUsers = {};
    Object.entries(oldCustom).forEach(([pid, days]) => {
      const isUserPlan = !!oldUsers[pid] && !PLAN_DEFS[pid]?.builtin;
      if (isUserPlan) return;                                   // wandert nach userplans
      newCustom[pid] = Array.isArray(days) ? slimDays(days) : days;   // inkl. Waisen unverändert lassen
    });
    Object.entries(oldUsers).forEach(([pid, plan]) => {
      const merged = JSON.parse(JSON.stringify(plan));
      applyCustomOverride(merged.days || [], oldCustom[pid]);
      merged.days = slimDays(merged.days);
      newUsers[pid] = merged;
    });

    // Selbstprüfung: jeder Plan muss vor und nach der Umstellung exakt
    // dieselben Übungen ergeben. Eingebaute Pläne gegen ihre unveränderte
    // Vorlage, eigene gegen ihre gespeicherte Definition.
    const effective = (pid, usersSrc, customSrc) => {
      const builtin = PLAN_DEFS[pid]?.builtin;
      const base = builtin
        ? JSON.parse(JSON.stringify(PLAN_DEFS[pid].days))
        : JSON.parse(JSON.stringify(usersSrc[pid]?.days || []));
      return JSON.stringify(slimDays(applyCustomOverride(base, customSrc[pid])));
    };
    const ids = new Set([...Object.keys(oldCustom), ...Object.keys(oldUsers)]);
    for (const pid of ids) {
      if (!PLAN_DEFS[pid]?.builtin && !oldUsers[pid]) continue;        // Waise
      if (effective(pid, oldUsers, oldCustom) !== effective(pid, newUsers, newCustom)) {
        console.error('Plan-Umstellung abgebrochen – Abweichung bei', pid);
        return;
      }
    }

    const customChanged = typeof storageGet('gymbook:customplan') === 'string'
      || JSON.stringify(newCustom) !== JSON.stringify(oldCustom);
    const usersChanged = JSON.stringify(newUsers) !== JSON.stringify(oldUsers);

    if (customChanged && (Object.keys(newCustom).length || custom)) storageSet('gymbook:customplan', newCustom);
    if (usersChanged) {
      storageSet('gymbook:userplans', newUsers);
      Object.entries(newUsers).forEach(([id, plan]) => {          // im Speicher nachziehen
        PLAN_DEFS[id] = plan;
        plan.days.forEach(day => { if (day.color?.startsWith('#')) DAY_COLOR_MAP[day.id] = day.color; });
      });
    }
  } catch(e) { console.error('Plan-Umstellung fehlgeschlagen', e); }
}

function loadCustomCatalog() {
  const saved = storageGet('gymbook:customcatalog');
  if (!saved) return;
  try {
    const custom = typeof saved === 'string' ? JSON.parse(saved) : saved;
    Object.entries(custom).forEach(([key, exercises]) => {
      if (!CATALOG[key] || !Array.isArray(exercises)) return;
      // Migration: altes Format speicherte reine Namens-Strings statt
      // {id, name} Objekte. Ohne diese Umwandlung würde jeder spätere
      // Zugriff auf .name auf einem String scheitern (undefined) und
      // an manchen Stellen (z.B. Muskel-Farbcode) sogar einen Fehler
      // werfen, der das gesamte Rendering der Übungsliste blockiert.
      CATALOG[key].exercises = exercises.map(e => {
        if (typeof e === 'string') return { id: slugify(e), name: e };
        if (e && typeof e === 'object' && e.name) return { id: e.id || slugify(e.name), name: e.name };
        return null;
      }).filter(Boolean);
    });
  } catch(e) {}
}

function saveCustomCatalog() {
  const catalogData = {};
  Object.entries(CATALOG).forEach(([key, cat]) => {
    catalogData[key] = cat.exercises;
  });
  storageSet('gymbook:customcatalog', catalogData);
}

// Default pause time setting
// Pausenzeit-Overrides pro Übung. Werden nur noch GELESEN (Altdaten aus einer
// früheren Version, in der ein Timer-Adjust die Pause dauerhaft überschrieb).
// Ohne Eintrag greift die Pause aus dem Plan.
let defaultPauseOverrides = {}; // exerciseName -> seconds

function loadPauseSettings() {
  const saved = storageGet('gymbook:pausesettings');
  if (saved) defaultPauseOverrides = typeof saved === 'string' ? JSON.parse(saved) : saved;
}

function openEditCatalog(di, ei) {
  catalogTargetDi = di;
  catalogTargetEi = ei;
  catalogEditMode = true;
  catalogActiveMuscle = getMuscleCategoryForExercise(DAYS[di].exercises[ei].name);
  renderCatalog();
  document.getElementById('catalog-modal').style.display = 'flex';
}

function addExercise(di) {
  const name = document.getElementById('new-ex-name').value.trim();
  const muscle = document.getElementById('new-ex-muscle').value.trim();
  const sets = parseInt(document.getElementById('new-ex-sets').value) || 3;
  const reps = document.getElementById('new-ex-reps').value.trim() || '8–12';
  const pause = document.getElementById('new-ex-pause').value.trim() || '90 Sek';
  if (!name) return;

  // Generate a unique id for this new exercise
  const allExistingIds = new Set();
  Object.values(CATALOG).forEach(cat => cat.exercises.forEach(e => allExistingIds.add(e.id)));
  const newId = makeUniqueId(slugify(name), allExistingIds);

  const newEx = { id: newId, name, muscle, sets, reps, pause, alternatives: [] };
  DAYS[di].exercises.push(newEx);
  if (editDraft) editDraft[di].exercises.push({ ...newEx });

  // Also add to catalog if not already there
  addToCatalog(name, muscle, newId);

  renderDay();
}

function addToCatalog(name, muscle, exId) {
  const id = exId || (() => {
    const allExistingIds = new Set();
    Object.values(CATALOG).forEach(cat => cat.exercises.forEach(e => allExistingIds.add(e.id)));
    return makeUniqueId(slugify(name), allExistingIds);
  })();

  // Find best matching catalog key by muscle label
  const key = Object.entries(CATALOG).find(([k, cat]) =>
    cat.label.toLowerCase() === muscle.toLowerCase() ||
    muscle.toLowerCase().includes(cat.label.toLowerCase())
  )?.[0];

  const targetKey = key || Object.keys(CATALOG)[0];
  if (!CATALOG[targetKey].exercises.some(e => e.name === name)) {
    CATALOG[targetKey].exercises.push({ id, name });
  }
}

function deleteEditExercise(di, ei) {
  if (DAYS[di].exercises.length <= 1) return; // mindestens eine Übung behalten
  DAYS[di].exercises.splice(ei, 1);
  if (editDraft) editDraft[di].exercises.splice(ei, 1);
  renderDay();
}

              <option value="1.25" ${(ex.step||2.5)==1.25?'selected':''}>1.25 kg</option>
              <option value="2.5"  ${(ex.step||2.5)==2.5?'selected':''}>2.5 kg</option>
              <option value="5"    ${(ex.step||2.5)==5?'selected':''}>5 kg</option>
            </select>
          </div>
          <div class="edit-field">
            <label>Aufwärmen</label>
            <select id="edit-warmup-${di}-${ei}" style="background:var(--field);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:16px;padding:8px;border-radius:4px;width:100%;outline:none;">
              <option value="" ${!Number.isInteger(ex.warmup)?'selected':''}>Auto</option>

  });
  // Bestehende Übung aus Katalog hinzufügen (ohne komplett neue anzulegen)
  html += `
    <button class="edit-save-btn" style="width:100%;margin-top:8px;background:var(--bg3);color:var(--accent);border:1px dashed color-mix(in srgb, var(--accent) 40%, transparent)" onclick="openAddFromCatalog(${di})">+ Übung aus Katalog hinzufügen</button>
  `;
  // New exercise form
  html += `
    <div class="edit-new-ex">
      <div class="edit-new-ex-title">+ Neue Übung hinzufügen</div>
      <div class="edit-new-ex-fields">
        <div class="edit-field" style="grid-column:1/-1">
          <label>Übungsname</label>
          <input type="text" id="new-ex-name" placeholder="z.B. Hammercurl einarmig">
        </div>
        <div class="edit-field" style="grid-column:1/-1">
          <label>Muskelgruppe</label>
          <select id="new-ex-muscle" style="background:var(--field);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:16px;padding:8px;border-radius:4px;width:100%;outline:none;">
            ${Object.entries(CATALOG).map(([k, cat]) => `<option value="${cat.label}">${cat.label}</option>`).join('')}
          </select>
        </div>
        <div class="edit-field">
          <label>Sätze</label>
          <input type="number" id="new-ex-sets" value="3" min="1" max="8">
        </div>
        <div class="edit-field">
          <label>Wdh.</label>
          <input type="text" id="new-ex-reps" placeholder="8–12">
        </div>
        <div class="edit-field">
          <label>Pause</label>

        </div>
      </div>
      <button class="edit-save-btn" style="width:100%;margin-top:8px" onclick="addExercise(${di})">+ Hinzufügen</button>

  `;

  document.getElementById('main-content').innerHTML = html;
  document.getElementById('main-content').style.paddingBottom = '80px';
}

function renderNav() {
  const nav = document.getElementById('day-nav');
  nav.innerHTML = DAYS.map((d,i) => {
    const isHex = typeof d.color === 'string' && d.color.startsWith('#');
    const active = i === currentDay;
    const btnClass = !isHex && active ? `nav-btn active-${d.color}` : 'nav-btn';
    const btnStyle = isHex && active ? `border-color:${d.color};color:${d.color};background:${d.color}22` : '';
    const dotClass = isHex ? 'dot' : `dot dot-${d.color}`;
    const dotStyle = isHex ? `background:${d.color}` : '';
    return `
      <button class="${btnClass}" style="${btnStyle}" onclick="switchDay(${i})">
        <span class="${dotClass}" style="${dotStyle}"></span>${esc(d.type)}
      </button>
    `;
  }).join('');
}

function renderDay() {
  if (editMode) { renderEditDay(); return; }
  renderSafely('renderDay', renderDayInner, 'main-content', true);
}

// Fängt Fehler beim Aufbau einer Seite ab und zeigt sie im Inhaltsbereich an,
// statt eine leere oder halb aufgebaute Seite zu hinterlassen.
function renderSafely(name, fn, containerId, withHint) {
  try {
    fn();
  } catch (err) {
    console.error(`${name} Fehler:`, err);
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = `
      <div style="padding:16px;background:color-mix(in srgb, var(--red) 8%, transparent);border:0.5px solid color-mix(in srgb, var(--red) 30%, transparent);border-radius:10px${withHint ? ';margin-top:10px' : ''}">
        <div style="font-family:var(--mono);font-size:13px;color:var(--red);font-weight:600;margin-bottom:8px">⚠ Rendering-Fehler</div>
        <div style="font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.6;word-break:break-word">${esc((err && err.message) || String(err))}</div>
        ${withHint ? '<div style="font-family:var(--mono);font-size:12px;color:var(--muted2);margin-top:10px">Screenshot davon hilft, den Fehler zu finden.</div>' : ''}
      </div>
    `;
  }
}

function renderDayInner() {
  const day = DAYS[currentDay];
  loadSessionData();
  const date = activeDateStr();
  const isBackEntry = date !== todayStr();
  // Kopfzeile zeigt den gewählten Trainingstag + das echte Datum. Der früher
  // fest hinterlegte Wochentag (day.label) wäre bei Rotation irreführend –
  // "Montag" stünde dann auch an einem Dienstag.
  document.getElementById('today-date').textContent = `${day.type} · ${formatDate(date)}`;

  // Week stats
  // Montag der laufenden Woche. Vorher: getDate() - getDay() + 1 – das sprang
  // am Sonntag (getDay() = 0) auf den NÄCHSTEN Montag, die Woche zeigte 0/3.
  const weekStart = new Date();
  weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
  const weekStartStr = localDateStr(weekStart);
  const weekKeys = getSessionKeys(true).filter(k => k.split(':')[2] >= weekStartStr);
  const weekDone = weekKeys.length;
  const weekTotal = getWeeklyTarget();

  // Load session note
  const noteKey = `gymbook:note:${day.id}:${date}`;
  const savedNote = storageGet(noteKey) || '';

  let html = `
    <div class="session-meta">
      <span class="session-label">${weekdayFromDate(date)}</span>
      <div class="session-date-wrap">
        <input type="date" id="session-date-picker" class="date-picker" value="${date}" max="${todayStr()}" onchange="setActiveDate(this.value)">
        ${isBackEntry ? '<span class="back-entry-badge">Nachtrag</span>' : ''}
      </div>
      <span class="session-note">${day.duration}</span>
    </div>
    <div class="week-stats">
      <div class="week-stat-pills">
        ${Array.from({length: weekTotal}, (_, i) => `<div class="week-pill ${i < weekDone ? 'done' : ''}"></div>`).join('')}
        <span class="week-stat-label">Diese Woche ${weekDone}/${weekTotal}</span>
      </div>
      <div style="display:flex;gap:6px">
        <button class="expand-all-btn" onclick="toggleAllExercises(true)" style="font-size:16px;padding:2px 12px">+</button>
        <button class="expand-all-btn" onclick="toggleAllExercises(false)" style="font-size:16px;padding:2px 12px">−</button>
      </div>
    </div>
  `;

  displayOrder(day).forEach(ei => {
    const ex = day.exercises[ei];
    const ss = supersetInfo(day, ei);
    // Supersatz: beide Karten in einem gemeinsamen Rahmen
    if (ss?.first) {
      html += `<div class="superset-group">
        <div class="superset-head">
          <span>⛓ Supersatz · Pause nach beiden</span>
          <button onclick="setSessionSupersets(supersetPairs(DAYS[currentDay]).filter(([a]) => a !== ${ei}))">Auflösen</button>
        </div>`;
    }
    const sd = sessionData[ei] || { sets: [] };
    const swappedName = swappedExercises[ei] || null;
    const displayName = swappedName || ex.name;
    const displayId = swappedExerciseIds[ei] || ex.id || slugify(ex.name);
    const lastEntry = getLastEntryById(displayId, displayName) || getLastEntry(day.id, ei);
    const suggestion = suggestionFor(displayId, displayName, ex, lastEntry);

    // Gewichtsvorschlag als eigener Block rechts – die Zahl, die beim
    // Rangehen ans Gerät zählt. Delta kommt aus der echten Schrittweite
    // der Übung (vorher war "+2,5 kg" fest verdrahtet und bei step=5 falsch).
    let suggLabel = '';
    if (suggestion) {
      const delta = Math.round((suggestion.weight - suggestion.prevWeight) * 100) / 100;
      const deltaStr = delta > 0 ? `↑${delta}` : 'halten';
      const col = delta > 0 ? 'var(--accent3)' : 'var(--accent)';
      suggLabel = `<div class="sugg-block">
        <div class="sugg-value" style="color:${col}">${suggestion.weight}</div>
        <div class="sugg-unit">kg · ${deltaStr}</div>
      </div>`;
    }

    // Farbiger Rand nach Muskelgruppe
    const muscleColor = MUSCLE_COLORS[muscleCategory(displayId, displayName, ex.muscle)] || 'var(--muted2)';
    const stagnation = sd.skipped ? null : getStagnation(displayId, displayName);

    // Determine active set count (plan default or user-adjusted)
    const activeSets = (sessionData[ei] && sessionData[ei].activeSets != null)
      ? sessionData[ei].activeSets
      : ex.sets;

    const totalSets = activeSets;
    const doneSets = (sessionData[ei]?.sets || []).filter(s => s.done).length;

    // Skip state
    const skipData = sessionData[ei]?.skipped || null;

    // Progress dots – show X if skipped
    const progressDots = skipData
      ? `<span style="font-family:var(--mono);font-size:12px;color:var(--red)">✕ Übersprungen</span>`
      : Array.from({length: totalSets}, (_, i) =>
          `<div class="progress-bar ${i < doneSets ? 'done' : ''}"></div>`
        ).join('');

    html += `
      <div class="exercise-card" style="box-shadow:inset 4px 0 0 ${skipData ? 'var(--red)' : muscleColor};${skipData ? 'opacity:0.6' : ''}">
        <div class="exercise-header" onclick="toggleEx(${ei}, this)">
          <div style="flex:1;min-width:0">
            <div class="ex-title-row">
              <span class="ex-name">${esc(displayName)}${swappedName ? ' <span style="font-size:12px;color:var(--legs);font-family:var(--mono);font-weight:400">(ersetzt)</span>' : ''}</span>
              <span class="ex-target">${esc(ex.reps)}</span>
            </div>
            <div class="progress-dots">${progressDots}</div>
            ${skipData ? `<div style="font-family:var(--mono);font-size:12px;color:var(--red);margin-top:2px">${esc(skipData.reason)}</div>` : ''}
            ${stagnation ? `<div class="stag-hint">⚠ Seit ${stagnation.sessions} Einheiten kein Fortschritt</div>` : ''}
          </div>
          ${suggLabel}
          ${timerExerciseName === displayName && document.getElementById('timer-overlay')?.style.display !== 'none' ? '<span style="font-family:var(--mono);font-size:12px;color:var(--accent);margin-left:4px">⏱</span>' : ''}
          <svg class="ex-chevron" id="chev-${ei}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="exercise-body" id="exbody-${ei}">
          <div style="display:flex;justify-content:flex-end;margin-bottom:8px;gap:6px;flex-wrap:wrap">
            <button class="swap-btn ${ss ? 'active' : ''}" onclick="event.stopPropagation();openSupersetPicker(${ei})">${ss ? '⛓ Supersatz lösen' : '⛓ Supersatz'}</button>
            <button class="swap-btn ${swappedName ? 'active' : ''}" onclick="event.stopPropagation();openCatalog(${ei})">⇄ Übung tauschen</button>
            ${swappedName ? `<button class="swap-btn" style="color:var(--red);border-color:var(--red)" onclick="event.stopPropagation();resetSwap(${ei})">↺ Zurücksetzen</button>` : ''}
            ${skipData
              ? `<button class="swap-btn" style="color:var(--accent);border-color:var(--accent)" onclick="event.stopPropagation();unskipExercise(${ei})">↩ Wiederholen</button>`
              : `<button class="swap-btn" style="color:var(--red);border-color:color-mix(in srgb, var(--red) 30%, transparent)" onclick="event.stopPropagation();openSkipModal(${ei})">✕ Überspringen</button>`
            }
          </div>
          ${skipData ? `
            <div style="background:color-mix(in srgb, var(--red) 6%, transparent);border:0.5px solid color-mix(in srgb, var(--red) 20%, transparent);border-radius:6px;padding:12px;text-align:center">
              <div style="font-family:var(--mono);font-size:13px;color:var(--red)">Übung übersprungen</div>
              <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px">${esc(skipData.reason)}</div>
            </div>
          ` : `
          <div class="ex-detail-meta">${esc(ex.muscle)} · ${esc(ex.sets)} Sätze · Pause ${esc(ex.pause)}</div>
          <div class="sets-header">
            <span>Satz</span><span>Gewicht</span><span></span><span>Wdh.</span><span></span><span></span>
          </div>
          `}
    `;

    // Ensure sessionData has enough set slots
    if (!sessionData[ei]) sessionData[ei] = { sets: [], activeSets: ex.sets };
    while (sessionData[ei].sets.length < activeSets) {
      sessionData[ei].sets.push({ weight: '', reps: '', done: false });
    }

    const step = ex.step || 2.5;

    // Aufwärmsätze: eigene Zeilen "W" vor den Arbeitssätzen. Sie liegen
    // getrennt in slot.warmup – Rekorde, Vorschläge, Volumen und Satzzähler
    // lesen nur slot.sets und bleiben davon unberührt.
    const warmCount = skipData ? 0 : getWarmupCount(day, ei);
    if (warmCount) {
      if (!Array.isArray(sessionData[ei].warmup)) sessionData[ei].warmup = [];
      while (sessionData[ei].warmup.length < warmCount) sessionData[ei].warmup.push({ weight: '', reps: '', done: false });
      const workWeight = suggestion ? suggestion.weight : Math.max(0, ...loggedSets(lastEntry).map(st => parseFloat(st.weight) || 0));
      warmupTargets(warmCount, workWeight, step).forEach((t, k) => {
        const w = sessionData[ei].warmup[k];
        html += `
        <div class="set-row warmup-row">
          <span class="set-num">W</span>
          <input class="set-input ${w.done?'done':''}" id="ww-${ei}-${k}" type="number" step="${step}" min="0" placeholder="${esc(t.weight || '—')}" value="${esc(w.weight)}" oninput="markDirty()" onchange="autoSave()">
          <div></div>
          <input class="set-input ${w.done?'done':''}" id="wr-${ei}-${k}" type="number" min="0" placeholder="${t.reps}" value="${esc(w.reps)}" oninput="markDirty()" onchange="autoSave()">
          <div></div>
          <button class="check-btn ${w.done?'checked':''}" id="wchk-${ei}-${k}" onclick="toggleWarmup(${ei},${k})">✓</button>
        </div>`;
      });
    }

    const targets = setTargets(lastEntry, ex.reps, suggestion, activeSets);
    if (!skipData) {
    for (let s = 0; s < activeSets; s++) {
      const setData = sessionData[ei].sets[s] || { weight: '', reps: '', done: false };
      const suggWeight = suggestion ? suggestion.weight : '';
      const placeholder = setData.weight ? '' : (suggWeight ? `${suggWeight}` : (lastEntry ? lastEntry[s]?.weight || '—' : '—'));
      const repsPlaceholder = targets[s]?.reps !== '' && targets[s]?.reps != null ? targets[s].reps : ex.reps.split(/[–\-]/)[0];
      html += `
        <div class="set-row" id="set-row-${ei}-${s}">
          <span class="set-num">${s+1}</span>
          <input class="set-input ${setData.done?'done':''}" id="w-${ei}-${s}" type="number" step="${step}" min="0" placeholder="${esc(placeholder)}" value="${esc(setData.weight)}" oninput="markDirty()" onchange="autoSave()">
          <div class="quick-btns">
            <button onclick="adjustWeight(${ei},${s},${step})">+</button>
            <button onclick="adjustWeight(${ei},${s},-${step})">−</button>
          </div>
          <input class="set-input ${setData.done?'done':''}" id="r-${ei}-${s}" type="number" min="0" placeholder="${esc(repsPlaceholder)}" value="${esc(setData.reps)}" oninput="markDirty()" onchange="autoSave()">
          <div class="quick-btns">
            <button onclick="adjustReps(${ei},${s},1)">+</button>
            <button onclick="adjustReps(${ei},${s},-1)">−</button>
          </div>
          <button class="check-btn ${setData.done?'checked':''}" id="chk-${ei}-${s}" onclick="toggleDone(${ei},${s})">✓</button>
        </div>

    }
    } // end !skipData for sets

    // + / - set buttons
    if (!skipData) {
    html += `
      <div class="set-adjust-row">
        ${activeSets > 1 ? `<button class="set-adj-btn set-adj-minus" onclick="adjustSets(${ei}, -1)">− Satz entfernen</button>` : ''}
        <button class="set-adj-btn set-adj-plus" onclick="adjustSets(${ei}, 1)">+ Satz hinzufügen</button>
        ${activeSets !== ex.sets ? `<button class="set-adj-btn set-adj-reset" onclick="adjustSets(${ei}, 0)">↺ ${ex.sets} Sätze (Plan)</button>` : ''}
      </div>
    `;
    } // end !skipData

    if (ex.note) {
      html += `<div class="ex-note ${ex.warn?'warning':''}">${esc(ex.note)}</div>`;
    }

    // Last session + suggestion detail
    if (lastEntry) {
      // Auch Körpergewichtsübungen (nur Wiederholungen, kein Gewicht) anzeigen
      const filledSets = lastEntry.filter(s => s.weight || s.reps);
      if (filledSets.length) {
        html += `
          <div class="history-section">
            <div class="history-title">LETZTE EINHEIT</div>
            ${lastEntry.map((s,i) => {
              if (!s.weight && !s.reps) return '';
              const { high } = parseRepRange(ex.reps);
              const exceeded = s.reps && parseInt(s.reps) > high;
              const value = s.weight
                ? `${esc(s.weight)} kg × ${esc(s.reps || '—')} Wdh.`
                : `${esc(s.reps)} Wdh.`;
              return `<div class="history-entry">
                <span class="history-date">Satz ${i+1}</span>
                <span class="history-sets ${exceeded ? 'history-exceeded' : ''}">${value}${exceeded ? ' ↑' : ''}</span>
              </div>`;
            }).join('')}
            ${suggestion ? `<div class="sugg-detail">${
              suggestion.reason === 'upfast'
                ? `Alle Sätze bei ${suggestion.high} Wdh. mit 3+ in Reserve – doppelter Schritt`
              : suggestion.reason === 'learnfast'
                ? `Alle Sätze bei ${suggestion.high} Wdh. – Erhöhungen steckst du hier gut weg, daher doppelter Schritt`
              : suggestion.reason === 'confirm'
                ? `Obergrenze geschafft – nach Erhöhungen brachen die Wdh. hier zuletzt oft ein, daher erst noch einmal bestätigen`
              : suggestion.reason === 'up'
                ? `Alle Sätze bei ${suggestion.high} Wdh. – Zeit für mehr Gewicht`
                : suggestion.reason === 'below'
                  ? `Noch unter ${suggestion.low} Wdh. – Gewicht halten`
                  : `Ziel ${suggestion.low}–${suggestion.high} noch nicht voll – Gewicht halten`
            }</div>
            ${targets.some(t => t.reps !== '') ? `<div class="sugg-detail" style="font-style:normal;color:var(--text)">Ziel heute: ${esc(suggestion.weight)} kg × ${targets.map(t => t.reps).join(' · ')} Wdh.</div>` : ''}` : ''}
          </div>
        `;
      }
    }

    html += `</div></div>`;
    if (ss && !ss.first) html += `</div>`;   // Supersatz-Rahmen schließen
  });

  document.getElementById('main-content').innerHTML = html;
  document.getElementById('main-content').style.paddingBottom = '120px';

  // Note field at bottom
  const noteWrap = document.createElement('div');
  noteWrap.className = 'note-wrap';
  noteWrap.style.marginTop = '8px';
  noteWrap.innerHTML = `
    <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Notiz zur Einheit</div>
    <textarea class="session-note-input" id="session-note" placeholder="Wie war das Training heute? (optional)" oninput="saveNote()">${esc(savedNote)}</textarea>
  `;
  document.getElementById('main-content').appendChild(noteWrap);

  // "Training beenden" bewusst ganz am Seitenende statt in der fixierten
  // Fußleiste: dort lag er dauerhaft unter dem Daumen und wurde beim
  // Scrollen zwischen den Sätzen leicht versehentlich getroffen.
  const finishWrap = document.createElement('div');
  finishWrap.className = 'finish-wrap';
  finishWrap.id = 'finish-wrap';
  finishWrap.style.display = 'none';
  finishWrap.innerHTML = `
    <button class="finish-btn-large" id="finish-btn" onclick="showFinishModal()">Training beenden</button>
  `;
  document.getElementById('main-content').appendChild(finishWrap);

  const statusEl = document.getElementById('save-status');
  if (statusEl) {
    const saved = storageGet(getKey(day.id, date));
    const currentText = statusEl.textContent;
    // Don't overwrite cloud status messages
    if (!currentText.includes('☁') && !currentText.includes('⚠')) {
      statusEl.textContent = saved ? `Gespeichert — ${formatDate(date)}` : 'Nicht gespeichert';
      statusEl.className = saved ? 'save-status saved' : 'save-status';
    }
  }
  updateTrainingEnd();
}

// ── AUFWÄRMSÄTZE ──────────────────────────────────────────────
// Im Plan pro Übung einstellbar (ex.warmup = 0–3). Ohne Einstellung gilt die
// Automatik: 2 Aufwärmsätze bei der ERSTEN Übung einer großen Muskelgruppe
// (Brust, Rücken, Beine) im Training. Arme, Schultern und Bauch sind durch
// die vorherigen Übungen meist schon warm.
const AUTO_WARMUP_GROUPS = ['brust', 'ruecken', 'beine'];
const AUTO_WARMUP_SETS = 2;

function slotCategory(day, ei) {
  const ex = day.exercises[ei];
  return muscleCategory(swappedExerciseIds[ei] || ex.id, swappedExercises[ei] || ex.name, ex.muscle);
}

function getWarmupCount(day, ei) {
  const ex = day.exercises[ei];
  if (Number.isInteger(ex.warmup)) return ex.warmup;
  const cat = slotCategory(day, ei);
  if (!AUTO_WARMUP_GROUPS.includes(cat)) return 0;
  for (let j = 0; j < ei; j++) if (slotCategory(day, j) === cat) return 0;
  return AUTO_WARMUP_SETS;
}

// Vorschläge (als Platzhalter) für die Aufwärmsätze: steigend bis ca. 75 %
// des Arbeitsgewichts, mit abnehmenden Wiederholungen. Auf die Schrittweite
// der Übung gerundet.
function warmupTargets(count, workWeight, step) {
  const plans = { 1: [[0.6, 8]], 2: [[0.5, 10], [0.75, 5]], 3: [[0.4, 10], [0.6, 6], [0.8, 3]] };
  const plan = plans[count] || plans[3].slice(0, count);
  return plan.map(([f, reps]) => ({
    weight: workWeight > 0 ? Math.max(step, Math.round(workWeight * f / step) * step) : '',
    reps
  }));
}

function toggleWarmup(ei, k) {
  collectInputValues();
  const w = sessionData[ei]?.warmup?.[k];
  if (!w) return;
  if (!w.done) {
    fillFromPlaceholder(`ww-${ei}-${k}`, w, 'weight');
    fillFromPlaceholder(`wr-${ei}-${k}`, w, 'reps');

// ── SUPERSÄTZE ────────────────────────────────────────────────
// Zwei Übungen im Wechsel: Satz A → kurzer Wechsel → Satz B → volle Pause →
// nächster Satz A … Festlegbar auf zwei Wegen:
//   • im Plan: Übung "mit nächster Übung als Supersatz" (ex.superset)
//   • nur für die aktuelle Einheit, direkt im Training (sessionSupersets)
// Sobald im Training etwas geändert wird, gilt für DIESE Einheit nur noch
// die eigene Liste – der Plan bleibt unverändert.
const SUPERSET_SWITCH_SEC = 15;      // Wechselzeit zwischen den beiden Übungen
let sessionSupersets = null;         // null = Plan-Vorgabe, sonst [[a, b], …]

function planSupersetPairs(day) {
  const pairs = [], used = new Set();
  day.exercises.forEach((ex, i) => {
    if (ex.superset && i + 1 < day.exercises.length && !used.has(i) && !used.has(i + 1)) {
      pairs.push([i, i + 1]); used.add(i); used.add(i + 1);
    }
  });
  return pairs;
}

function supersetPairs(day) {
  const pairs = Array.isArray(sessionSupersets) ? sessionSupersets : planSupersetPairs(day);
  return pairs.filter(([a, b]) => day.exercises[a] && day.exercises[b]);
}

// { partner, first } für eine Übung im Supersatz, sonst null
function supersetInfo(day, ei) {
  for (const [a, b] of supersetPairs(day)) {
    if (ei === a) return { partner: b, first: true };
    if (ei === b) return { partner: a, first: false };
  }
  return null;
}

// Anzeige-Reihenfolge: Supersatz-Partner direkt hintereinander, auch wenn
// sie im Plan nicht nebeneinander stehen. Die Indizes (ei) bleiben dabei
// unverändert – nur die Reihenfolge auf dem Bildschirm ändert sich.
function displayOrder(day) {
  const order = [], placed = new Set();
  day.exercises.forEach((_, ei) => {
    if (placed.has(ei)) return;
    order.push(ei); placed.add(ei);
    const ss = supersetInfo(day, ei);
    if (ss && !placed.has(ss.partner)) { order.push(ss.partner); placed.add(ss.partner); }
  });
  return order;
}

// Wohin geht es nach Satz s von Übung ei? { ei, s, superset?, newExercise? }
//   superset 'switch': von A zu B (nur kurzer Wechsel)
//   superset 'round' : von B zurück zu A (volle Pause)
function nextSetAfter(ei, s) {
  const day = DAYS[currentDay];
  const setsOf = i => sessionData[i]?.activeSets ?? day.exercises[i].sets;
  const open = (i, k) => k < setsOf(i) && !sessionData[i]?.skipped && !sessionData[i]?.sets?.[k]?.done;
  const ss = supersetInfo(day, ei);
  if (ss && !sessionData[ss.partner]?.skipped) {
    if (ss.first && open(ss.partner, s)) return { ei: ss.partner, s, superset: 'switch' };
    if (!ss.first && open(ss.partner, s + 1)) return { ei: ss.partner, s: s + 1, superset: 'round' };
  }
  if (s + 1 < setsOf(ei)) return { ei, s: s + 1 };
  // Nächste Übung in Anzeige-Reihenfolge (übersprungene auslassen)
  const order = displayOrder(day);
  for (let p = order.indexOf(ei) + 1; p < order.length; p++) {
    const j = order[p];
    if (ss && j === ss.partner) continue;
    if (!sessionData[j]?.skipped) return { ei: j, s: 0, newExercise: true };
  }
  return null;
}

function setSessionSupersets(pairs, reopen) {
  sessionSupersets = pairs;
  autoSave();
  renderDay();
  if (reopen != null) reopenCard(reopen);
}

// Knopf "⛓ Supersatz" in der Übungskarte: Partner wählen bzw. auflösen
function openSupersetPicker(ei) {
  const day = DAYS[currentDay];
  if (supersetInfo(day, ei)) {
    setSessionSupersets(supersetPairs(day).filter(([a, b]) => a !== ei && b !== ei), ei);
    return;
  }
  const options = day.exercises
    .map((ex, j) => ({ j, name: swappedExercises[j] || ex.name }))
    .filter(o => o.j !== ei && !supersetInfo(day, o.j) && !sessionData[o.j]?.skipped);
  document.getElementById('modal-content').innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Supersatz</h2>
    <div style="font-size:13px;color:var(--muted);margin:-6px 0 14px;line-height:1.5">
      <b>${esc(swappedExercises[ei] || day.exercises[ei].name)}</b> im Wechsel mit … <br>
      Gilt nur für diese Einheit. Dauerhaft: im Plan-Editor.
    </div>
    ${options.length ? options.map(o => `
      <div class="cat-ex-row" onclick="pairSuperset(${ei}, ${o.j})" style="padding-left:4px;padding-right:4px">
        <span class="cat-ex-name">${esc(o.name)}</span><span class="cat-ex-arrow">⛓</span>
      </div>`).join('') : '<div style="color:var(--muted);font-size:14px">Keine freie Übung mehr an diesem Tag.</div>'}
  `;
  document.getElementById('modal').style.display = 'flex';
}

function pairSuperset(a, b) {
  closeModal();
  const pairs = supersetPairs(DAYS[currentDay]).slice();
  pairs.push([Math.min(a, b), Math.max(a, b)]);
  setSessionSupersets(pairs, Math.min(a, b));
}

function parseRepRange(repsStr) {
  const parts = repsStr.split(/[–\-]/);
  if (parts.length === 2) return { low: parseInt(parts[0]), high: parseInt(parts[1]) };
  const single = parseInt(repsStr);
  return { low: single, high: single };
}

// ── LERNENDE STEIGERUNG ───────────────────────────────────────
// Die App wertet aus, wie du bei einer Übung auf Gewichtserhöhungen
// reagierst (letzte 4 Erhöhungen, gemessen am aktuellen Zielbereich):
//   'careful' – mind. die Hälfte der Erhöhungen ließ die Wdh. unter die
//               Untergrenze fallen → erst erhöhen, wenn die Obergrenze in
//               ZWEI Einheiten in Folge geschafft wurde
//   'fast'    – mind. 2 Erhöhungen, alle ohne Einbruch, und dabei trotzdem
//               die Obergrenze erreicht → doppelter Schritt
//   'normal'  – sonst (oder zu wenig Daten)
function topOf(sets) {
  const logged = loggedSets(sets).filter(s => s.weight && s.reps);
  if (!logged.length) return null;
  const w = Math.max(...logged.map(s => parseFloat(s.weight) || 0));
  return { w, reps: logged.filter(s => parseFloat(s.weight) === w).map(s => parseInt(s.reps, 10) || 0) };
}

function learnProgression(exerciseId, exerciseName, repsRange) {
  const { low, high } = parseRepRange(repsRange);
  const none = { mode: 'normal', events: 0, fails: 0, easies: 0 };
  if (isNaN(low) || isNaN(high)) return none;
  // Einheiten chronologisch, ohne das aktive Datum (heute wird ja erst trainiert)
  const date = activeDateStr(), seen = new Set(), sessions = [];
  for (const e of getExerciseEntries(exerciseId, exerciseName)) {
    if (e.date === date || seen.has(e.key) || !hasLoggedData(e.sets)) continue;
    seen.add(e.key);
    sessions.push(e.sets);
  }
  sessions.reverse();
  const events = [];
  for (let i = 1; i < sessions.length; i++) {
    const prev = topOf(sessions[i - 1]), cur = topOf(sessions[i]);
    if (!prev || !cur || !(cur.w > prev.w)) continue;
    events.push({ fail: cur.reps.some(r => r < low), easy: cur.reps.every(r => r >= high) });
  }
  const recent = events.slice(-4);
  const fails = recent.filter(e => e.fail).length, easies = recent.filter(e => e.easy).length;
  let mode = 'normal';
  if (recent.length >= 2 && fails / recent.length >= 0.5) mode = 'careful';
  else if (easies >= 2 && fails === 0) mode = 'fast';
  return { mode, events: recent.length, fails, easies };
}

// Vorschlag inkl. gelerntem Profil – an allen Stellen, die einen Vorschlag
// für eine Übung brauchen (Trainingskarte, Timer)
function suggestionFor(exerciseId, exerciseName, ex, lastEntry) {
  const profile = learnProgression(exerciseId, exerciseName, ex.reps);
  const prevSets = profile.mode === 'careful' ? getLastEntriesById(exerciseId, exerciseName, 2)[1] : null;
  return calcWeightSuggestion(lastEntry, ex.reps, ex.step || 2.5, { profile, prevSets });
}

// Ziel für jeden einzelnen Satz: { weight, reps }.
//   Gewicht erhöht     → Untergrenze anpeilen
//   noch bestätigen    → Obergrenze erneut
//   Gewicht gehalten   → je Satz eine Wdh. mehr als letztes Mal (max. Obergrenze)
function setTargets(lastSets, repsRange, suggestion, count) {
  const { low, high } = parseRepRange(repsRange);
  const lowOk = isNaN(low) ? '' : low;
  if (!suggestion) return Array.from({ length: count }, () => ({ weight: '', reps: lowOk }));
  const increased = suggestion.weight > suggestion.prevWeight;
  const top = topOf(lastSets);
  const fallback = top && top.reps.length ? Math.min(...top.reps) : low;
  return Array.from({ length: count }, (_, s) => {
    let reps;
    if (isNaN(low) || isNaN(high)) reps = '';
    else if (increased) reps = low;
    else if (suggestion.reason === 'confirm') reps = high;
    else {
      const ls = lastSets?.[s];
      const r = ls && parseFloat(ls.weight) === suggestion.prevWeight ? (parseInt(ls.reps, 10) || fallback) : fallback;
      reps = Math.min(high, Math.max(low, r + 1));
    }
    return { weight: suggestion.weight, reps };
  });
}

function calcWeightSuggestion(lastSets, repsTarget, step, opts = {}) {
  const logged = loggedSets(lastSets).filter(s => s.weight && s.reps);
  if (!logged.length) return null;
  const { low, high } = parseRepRange(repsTarget);
  const inc = step || 2.5;

  // Basis ist das SCHWERSTE Gewicht der letzten Einheit – nicht der letzte
  // Satz und kein Durchschnitt über mehrere Einheiten. Beides hatte dich
  // zurückgezogen: bei absteigenden Sätzen (95/95/90) zählte vorher die 90,
  // und bei sauberer Steigerung lag der Durchschnitt unter dem zuletzt
  // tatsächlich bewegten Gewicht.
  const maxWeight = Math.max(...logged.map(s => parseFloat(s.weight) || 0));
  if (!maxWeight || maxWeight <= 0) return null;

  // Nur die Sätze auf diesem Arbeitsgewicht bewerten
  const topSets = logged.filter(s => parseFloat(s.weight) === maxWeight);
  const repsAtTop = topSets.map(s => parseInt(s.reps) || 0);
  if (!repsAtTop.length) return null;

  // Obere Zielgrenze ERREICHT genügt (>=), nicht übertroffen (>).
  const allReachedTop = repsAtTop.every(r => r >= high);
  const allBelowLow  = repsAtTop.every(r => r < low);
  // Alle Sätze auf dem Arbeitsgewicht mit RIR erfasst und ≥ 3 in Reserve:
  // Das Gewicht war deutlich zu leicht – dann ein doppelter Schritt.
  const plentyLeft = topSets.every(s => s.rir !== undefined && s.rir >= 3);

  const mode = opts.profile?.mode || 'normal';
  const base = { prevWeight: maxWeight, high, low, profile: opts.profile };

  // Nur ganze Schritte – halbe Stufen lassen sich am Gerät nicht einstellen.
  if (allReachedTop && plentyLeft) return { ...base, weight: maxWeight + 2 * inc, reason: 'upfast' };
  if (allReachedTop && mode === 'careful') {
    // Erst erhöhen, wenn die Einheit davor auf demselben Gewicht ebenfalls
    // die Obergrenze geschafft hat
    const prev = topOf(opts.prevSets);
    const confirmed = prev && prev.w === maxWeight && prev.reps.every(r => r >= high);
    if (!confirmed) return { ...base, weight: maxWeight, reason: 'confirm' };
  }
  if (allReachedTop && mode === 'fast') return { ...base, weight: maxWeight + 2 * inc, reason: 'learnfast' };
  if (allReachedTop) return { ...base, weight: maxWeight + inc, reason: 'up' };
  if (allBelowLow) return { ...base, weight: maxWeight, reason: 'below' };
  return { ...base, weight: maxWeight, reason: 'hold' };
}

function toggleEx(ei, headerEl) {
  const body = document.getElementById(`exbody-${ei}`);
  const chev = document.getElementById(`chev-${ei}`);
  const open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  chev.classList.toggle('open', !open);
  if (!open && headerEl) {
    setTimeout(() => {
      headerEl.closest('.exercise-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  }
}

// ── TIMER ─────────────────────────────────────────────────────
let timerInterval = null;
let timerEnabled = localStorage.getItem('gymbook:timerEnabled') !== 'false'; // default: an
let timerTotal = 0;
let timerStartTime = null;   // timestamp when timer started
let timerPaused = false;
let timerPausedAt = null;    // remaining seconds when paused
let timerExerciseName = '';
const CIRCUMFERENCE = 2 * Math.PI * 52;

function parsePause(pauseStr) {
  if (!pauseStr) return 120;
  const rangeMatch = pauseStr.match(/(\d+)[–\-](\d+)/);
  if (rangeMatch) return parseInt(rangeMatch[2]);
  const colonMatch = pauseStr.match(/(\d+):(\d+)/);
  if (colonMatch) return parseInt(colonMatch[1]) * 60 + parseInt(colonMatch[2]);
  const secMatch = pauseStr.match(/(\d+)/);
  if (secMatch) return parseInt(secMatch[1]);
  return 120;
}

function getRemainingSeconds() {
  if (!timerStartTime) return 0;
  if (timerPaused) return timerPausedAt;
  const elapsed = (Date.now() - timerStartTime) / 1000;
  return Math.max(0, timerTotal - elapsed);
}


// label: eigener Titel statt "PAUSE · NAME" (z. B. beim Supersatz-Wechsel)
async function startTimer(seconds, exerciseName, ei, s, label) {
  clearInterval(timerInterval);
  timerTotal = seconds;
  timerStartTime = Date.now();
  timerPaused = false;
  timerPausedAt = null;
  timerExerciseName = exerciseName;

  document.getElementById('timer-label').textContent = label || `PAUSE · ${exerciseName.toUpperCase()}`;
  document.getElementById('timer-pause-btn').textContent = 'Pause';
  document.getElementById('timer-overlay').style.display = 'flex';
  document.getElementById('timer-progress').style.stroke = 'var(--accent)';

  renderRirPicker(ei, s);
  // Show next set/exercise info
  showTimerNextInfo(ei, s);

  updateTimerDisplay();
  timerInterval = setInterval(timerTick, 250);
}

// RIR = "Reps in Reserve": wie viele Wiederholungen wären noch gegangen?
// Abgefragt im Pausentimer direkt nach dem Abhaken. 4 steht für "4 oder mehr".
const RIR_OPTIONS = [0, 1, 2, 3, 4];
function renderRirPicker(ei, s) {
  const el = document.getElementById('timer-rir');
  const cur = sessionData[ei]?.sets?.[s]?.rir;
  el.innerHTML = `
    <div class="rir-label">Wie viele Wdh. wären noch gegangen?</div>
    <div class="rir-row">
      ${RIR_OPTIONS.map(v => `<button class="rir-btn ${cur === v ? 'active' : ''}" onclick="setRir(${ei},${s},${v})">${v === 4 ? '4+' : v}</button>`).join('')}
    </div>`;
}

function setRir(ei, s, v) {
  const set = sessionData[ei]?.sets?.[s];
  if (!set) return;
  set.rir = set.rir === v ? undefined : v;   // erneutes Tippen hebt die Auswahl auf
  if (set.rir === undefined) delete set.rir;
  saveSession();
  renderRirPicker(ei, s);
}

function showTimerNextInfo(ei, s) {
  const day = DAYS[currentDay];
  if (!day.exercises[ei]) return;

  // Nächster Satz – bei Supersätzen abwechselnd zwischen beiden Übungen
  const nxt = nextSetAfter(ei, s);
  if (!nxt) {
    document.getElementById('timer-next-info').style.display = 'none';
    return;
  }
  const nextEi = nxt.ei, nextSet = nxt.s, isNextExercise = !!nxt.newExercise;
  const nextEx = day.exercises[nextEi];

  const nextName = swappedExercises[nextEi] || nextEx.name;
  const nextId = swappedExerciseIds[nextEi] || nextEx.id || slugify(nextEx.name);
  const lastEntry = getLastEntryById(nextId, nextName) || getLastEntry(day.id, nextEi);
  const suggestion = suggestionFor(nextId, nextName, nextEx, lastEntry);
  const nextTargets = setTargets(lastEntry, nextEx.reps, suggestion, nextSet + 1);

  // Get current weight/reps from last set of this exercise as default
  const prevSetData = sessionData[nextEi]?.sets?.[nextSet - 1] || sessionData[nextEi]?.sets?.[0];
  const defaultWeight = prevSetData?.weight || (suggestion ? suggestion.weight : '');
  // Bereits eingetragen > Satzziel > Untergrenze
  const ownReps = sessionData[nextEi]?.sets?.[nextSet]?.reps;
  const defaultReps = ownReps || nextTargets[nextSet]?.reps || prevSetData?.reps || nextEx.reps.split(/[–\-]/)[0];

  const infoEl = document.getElementById('timer-next-info');
  const labelEl = document.getElementById('timer-next-label');
  const inputsEl = document.getElementById('timer-next-inputs');

  const activeSetsNext = sessionData[nextEi]?.activeSets ?? nextEx.sets;
  labelEl.textContent = isNextExercise
    ? `Nächste Übung: ${nextName}`
    : `${nxt.superset ? '⛓ ' : ''}Satz ${nextSet + 1} von ${activeSetsNext}: ${nextName}`;

  inputsEl.innerHTML = `
    <div style="text-align:center">
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);margin-bottom:3px">GEWICHT</div>
      <input type="number" id="timer-next-weight" value="${esc(defaultWeight)}" placeholder="${esc(suggestion?.weight || '—')}" style="width:72px">
    </div>
    <div style="text-align:center">
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted2);margin-bottom:3px">WDH.</div>
      <input type="number" id="timer-next-reps" value="${esc(defaultReps)}" placeholder="${esc(nextEx.reps.split(/[–\-]/)[0])}" style="width:60px">
    </div>
  `;

  // Store next exercise ref for applying on close
  infoEl.dataset.nextEi = nextEi;
  infoEl.dataset.nextS = nextSet;
  infoEl.style.display = 'block';
}

function timerTick() {
  if (timerPaused) return;
  const remaining = getRemainingSeconds();
  if (remaining <= 0) {
    clearInterval(timerInterval);
    // Ton nur, wenn das Ende gerade eben bei offener App erreicht wurde –
    // nicht nachträglich beim Zurückkehren aus einer anderen App.
    const overdue = Date.now() - (timerStartTime + timerTotal * 1000);
    if (document.visibilityState === 'visible' && overdue < 2000) playTimerBeep();
    timerStartTime = null;
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    document.getElementById('timer-progress').style.stroke = 'var(--pull)';
    document.getElementById('timer-pause-btn').textContent = 'Fertig';
    document.getElementById('timer-time').textContent = '0:00';
    document.getElementById('timer-progress').style.strokeDashoffset = CIRCUMFERENCE;
  } else {
    updateTimerDisplay();
  }
}

function updateTimerDisplay() {
  const remaining = getRemainingSeconds();
  const m = Math.floor(remaining / 60);
  const s = Math.floor(remaining % 60);
  document.getElementById('timer-time').textContent = `${m}:${String(s).padStart(2,'0')}`;
  const progress = timerTotal > 0 ? remaining / timerTotal : 0;
  const offset = CIRCUMFERENCE * (1 - progress);
  document.getElementById('timer-progress').style.strokeDashoffset = offset;
  document.getElementById('timer-progress').style.strokeDasharray = CIRCUMFERENCE;
  if (remaining > 0 && remaining <= 10) {
    document.getElementById('timer-progress').style.stroke = 'var(--push)';
  } else if (remaining > 0) {
    document.getElementById('timer-progress').style.stroke = 'var(--accent)';
  }
}

function toggleTimerPause() {
  const remaining = getRemainingSeconds();
  if (remaining <= 0) { closeTimer(); return; }
  timerPaused = !timerPaused;
  if (timerPaused) {
    timerPausedAt = remaining;
    document.getElementById('timer-pause-btn').textContent = 'Weiter';
  } else {
    // Recalculate start time based on remaining
    timerStartTime = Date.now() - ((timerTotal - timerPausedAt) * 1000);
    timerPausedAt = null;
    document.getElementById('timer-pause-btn').textContent = 'Pause';
  }
}

function closeTimer() {
  clearInterval(timerInterval);

  // Apply pre-filled next set values if present
  const infoEl = document.getElementById('timer-next-info');
  if (infoEl && infoEl.style.display !== 'none') {
    const nextEi = parseInt(infoEl.dataset.nextEi);
    const nextS = parseInt(infoEl.dataset.nextS);
    const weightEl = document.getElementById('timer-next-weight');
    const repsEl = document.getElementById('timer-next-reps');
    if (!isNaN(nextEi) && !isNaN(nextS) && weightEl && repsEl) {
      if (!sessionData[nextEi]) sessionData[nextEi] = { sets: [] };
      while (sessionData[nextEi].sets.length <= nextS) {
        sessionData[nextEi].sets.push({ weight: '', reps: '', done: false });
      }
      if (weightEl.value) sessionData[nextEi].sets[nextS].weight = weightEl.value;
      if (repsEl.value) sessionData[nextEi].sets[nextS].reps = repsEl.value;
      autoSave();
      // Update visible inputs if exercise is open
      const wEl = document.getElementById(`w-${nextEi}-${nextS}`);
      const rEl = document.getElementById(`r-${nextEi}-${nextS}`);
      if (wEl && weightEl.value) wEl.value = weightEl.value;
      if (rEl && repsEl.value) rEl.value = repsEl.value;
    }
  }

  timerStartTime = null;
  timerPaused = false;
  document.getElementById('timer-overlay').style.display = 'none';
  document.getElementById('timer-progress').style.stroke = 'var(--accent)';
  if (infoEl) infoEl.style.display = 'none';
}

// Resume timer if app comes back from background
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && timerStartTime && !timerPaused) {
    const remaining = getRemainingSeconds();
    if (remaining <= 0) {
      timerTick(); // trigger finish
    } else {
      updateTimerDisplay();
      clearInterval(timerInterval);
      timerInterval = setInterval(timerTick, 250);
    }
  }
});
// ─────────────────────────────────────────────────────────────

// Durchschnittliche Zeit pro Satz aus abgeschlossenen Einheiten – enthält
// automatisch Pausen, Gerätewechsel und Wartezeiten, weil die gemessene
// Gesamtdauer zugrunde liegt. Bevorzugt Einheiten desselben Trainingstags.
function getAvgSecondsPerSet(dayId) {
  const collect = (filterFn) => sortByDate(getSessionKeys(true), true)
    .filter(filterFn)
    .map(k => storageGet(k))
    .filter(r => r && r.durationMin > 0 && r.setsDone > 0)
    .map(r => (r.durationMin * 60) / r.setsDone)
    // Auch beim Lesen absichern: 30 s bis 8 min pro Satz ist der plausible
    // Bereich. Schützt vor Altdaten oder einer Einheit, die versehentlich
    // stundenlang offen lag.
    .filter(sec => sec >= 30 && sec <= 480)
    .slice(0, 5);

  let samples = collect(k => k.split(':')[1] === dayId);
  if (samples.length < 2) samples = collect(() => true);   // sonst über alle Tage
  if (!samples.length) return null;
  return samples.reduce((a, b) => a + b, 0) / samples.length;
}

function calcTrainingEnd() {
  const day = DAYS[currentDay];
  const learned = getAvgSecondsPerSet(day.id);

  let remainingSets = 0;
  let fallbackSeconds = 0;

  day.exercises.forEach((ex, ei) => {
    const sd = sessionData[ei] || { sets: [], activeSets: null };
    if (sd.skipped) return;
    const numSets = sd.activeSets != null ? sd.activeSets : ex.sets;
    const doneSets = (sd.sets || []).filter(s => s.done).length;
    const remaining = Math.max(0, numSets - doneSets);
    if (!remaining) return;
    remainingSets += remaining;

    // Fallback ohne Messwerte: Ausführung + Pause, aber die Pause NACH dem
    // letzten Satz einer Übung zählt nicht mit – danach geht es direkt weiter.
    const displayName = swappedExercises[ei] || ex.name;
    // Supersatz: nach Übung A nur der kurze Wechsel, die Pause zählt bei B
    const ss = supersetInfo(day, ei);
    const pauseSec = ss?.first ? SUPERSET_SWITCH_SEC : (defaultPauseOverrides[displayName] || parsePause(ex.pause));
    const setTimeSec = 40;
    fallbackSeconds += remaining * setTimeSec + Math.max(0, remaining - 1) * pauseSec;
  });

  if (remainingSets <= 0) return null;
  const remainingSeconds = learned ? remainingSets * learned : fallbackSeconds;
  const end = new Date(Date.now() + remainingSeconds * 1000);
  const mark = learned ? '' : '?';   // ? = noch geschätzt, nicht gemessen
  return `Fertig ~${String(end.getHours()).padStart(2,'0')}:${String(end.getMinutes()).padStart(2,'0')} Uhr${mark}`;
}

function updateTrainingEnd() {
  const el = document.getElementById('training-end');
  const finishBtn = document.getElementById('finish-btn');
  if (!el) return;
  const result = calcTrainingEnd();
  if (result) {
    el.textContent = result;
    el.style.display = 'inline';
  } else {
    el.style.display = 'none';
  }
  // Show delete and finish buttons if session has data
  const hasData = Object.values(sessionData).some(s => s.sets?.some(x => x.weight || x.done));
  const finishWrap = document.getElementById('finish-wrap');
  if (finishWrap) finishWrap.style.display = hasData ? 'block' : 'none';
  // Track session start time
  if (hasData && !sessionStartTime) sessionStartTime = Date.now();
}

function deleteSession() {
  const day = DAYS[currentDay];
  const date = activeDateStr();
  if (!confirm(`Einheit vom ${formatDate(date)} wirklich löschen?`)) return;
  // Einheit UND zugehörige Notiz löschen (die Notiz blieb vorher verwaist
  // liegen). Die Schlüssel werden zusätzlich als "gelöscht" vorgemerkt:
  // Klappt der Upload nicht sofort (offline), würde der nächste Abruf aus
  // der Cloud sie sonst wiederherstellen.
  const keys = [getKey(day.id, date), `gymbook:note:${day.id}:${date}`];
  keys.forEach(k => {
    delete cloudData[k];
    try { localStorage.removeItem(k); } catch(e) {}
  });
  markDeletedKeys(keys);
  invalidateExerciseIndex();
  cloudPush();
  loadSessionData();
  renderDay();
  setStatus('Einheit gelöscht', false);
}
